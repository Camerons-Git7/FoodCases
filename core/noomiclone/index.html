<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Unity WebGL Player</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico" />
    <link rel="stylesheet" href="TemplateData/style.css" />
    <style>
      .webgl-content .footer { position: relative; }
      #keybar {
        display: inline-flex;
        align-items: center;
        gap: 16px;
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        height: 38px;
        font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 12px;
        color: rgba(255,255,255,0.85);
        user-select: none;
        -webkit-user-select: none;
      }
      #keybar .key-group {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
      }
      #keybar kbd {
        display: inline-block;
        padding: 2px 6px;
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-size: 11px;
        line-height: 1.4;
        color: #e8e8f0;
        background: rgba(255,255,255,0.1);
        border: 1px solid rgba(255,255,255,0.25);
        border-radius: 4px;
        box-shadow: 0 1px 0 rgba(255,255,255,0.15), inset 0 -1px 0 rgba(0,0,0,0.2);
      }
      #keybar .action {
        color: rgba(255,255,255,0.55);
        font-size: 11px;
      }
      #playOverlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(0,0,0,0.85);
        cursor: pointer;
      }
      #playOverlay.hidden { display: none; }
      #playOverlay .play-btn {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: rgba(0,180,216,0.9);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 6px 24px rgba(0,0,0,0.4);
        transition: transform 0.15s;
      }
      #playOverlay .play-btn:hover { transform: scale(1.1); }
      #playOverlay .play-btn svg {
        width: 32px;
        height: 32px;
        fill: #fff;
        margin-left: 4px;
      }
      #playOverlay .play-text {
        margin-top: 16px;
        font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.05em;
        color: rgba(255,255,255,0.9);
      }
      #playOverlay .loading-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(255,255,255,0.2);
        border-top-color: rgba(0,180,216,1);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      #playOverlay .loading-text {
        margin-top: 12px;
        font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 14px;
        font-weight: 500;
        color: rgba(255,255,255,0.6);
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script src="TemplateData/UnityProgress.js"></script>
    <script src="Build/UnityLoader.js"></script>
    <script>
      var gameLoaded = false;
      var musicStarted = false;
      var unityInstance = UnityLoader.instantiate("unityContainer", "Build/webgl 4.json", {
        onProgress: function(instance, progress) {
          UnityProgress(instance, progress);
          if (progress == 1 && !gameLoaded) {
            gameLoaded = true;
            if (window.parent !== window) {
              window.parent.postMessage({ type: "game-loaded" }, "*");
            }
            showPlayButton();
            tryPlayMusic();
          }
        }
      });
      function showPlayButton() {
        var overlay = document.getElementById("playOverlay");
        if (!overlay) return;
        var loading = overlay.querySelector(".loading-group");
        var playGroup = overlay.querySelector(".play-group");
        if (loading) loading.style.display = "none";
        if (playGroup) playGroup.style.display = "flex";
      }
      function dismissOverlay() {
        var overlay = document.getElementById("playOverlay");
        if (overlay) overlay.classList.add("hidden");
        tryPlayMusic();
        if (window.parent !== window) {
          window.parent.postMessage({ type: "game-started" }, "*");
        }
      }
      function tryPlayMusic() {
        if (musicStarted) return;
        var bgm = document.getElementById("bgMusic");
        if (!bgm || !gameLoaded) return;
        bgm.volume = 0.35;
        bgm.play().then(function() {
          musicStarted = true;
        }).catch(function() {});
      }
      document.addEventListener("click", tryPlayMusic, { once: false });
      document.addEventListener("keydown", tryPlayMusic, { once: false });
      document.addEventListener("touchstart", tryPlayMusic, { once: false });
    </script>
  </head>
  <body>
    <audio id="bgMusic" src="music/bgmusic.mp3" loop preload="auto"></audio>
    <div id="playOverlay" onclick="dismissOverlay()">
      <div class="loading-group" style="display:flex;flex-direction:column;align-items:center;">
        <div class="loading-spinner"></div>
        <span class="loading-text">Loading...</span>
      </div>
      <div class="play-group" style="display:none;flex-direction:column;align-items:center;">
        <div class="play-btn">
          <svg viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"></path>
          </svg>
        </div>
        <span class="play-text">Click to Play</span>
      </div>
    </div>
    <div class="webgl-content">
      <div id="unityContainer" style="width: 1280px; height: 720px"></div>
      <div class="footer">
        <div class="webgl-logo"></div>
        <div id="keybar">
          <span class="key-group"><kbd>←</kbd><span class="action">Arch</span></span>
          <span class="key-group"><kbd>Space</kbd><span class="action">Tuck</span></span>
          <span class="key-group"><kbd>↑</kbd><span class="action">Let Go</span></span>
          <span class="key-group"><kbd>R</kbd><span class="action">Reset</span></span>
        </div>
        <div class="fullscreen" onclick="unityInstance.SetFullscreen(1)"></div>
        <div class="title">Game</div>
      </div>
    </div>
  </body>
</html>
