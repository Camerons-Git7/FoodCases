<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>polytrack</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico"/>
  <style>
    * { margin:0; padding:0; border:0; }
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #000;
      color: #eee;
      font-family: system-ui, sans-serif;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #111;
      z-index: 999;
    }
    #error {
      padding: 20px;
      text-align: center;
      max-width: 90%;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: fixed;
      inset: 0;
      background: #111;
      z-index: 1000;
    }
    iframe {
      display: none;
      width: 100%;
      height: 100%;
      border: none;
      position: fixed;
      inset: 0;
    }
  </style>
</head>
<body>
<div id="loading">
  <div>Loading Game...</div>
  <div style="margin-top:12px; opacity:0.7; font-size:0.9rem;">Please Wait — Loading May Take Up To 1 Minute</div>
</div>
<iframe id="gameframe" allow="fullscreen; gamepad; autoplay" allowfullscreen></iframe>
<div id="error"></div>
<script>
const GAME_URL = "https://raw.githubusercontent.com/CoolDude2349/Offline-HTML-Games-Pack/master/offline/polytrack.html";
// (Camerons-Git7 fork also works, but the original is more stable)

async function start() {
  const loading = document.getElementById('loading');
  const frame = document.getElementById('gameframe');
  const errDiv = document.getElementById('error');

  try {
    const resp = await fetch(GAME_URL);
    if (!resp.ok) {
      throw new Error(`GitHub responded ${resp.status} — maybe rate limit or file moved`);
    }
    const text = await resp.text();

    // Critical fix: write directly into the iframe instead of using a blob: URL
    // blob: origins break WebGL / workers / some APIs in many single-file games
    const doc = frame.contentWindow.document;
    doc.open();
    doc.write(text);
    doc.close();

    // Give the game a moment to start rendering, then show the iframe
    frame.onload = () => {
      loading.style.display = 'none';
      frame.style.display = 'block';
      try { frame.contentWindow.focus(); } catch (_) {}
    };

    // Fallback in case onload already fired
    setTimeout(() => {
      if (loading.style.display !== 'none') {
        loading.style.display = 'none';
        frame.style.display = 'block';
      }
    }, 800);

  } catch (err) {
    loading.style.display = 'none';
    errDiv.style.display = 'flex';
    errDiv.innerHTML = `
      <strong>Failed to load game</strong><br><br>
      ${err.message}<br><br>
      • Check your internet<br>
      • GitHub may be throttling<br>
      • File might have been removed/renamed<br><br>
      Size hint: polytrack.html is currently ~7 MB.
    `;
    console.error(err);
  }
}

start();
</script>
</body>
</html>
