<!DOCTYPE html>
<html>
<head>
    <title>Gust</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico "/>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #frame {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <iframe id="frame"></iframe>
    <script type="module">
        const params = new URLSearchParams(window.location.search);
        const target = params.get("url");
        async function decompress(bytes) {
            if (typeof DecompressionStream !== "undefined") {
                try {
                    const ds = new DecompressionStream("brotli");
                    const stream = new Blob([bytes]).stream().pipeThrough(ds);
                    return new Uint8Array(await new Response(stream).arrayBuffer());
                } catch {}
            }
            const { decompress } = await import("https://cdn.jsdelivr.net/npm/brotli-compress@1.3.3/js.mjs");
            return decompress(bytes);
        }
        async function launch(url) {
            try {
                const res = await fetch(url);
                const bytes = new Uint8Array(await res.arrayBuffer());
                const decoded = await decompress(bytes);
                let html = new TextDecoder().decode(decoded);
                if (target) {
                    const inject = `<style>
.titlebar,.tab-strip-wrapper,.tab-strip,#tabScrollLeft,#tabScrollRight,
.omnibox,.url-bar,.toolbar,#navPillGroup,.tool-btn,#metricsBtn,
#titlebarStatus,.status-pill,button.tab-add,.titlebar * {
display:none!important;height:0!important;overflow:hidden!important;pointer-events:none!important;
}
.app,.content-area,#frame,iframe#frame {
position:fixed!important;top:0!important;left:0!important;width:100%!important;height:100%!important;
margin:0!important;padding:0!important;border:none!important;border-radius:0!important;
}
body,.app{overflow:hidden!important;background:#000!important;}
</style>
<script>
(function(){
const u=${JSON.stringify(target)};
function tryOpen(){
if(typeof createTab==="function"){createTab(u);return;}
if(typeof go==="function"){go(u);return;}
const input=document.getElementById("url");
if(input){input.value=u;input.dispatchEvent(new KeyboardEvent("keydown",{key:"Enter",code:"Enter",keyCode:13,which:13,bubbles:true}));return;}
setTimeout(tryOpen,250);
}
setTimeout(tryOpen,900);
})();
<\/script>`;
                    if (html.includes("</head>")) html = html.replace("</head>", inject + "</head>");
                    else if (html.includes("</body>")) html = html.replace("</body>", inject + "</body>");
                    else html += inject;
                }
                document.getElementById("frame").src = URL.createObjectURL(new Blob([html], { type: "text/html" }));
            } catch (e) {
                alert("Could not load " + url);
            }
        }
        launch("./gust.html.br");
    </script>
</body>
</html>
