<!DOCTYPE html>
<html>
<head>
    <title>Gust</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #frame {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <iframe id="frame"></iframe>
    <script>
        async function launch(url) {
            try {
                const res = await fetch(url);
                const bytes = new Uint8Array(await res.arrayBuffer());
                const decoded = Brotli.decompress(bytes);
                const html = new TextDecoder().decode(decoded);
                document.getElementById('frame').src = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
            } catch (e) {
                alert("Could not load " + url);
            }
        }
        launch('./gust.html.br');
    </script>
</body>
</html>
