<!DOCTYPE html>
<html>
<head>
    <title>Gust</title>
    <!-- One-line global decoder script -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <!-- Just call launch() with the URL you want to open -->
    <button onclick="launch('gust.html.br')">Open App</button>

    <br><br>
    <iframe id="frame" width="100%" height="600px" style="border:1px solid #ccc;"></iframe>

    <script>
        async function launch(url) {
            try {
                // 1. Fetch file byte stream
                const res = await fetch(url);
                const bytes = new Uint8Array(await res.arrayBuffer());

                // 2. Decode the Brotli stream directly to an iframe Blob
                const decoded = Brotli.decompress(bytes);
                const html = new TextDecoder().decode(decoded);

                document.getElementById('frame').src = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
            } catch (e) {
                alert("Could not load " + url);
            }
        }
    </script>

</body>
</html>
