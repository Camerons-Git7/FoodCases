            function sendMessageToUnity(name, value) {

                bridge.game.setLoadingProgress(progress * 100)

                bridge.engine = 'unity'

                    .initialize()

                        // Framework as blob URL so we don't need the .br file
                        const frameworkBlob = new Blob([window.__UNITY_FRAMEWORK_SOURCE__], {type: 'application/javascript'});
                        const frameworkUrl = URL.createObjectURL(frameworkBlob);

                        // Pre-warm browser cache for the two large assets.
                        // We KEEP the original remote URLs (important: they end in .br and the
                        // server sends Content-Encoding so Unity can decompress correctly).
                        // On 2nd+ load the browser / HTTP cache serves them instantly.
                        const DATA_URL = 'https://media.githubusercontent.com/media/Camerons-Git7/FoodCases/main/call-of-duty/Build/Build.data.br';
                        const CODE_URL = 'https://media.githubusercontent.com/media/Camerons-Git7/FoodCases/main/call-of-duty/Build/Build.wasm.br';
                        const CACHE_NAME = 'cod-unity-assets-v1';
                        const CACHED_ASSET_URLS = new Set([DATA_URL, CODE_URL]);

                        // Intercept fetch so Unity's own downloads are served from Cache Storage
                        // when available. Without this, caches.put() alone does nothing for page fetches.
                        (function installAssetFetchInterceptor() {
                            if (window.__codAssetFetchPatched) return;
                            window.__codAssetFetchPatched = true;
                            const origFetch = window.fetch.bind(window);
                            window.fetch = async function(input, init) {
                                const url = typeof input === 'string' ? input : (input && input.url) || '';
                                if (CACHED_ASSET_URLS.has(url)) {
                                    try {
                                        if ('caches' in window) {
                                            const cache = await caches.open(CACHE_NAME);
                                            const hit = await cache.match(url);
                                            if (hit) {
                                                console.log('[COD-Cache] HIT (no network)', url);
                                                return hit.clone();
                                            }
                                        }
                                    } catch (e) {
                                        console.warn('[COD-Cache] match failed', e);
                                    }
                                    // Miss → network, then store
                                    console.log('[COD-Cache] MISS – network', url);
                                    const res = await origFetch(input, init);
                                    if (res && res.ok) {
                                        try {
                                            const cache = await caches.open(CACHE_NAME);
                                            await cache.put(url, res.clone());
                                            try { localStorage.setItem('cod-assets-cached', '1'); } catch (_) {}
                                            console.log('[COD-Cache] stored', url);
                                        } catch (e) {
                                            console.warn('[COD-Cache] store failed', e);
                                        }
                                    }
                                    return res;
                                }
                                return origFetch(input, init);
                            };
                        })();

                        createUnityInstance(
                            CANVAS,
                            {
                                dataUrl: DATA_URL,
                                frameworkUrl: frameworkUrl,
                                codeUrl: CODE_URL,
                                streamingAssetsUrl: 'StreamingAssets',

                                productName: 'MFPSMilitary Combat',
                                productVersion: '0.1',

                            onUnityLoadingProgressChanged)
                            .then((unityInstance) => {
                                window.unityInstance = unityInstance;
                                CANVAS.focus();
                            })
                            .catch((error) => {
                                console.error(error);
                            });

                    })
                    .catch(error => console.error(error))

            window.getStorageData = function(key, storageType) {
                let keys = key.split(STORAGE_KEYS_SEPARATOR)

                bridge.storage.get(keys, storageType, false)
                    .then(data => {
                        if (keys.length > 1) {
                            let values = []

                            for (let i = 0; i < keys.length; i++) {
                                let value = data[i]
                                if (value) {
                                    if (typeof value !== 'string') {
                                        value = JSON.stringify(value)
                                    }

                                    values.push(value)
                                } else {
                                    values.push('')
                                }
                            }

                            sendMessageToUnity('OnGetStorageDataSuccess', `${key}${STORAGE_DATA_SEPARATOR}${values.join(STORAGE_VALUES_SEPARATOR)}`)
                        } else {
                            if (data[0]) {
                                if (typeof data[0] !== 'string') {
                                    data = JSON.stringify(data[0])
                                }
                            } else {
                                data = ''
                            }

                            sendMessageToUnity('OnGetStorageDataSuccess', `${key}${STORAGE_DATA_SEPARATOR}${data}`)
                        }
                    })
                    .catch(error => {
                        sendMessageToUnity('OnGetStorageDataFailed', key)
                    })
            }
