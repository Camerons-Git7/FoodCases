<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>cherri — direct</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; }
  #frame-holder { position:fixed; inset:0; width:100vw; height:100vh; background:#000; }
  #frame-holder iframe { width:100%; height:100%; border:0; margin:0; padding:0; display:block; }
  #status { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
            color:#aaa; font:13px/1.6 ui-monospace,Menlo,Consolas,monospace; background:#0a0a0a;
            text-align:left; padding:24px; box-sizing:border-box; white-space:pre-wrap;
            overflow:auto; z-index:10; }
  #status.hidden { display:none; }
</style>
</head>
<body>

<div id="status">Starting proxy…</div>
<div id="frame-holder"></div>

<script src="./bi1wf/8t6ked.js"></script>
<script src="./bwd9x/9lcbx4.js"></script>

<script>
(function () {
  var statusEl = document.getElementById("status");
  var holder   = document.getElementById("frame-holder");
  var lines = [];
  function log(m) { lines.push(m); statusEl.textContent = lines.join("\n"); console.log("[direct]", m); }
  function fail(m) { log("FAIL: " + m); }

  log("1. location = " + location.href);
  log("2. _nog837i = " + typeof window._nog837i);
  log("3. _wdgvkq9 = " + typeof window._wdgvkq9);
  if (window._wdgvkq9) log("   keys: " + Object.keys(window._wdgvkq9).join(","));
  log("4. SW support = " + ("serviceWorker" in navigator));
  log("5. SW controller = " + (navigator.serviceWorker.controller
        ? navigator.serviceWorker.controller.scriptURL : "(none)"));

  var params = new URLSearchParams(location.search);
  var raw = params.get("url");
  if (!raw) { fail("no ?url="); return; }
  if (!/^https?:\/\//i.test(raw)) raw = "https://" + raw;
  var target = new URL(raw);
  log("6. target = " + target.href);

  function checkScripts() {
    if (typeof window._nog837i === "undefined") {
      log("   !! _nog837i (bi1wf/8t6ked.js) did not load");
    }
    if (typeof window._wdgvkq9 === "undefined") {
      log("   !! _wdgvkq9 (bwd9x/9lcbx4.js) did not load");
    }
  }
  checkScripts();

  // Paths relative to this folder
  var SW_URL      = new URL("v6hxi5.js", location.href).href;
  var WASM_PATH   = new URL("_iyosyjg/_iyosyjg.wasm", location.href).href;
  log("7. SW url   = " + SW_URL);
  log("8. wasm url = " + WASM_PATH);

  // Step A: register the SW if needed
  if (!("serviceWorker" in navigator)) { fail("no SW"); return; }

  navigator.serviceWorker.getRegistrations().then(function (regs) {
    log("9. existing registrations = " + regs.length);
    regs.forEach(function (r) {
      var w = r.active || r.waiting || r.installing;
      log("   - " + r.scope + "  worker=" + (w ? w.scriptURL : "(none)"));
    });
    var ours = regs.find(function (r) {
      var w = r.active || r.waiting || r.installing;
      return w && w.scriptURL.split("/").pop() === "v6hxi5.js";
    });
    if (ours) return ours;
    log("10. registering v6hxi5.js");
    return navigator.serviceWorker.register("v6hxi5.js", { scope: "./" });
  }).then(function () {
    return navigator.serviceWorker.ready;
  }).then(function () {
    log("11. SW ready");
    log("12. controller now = " + (navigator.serviceWorker.controller
          ? navigator.serviceWorker.controller.scriptURL : "(still none)"));
    if (!navigator.serviceWorker.controller) {
      // Try one reload
      if (!sessionStorage.getItem("__d_reload")) {
        sessionStorage.setItem("__d_reload", "1");
        log("13. no controller yet → reloading once");
        setTimeout(function(){ location.reload(); }, 400);
        return new Promise(function(){}); // halt
      } else {
        log("13. still no controller after reload → giving up on SW");
      }
    }
    sessionStorage.removeItem("__d_reload");

    // Step B: build Controller
    if (typeof window._wdgvkq9 === "undefined" || !window._wdgvkq9.Controller) {
      fail("_wdgvkq9.Controller not available");
      return;
    }
    log("14. constructing Controller…");

    var transport = {
      ready: Promise.resolve(true),
      init: function () { return Promise.resolve(); },
      request: function (remote, method, body, headers) {
        log("   fetch " + method + " " + remote.href);
        return fetch(remote.href, { method: method, body: body, headers: headers })
          .then(function (res) {
            return res.arrayBuffer().then(function (buf) {
              return {
                status: res.status,
                statusText: res.statusText,
                headers: Array.from(res.headers),
                body: buf,
              };
            });
          });
      },
      connect: function () { throw new Error("WebSocket not supported"); },
    };

    var controller;
    try {
      controller = new window._wdgvkq9.Controller({
        transport: transport,
        serviceworker: navigator.serviceWorker,
        config: { wasmPath: WASM_PATH },
      });
    } catch (e) {
      fail("Controller ctor: " + e.message);
      return;
    }
    log("15. controller.prefix = " + controller.prefix);

    controller.wait().then(function () {
      log("16. controller ready");
      var iframe = document.createElement("iframe");
      iframe.setAttribute("allow", "clipboard-read; clipboard-write; fullscreen; autoplay");
      iframe.setAttribute("allowfullscreen", "true");
      holder.appendChild(iframe);

      var frame = controller.createFrame(iframe, { plugins: [] });
      log("17. frame.prefix = " + frame.prefix);
      log("18. frame.go(" + target.href + ")");
      frame.go(target.href);

      iframe.addEventListener("load", function () {
        log("19. iframe load fired");
      });
      setTimeout(function () {
        log("20. iframe.src now = " + iframe.src);
        log("21. iframe.contentWindow.location = " +
            (iframe.contentWindow ? iframe.contentWindow.location.href : "(null)"));
      }, 3000);
    }).catch(function (e) {
      fail("controller.wait(): " + e.message);
    });
  }).catch(function (e) {
    fail("SW setup: " + (e && e.message ? e.message : String(e)));
  });
})();
</script>
</body>
</html>
