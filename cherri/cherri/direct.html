<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>cherri — direct</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; }
  #frame-holder { position:fixed; inset:0; width:100vw; height:100vh; background:#000; }
  #frame-holder iframe { width:100%; height:100%; border:0; margin:0; padding:0; display:block; }
  #status { position:fixed; inset:0; display:flex; align-items:flex-start; justify-content:flex-start;
            color:#ddd; font:12px/1.5 ui-monospace,Menlo,Consolas,monospace; background:#0a0a0a;
            text-align:left; padding:16px; box-sizing:border-box; white-space:pre-wrap;
            overflow:auto; z-index:10; }
  #status.hidden { display:none; }
</style>
</head>
<body>

<div id="status">Starting proxy…</div>
<div id="frame-holder"></div>

<script src="./bi1wf/8t6ked.js"></script>
<script src="./bwd9x/9lcbx4.js"></script>

<script>
(function () {
  var statusEl = document.getElementById("status");
  var holder   = document.getElementById("frame-holder");
  var lines = [];
  var stage = "init";
  function log(m)  { lines.push(m); statusEl.textContent = lines.join("\n"); }
  function fail(m) { log("FAIL: " + m); }
  function hide()  { statusEl.classList.add("hidden"); }

  setTimeout(function () {
    if (!statusEl.classList.contains("hidden")) {
      log(""); log("--- still running after 25s ---"); log("stage = " + stage);
    }
  }, 25000);

  var params = new URLSearchParams(location.search);
  var raw = params.get("url");
  if (!raw) { fail("Missing ?url= parameter."); return; }
  if (!/^https?:\/\//i.test(raw) && raw.indexOf("cherri://") !== 0) raw = "https://" + raw;
  var target;
  try { target = new URL(raw); } catch (e) { fail("Invalid URL: " + raw); return; }

  if (!("serviceWorker" in navigator)) { fail("No SW support."); return; }
  if (!window._wdgvkq9 || !window._wdgvkq9.Controller) { fail("Runtime not loaded."); return; }

  // Match the production build's hashed names (see index.html's bundle).
  var RUNTIME_PATH = new URL("bi1wf/8t6ked.js",   location.href).href;
  var WASM_PATH    = new URL("bi1wf/ri1n3t.wasm", location.href).href;

  // ---- 1. Probe required files -------------------------------------------
  stage = "probe-sw-deps";
  Promise.all([
    fetch("9vcrck.js",         { method: "HEAD" }).then(function (r) { return { name: "9vcrck.js",         ok: r.ok, status: r.status }; }),
    fetch("bwd9x/vzyras.js",   { method: "HEAD" }).then(function (r) { return { name: "bwd9x/vzyras.js",   ok: r.ok, status: r.status }; }),
    fetch("bi1wf/8t6ked.js",   { method: "HEAD" }).then(function (r) { return { name: "bi1wf/8t6ked.js",   ok: r.ok, status: r.status }; }),
    fetch("bi1wf/ri1n3t.wasm", { method: "HEAD" }).then(function (r) { return { name: "bi1wf/ri1n3t.wasm", ok: r.ok, status: r.status }; })
  ]).then(function (results) {
    results.forEach(function (r) { log("probe " + r.name + " → " + r.status + (r.ok ? "" : "  ** MISSING **")); });
    var missing = results.filter(function (r) { return !r.ok; });
    if (missing.length) { fail("Files missing: " + missing.map(function(r){return r.name;}).join(", ")); return; }
    startController();
  }).catch(function (e) { fail("probe failed: " + (e && e.message ? e.message : String(e))); });

  // ---- 2. SW registration ------------------------------------------------
  function ensureSW() {
    return navigator.serviceWorker.getRegistrations().then(function (regs) {
      for (var i = 0; i < regs.length; i++) {
        var w = regs[i].active || regs[i].waiting || regs[i].installing;
        if (w && w.scriptURL.split("/").pop() === "v6hxi5.js") return regs[i];
      }
      log("registering v6hxi5.js");
      return navigator.serviceWorker.register("v6hxi5.js", { scope: "./" });
    }).then(function () {
      return navigator.serviceWorker.ready;
    });
  }

  function startController() {
    stage = "ensure-sw";
    ensureSW().then(function (registration) {
      log("SW ready, controller = " + (navigator.serviceWorker.controller ? "yes" : "no"));
      stage = "wait-for-control";
      return waitFor(function () {
        return navigator.serviceWorker.controller &&
               navigator.serviceWorker.controller.scriptURL.split("/").pop() === "v6hxi5.js";
      }, 5000).then(
        function () { log("SW is controlling this page"); return registration; },
        function () {
          if (!sessionStorage.getItem("__direct_reload")) {
            sessionStorage.setItem("__direct_reload", "1");
            log("not controlled yet — reloading once…");
            location.reload();
            return new Promise(function () {});
          }
          log("WARNING: still not controlled after reload");
          return registration;
        }
      );
    }).then(function (registration) {
      if (!registration) return;
      try { sessionStorage.removeItem("__direct_reload"); } catch (e) {}

      // The runtime expects options.serviceworker to have .postMessage().
      // ServiceWorkerRegistration.prototype.postMessage doesn't exist in
      // all browsers, so forward to the active worker.
      var swTarget = registration.active
                  || registration.waiting
                  || registration.installing
                  || navigator.serviceWorker.controller;
      if (!swTarget) { fail("No active worker."); return; }

      var swShim = {
        postMessage: function (msg, transfer) { return swTarget.postMessage(msg, transfer || []); },
        get active()     { return registration.active; },
        get waiting()    { return registration.waiting; },
        get installing() { return registration.installing; },
        get scope()      { return registration.scope; }
      };

      // ---- 3. Use the runtime's own transport --------------------------
      // _nog837i (the 8t6ked.js bundle) exports the transport class used by
      // index.html's app. That's what actually supports WebSockets and keeps
      // a persistent MessageChannel to the SW. We reuse it here.
      stage = "transport";
      var transport = null;
      try {
        // The bundler's export surface is `_nog837i` (see 8t6ked.js: it
        // assigns `self._nog837i = h` at the end). If it exposes a transport
        // class, use it; otherwise fall back to a fetch shim so at least
        // plain HTML proxying works.
        var T = window._nog837i && window._nog837i.BareClient;
        if (typeof T === "function") {
          log("using runtime BareClient transport");
          transport = new T("https://bare.seamless.free.je/");   // bare-mux endpoint
        } else {
          log("BareClient not exposed; falling back to fetch transport");
          transport = {
            ready: Promise.resolve(true),
            init: function () { return Promise.resolve(); },
            request: function (remote, method, body, headers) {
              return fetch(remote.href, { method: method, body: body, headers: headers })
                .then(function (res) {
                  return res.arrayBuffer().then(function (buf) {
                    return { status: res.status, statusText: res.statusText,
                             headers: Array.from(res.headers), body: buf };
                  });
                });
            },
            connect: function () { throw new Error("WebSockets not supported in fetch fallback"); }
          };
        }
      } catch (e) {
        fail("transport setup: " + (e && e.message ? e.message : String(e)));
        return;
      }

      // ---- 4. Controller ------------------------------------------------
      stage = "controller-ctor";
      var controller;
      try {
        controller = new window._wdgvkq9.Controller({
          transport: transport,
          serviceworker: swShim,
          config: {
            _iyosyjgPath: RUNTIME_PATH,
            wasmPath:     WASM_PATH
          }
        });
      } catch (e) { fail("Controller ctor: " + (e && e.message ? e.message : String(e))); return; }
      log("controller.prefix = " + controller.prefix);

      stage = "controller-wait";
      controller.wait().then(function () {
        log("controller ready");

        // ---- 5. Create frame ------------------------------------------
        stage = "frame-create";
        var iframe = document.createElement("iframe");
        iframe.setAttribute("allow",
          "clipboard-read; clipboard-write; fullscreen; autoplay; encrypted-media; picture-in-picture");
        iframe.setAttribute("allowfullscreen", "true");
        holder.appendChild(iframe);

        var frame = controller.createFrame(iframe, { plugins: [] });
        log("frame.prefix = " + frame.prefix);

        iframe.addEventListener("load", function () { log("iframe load fired"); hide(); });

        // ---- 6. Warm the SW, then navigate ---------------------------
        // The SW needs at least one request after $controller$init before
        // it's guaranteed to have our controller registered in this worker
        // lifetime. Do a HEAD to ourselves and a request through the frame
        // prefix, then navigate.
        stage = "warm-sw";
        log("warming SW…");
        fetch(location.href, { method: "HEAD", cache: "no-store" })
          .catch(function () {})
          .then(function () { return fetch(frame.prefix + "warmup", { cache: "no-store" }).catch(function () {}); })
          .then(function () { return new Promise(function (r) { setTimeout(r, 500); }); })
          .then(function () {
            stage = "frame-go";
            log("frame.go(" + target.href + ")");
            frame.go(target.href);

            setTimeout(function () {
              if (!statusEl.classList.contains("hidden")) {
                log(""); log("--- 10s after frame.go ---");
                log("iframe.src = " + iframe.src);
                log("if you see this, the SW never routed the navigation");
              }
            }, 10000);

            setTimeout(hide, 15000);
          });
      }).catch(function (e) { fail("controller.wait(): " + (e && e.message ? e.message : String(e))); });
    }).catch(function (e) { fail("setup: " + (e && e.message ? e.message : String(e))); });
  }

  function waitFor(cond, timeoutMs) {
    return new Promise(function (resolve, reject) {
      var t0 = Date.now();
      (function tick() {
        try { if (cond()) return resolve(); } catch (e) {}
        if (Date.now() - t0 > timeoutMs) return reject(new Error("timeout"));
        setTimeout(tick, 100);
      })();
    });
  }
})();
</script>
</body>
</html>
