<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>cherri — direct</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; }
  #frame-holder { position:fixed; inset:0; width:100vw; height:100vh; background:#000; }
  #frame-holder iframe { width:100%; height:100%; border:0; margin:0; padding:0; display:block; background:#000; }
  #status {
    position:fixed; inset:0; display:flex; align-items:flex-start; justify-content:flex-start;
    color:#ddd; font:12px/1.5 ui-monospace, Menlo, Consolas, monospace; background:#0a0a0a;
    text-align:left; padding:16px; box-sizing:border-box; white-space:pre-wrap;
    overflow:auto; z-index:10;
  }
  #status.hidden { display:none; }
</style>
</head>
<body>

<div id="status">Starting proxy…</div>
<div id="frame-holder"></div>

<!-- Same runtime scripts index.html loads, same order -->
<script src="./bi1wf/8t6ked.js"></script>
<script src="./bwd9x/9lcbx4.js"></script>

<script>
(function () {
  "use strict";

  var statusEl = document.getElementById("status");
  var holder   = document.getElementById("frame-holder");
  var lines = [];
  var stage = "init";

  function log(m)  { lines.push(String(m)); statusEl.textContent = lines.join("\n"); console.log("[direct]", m); }
  function fail(m) { log("FAIL: " + m); }
  function hide()  { statusEl.classList.add("hidden"); }

  setTimeout(function () {
    if (!statusEl.classList.contains("hidden")) {
      log("");
      log("--- still running after 30s ---");
      log("stage = " + stage);
    }
  }, 30000);

  // ---- target URL ---------------------------------------------------------
  var params = new URLSearchParams(location.search);
  var raw = params.get("url");
  if (!raw) {
    fail("Missing ?url= parameter.\nExample: direct.html?url=https://example.com");
    return;
  }
  if (!/^https?:\/\//i.test(raw) && raw.indexOf("cherri://") !== 0) raw = "https://" + raw;
  var target;
  try { target = new URL(raw); } catch (e) { fail("Invalid URL: " + raw); return; }
  log("target = " + target.href);

  if (!("serviceWorker" in navigator)) { fail("No service worker support"); return; }
  if (!window._wdgvkq9 || !window._wdgvkq9.Controller) {
    fail("_wdgvkq9.Controller missing — bi1wf/8t6ked.js or bwd9x/9lcbx4.js failed to load");
    return;
  }

  // ---- paths taken verbatim from assets/bundle-1vghyvjv.js (uqA / BqA / dqA / QqA / CqA / Ij / i1A / IqA)
  //
  //   IqA  = "fn5315/"
  //   BqA  = "bi1wf/8t6ked.js"
  //   dqA  = "bwd9x/cdt4qb.js"
  //   QqA  = "bi1wf/ri1n3t.wasm"
  //   CqA(scope) = scope + "fn5315/"
  //   Ij(scope, file) = scope + file
  //
  // Previous direct.html versions used /~/sj/ and _iyosyjg/_iyosyjg.wasm — those
  // are NOT what this build uses. The real prefix is {SW scope}fn5315/.
  var SW_FILE       = "v6hxi5.js";
  var PREFIX_TAIL   = "fn5315/";
  var RUNTIME_REL   = "bi1wf/8t6ked.js";
  var INJECT_REL    = "bwd9x/cdt4qb.js";
  var WASM_REL      = "bi1wf/ri1n3t.wasm";

  // base64url codec — identical to i1A in the bundle
  var codec = {
    encode: function (e) {
      if (!e) return e;
      var t = new TextEncoder().encode(e);
      var a = "";
      for (var r = 0; r < t.length; r++) a += String.fromCharCode(t[r]);
      return btoa(a).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    },
    decode: function (e) {
      if (!e) return e;
      var t = e.replace(/-/g, "+").replace(/_/g, "/");
      while (t.length % 4) t += "=";
      var a = atob(t);
      var r = new Uint8Array(a.length);
      for (var o = 0; o < a.length; o++) r[o] = a.charCodeAt(o);
      return new TextDecoder().decode(r);
    }
  };

  // Default wisp endpoint from gB in the bundle. Settings may override via localStorage.
  var DEFAULT_WISP = "wss://kristenblackburnvolleyballcamps.com/socket/";
  function readWisp() {
    try {
      // settings key is hashed from build id; fall back to scanning common keys
      var keys = Object.keys(localStorage);
      for (var i = 0; i < keys.length; i++) {
        var k = keys[i];
        if (k.indexOf("settings") === -1 && k.indexOf("cherri") === -1) continue;
        try {
          var parsed = JSON.parse(localStorage.getItem(k));
          if (parsed && typeof parsed.wisp === "string" && /^wss?:\/\//.test(parsed.wisp) && parsed.wisp.slice(-1) === "/") {
            return parsed.wisp;
          }
        } catch (_) {}
      }
    } catch (_) {}
    return DEFAULT_WISP;
  }

  // ---- 1. Ensure SW is registered and controlling this page ---------------
  // Mirrors lqA() from the bundle: return { worker, registration } where
  // worker is the ACTIVE ServiceWorker (has .postMessage), NOT the container
  // and NOT the registration. Passing navigator.serviceWorker was the
  // "postMessage is not a function" crash.
  function ensureSW() {
    stage = "ensure-sw";
    return navigator.serviceWorker.getRegistrations().then(function (regs) {
      var ours = null;
      for (var i = 0; i < regs.length; i++) {
        var w = regs[i].active || regs[i].waiting || regs[i].installing;
        if (w && w.scriptURL.split("/").pop() === SW_FILE) { ours = regs[i]; break; }
      }
      if (ours) return ours;
      log("registering " + SW_FILE);
      return navigator.serviceWorker.register(SW_FILE, { scope: "./" });
    }).then(function () {
      return navigator.serviceWorker.ready;
    }).then(function (registration) {
      function currentWorker() {
        var c = navigator.serviceWorker.controller;
        if (!c) return null;
        try {
          if (c.scriptURL.split("/").pop() === SW_FILE) return c;
        } catch (_) {}
        return null;
      }

      var worker = currentWorker();
      if (worker) {
        log("SW controlling: " + worker.scriptURL);
        return { worker: worker, registration: registration };
      }

      // First visit: registration exists but page is not controlled yet.
      // One reload is how index.html (via its own SW bootstrap) also gets control.
      if (!sessionStorage.getItem("__direct_sw_reload")) {
        sessionStorage.setItem("__direct_sw_reload", "1");
        log("SW registered but not controlling yet — reloading once…");
        location.reload();
        return new Promise(function () {}); // halt
      }
      sessionStorage.removeItem("__direct_sw_reload");

      // Last resort: use registration.active even if controller is null
      worker = registration.active || registration.waiting || registration.installing;
      if (!worker) throw new Error("Service worker registration has no active worker");
      log("WARNING: using registration.active (page may not be controlled)");
      return { worker: worker, registration: registration };
    });
  }

  // ---- 2. Transport -------------------------------------------------------
  // index.html uses `new eH({ wisp })` (epoxy) from the React bundle. eH is
  // NOT exported by bi1wf/8t6ked.js or bwd9x/9lcbx4.js — it only lives inside
  // assets/bundle-*.js. Without loading the full 4 MB bundle we cannot construct
  // the real epoxy transport.
  //
  // Fallback: a fetch-based transport that is enough for plain HTML/CSS/JS pages.
  // Sites that need WebSockets (GeForce Now, Discord, etc.) will fail on connect()
  // — that is a limitation of not loading the epoxy client, not of the proxy path.
  function makeFetchTransport() {
    return {
      ready: Promise.resolve(true),
      init: function () { return Promise.resolve(); },
      request: function (remote, method, body, headers) {
        var h = {};
        if (headers) {
          if (typeof headers.forEach === "function") {
            headers.forEach(function (v, k) { h[k] = v; });
          } else if (Array.isArray(headers)) {
            headers.forEach(function (pair) { h[pair[0]] = pair[1]; });
          } else {
            Object.keys(headers).forEach(function (k) { h[k] = headers[k]; });
          }
        }
        return fetch(remote.href, { method: method, body: body, headers: h, redirect: "manual" })
          .then(function (res) {
            return res.arrayBuffer().then(function (buf) {
              return {
                status: res.status,
                statusText: res.statusText,
                headers: Array.from(res.headers.entries()),
                body: buf
              };
            });
          });
      },
      connect: function () {
        throw new Error("WebSockets require the epoxy transport (only in the React bundle). Plain pages still work.");
      }
    };
  }

  // ---- 3. Boot Controller exactly like uqA() ------------------------------
  ensureSW().then(function (pair) {
    if (!pair) return;
    try { sessionStorage.removeItem("__direct_sw_reload"); } catch (_) {}

    var worker = pair.worker;
    var registration = pair.registration;
    var scopePath = new URL(registration.scope).pathname; // e.g. "/cherri/cherri/"
    if (scopePath.slice(-1) !== "/") scopePath += "/";

    var prefix      = scopePath + PREFIX_TAIL;           // "/cherri/cherri/fn5315/"
    var iyosyjgPath = scopePath + RUNTIME_REL;         // ".../bi1wf/8t6ked.js"
    var injectPath  = scopePath + INJECT_REL;          // ".../bwd9x/cdt4qb.js"
    var wasmPath    = scopePath + WASM_REL;            // ".../bi1wf/ri1n3t.wasm"

    log("scope   = " + scopePath);
    log("prefix  = " + prefix);
    log("wasm    = " + wasmPath);
    log("wisp    = " + readWisp() + " (epoxy unavailable outside bundle — using fetch transport)");

    stage = "controller-ctor";
    var transport = makeFetchTransport();

    var controller;
    try {
      // Mirrors:
      //   new $J({
      //     serviceworker: e,          // ACTIVE worker
      //     transport: a,
      //     config: {
      //       prefix: CqA(r),
      //       codec: i1A,
      //       _iyosyjgPath: Ij(r, BqA()),
      //       injectPath: Ij(r, dqA()),
      //       wasmPath: Ij(r, QqA())
      //     }
      //   })
      controller = new window._wdgvkq9.Controller({
        serviceworker: worker,
        transport: transport,
        config: {
          prefix: prefix,
          codec: codec,
          _iyosyjgPath: iyosyjgPath,
          injectPath: injectPath,
          wasmPath: wasmPath
        }
      });
    } catch (e) {
      fail("Controller ctor: " + (e && e.message ? e.message : String(e)));
      return;
    }
    log("controller.prefix = " + controller.prefix);
    window.__directController = controller;

    stage = "controller-wait";
    return controller.wait().then(function () {
      log("controller ready");

      stage = "frame-create";
      var iframe = document.createElement("iframe");
      iframe.setAttribute(
        "allow",
        "clipboard-read; clipboard-write; fullscreen; autoplay; encrypted-media; picture-in-picture"
      );
      iframe.setAttribute("allowfullscreen", "true");
      iframe.referrerPolicy = "no-referrer";
      holder.appendChild(iframe);

      // Same API the embed route uses: controller.createFrame(el).go(url)
      var frame = controller.createFrame(iframe, { plugins: [] });
      log("frame.prefix = " + frame.prefix);

      iframe.addEventListener("load", function () {
        log("iframe load fired");
        hide();
      });

      stage = "frame-go";
      log("frame.go(" + target.href + ")");
      frame.go(target.href);

      setTimeout(function () {
        if (!statusEl.classList.contains("hidden")) {
          log("");
          log("--- 12s after frame.go ---");
          log("iframe.src = " + iframe.src);
          log("If this is a host 404, the SW did not route the navigation.");
          log("If this is blank with a real proxied URL, the page may need WebSockets.");
        }
      }, 12000);

      setTimeout(hide, 20000);
    });
  }).catch(function (e) {
    fail("setup: " + (e && e.message ? e.message : String(e)));
  });
})();
</script>
</body>
</html>
