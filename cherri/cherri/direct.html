<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>cherri — direct</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #888;
    font: 14px/1.4 system-ui, sans-serif; display: flex; align-items: center; justify-content: center; }
  a { color: #6cf; }
</style>
<script>
/**
 * Cherri already has a full-viewport proxy page: the /embed route.
 * It boots the real Controller via Uf() (epoxy transport, wasm, SW handshake)
 * — the same path index.html uses. Reimplementing that outside the bundle is
 * why every hand-rolled direct.html failed (MessagePort ready never fires).
 *
 * This file only normalizes ?url= / ?u= and hands off to /embed.
 * Requires the SPA fallback (_redirects: /* /index.html 200) which this repo has.
 */
(function () {
  var params = new URLSearchParams(location.search);
  var raw = params.get("url") || params.get("u");
  if (!raw) {
    document.write(
      "Missing <code>?url=</code> parameter.<br><br>" +
      "Example: <a href=\"?url=https://example.com\"><code>direct.html?url=https://example.com</code></a><br><br>" +
      "Or use the app embed route directly:<br>" +
      "<code>…/embed?u=https://example.com</code>"
    );
    return;
  }
  if (!/^https?:\/\//i.test(raw) && raw.indexOf("cherri://") !== 0) {
    raw = "https://" + raw;
  }
  // Same-directory embed route → React SPA boots Uf(), createFrame(), go()
  var dest = new URL("embed", location.href);
  dest.searchParams.set("u", raw);
  location.replace(dest.href);
})();
</script>
</head>
<body>Redirecting to embed…</body>
</html>
