<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>cherri — direct</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; }
  #frame-holder { position:fixed; inset:0; width:100vw; height:100vh; background:#000; }
  #frame-holder iframe { width:100%; height:100%; border:0; margin:0; padding:0; display:block; }
  #status { position:fixed; inset:0; display:flex; align-items:flex-start; justify-content:flex-start;
            color:#ddd; font:12px/1.5 ui-monospace,Menlo,Consolas,monospace; background:#0a0a0a;
            text-align:left; padding:16px; box-sizing:border-box; white-space:pre-wrap;
            overflow:auto; z-index:10; }
  #status.hidden { display:none; }
</style>
</head>
<body>

<div id="status">Starting proxy…</div>
<div id="frame-holder"></div>

<script src="./bi1wf/8t6ked.js"></script>
<script src="./bwd9x/9lcbx4.js"></script>

<script>
(function () {
  var statusEl = document.getElementById("status");
  var holder   = document.getElementById("frame-holder");
  var lines = [];
  var stage = "init";
  function log(m)  { lines.push(m); statusEl.textContent = lines.join("\n"); }
  function fail(m) { log("FAIL: " + m); }
  function hide()  { statusEl.classList.add("hidden"); }

  setTimeout(function () {
    if (!statusEl.classList.contains("hidden")) {
      log(""); log("--- still running after 30s ---"); log("stage = " + stage);
    }
  }, 30000);

  var params = new URLSearchParams(location.search);
  var raw = params.get("url");
  if (!raw) { fail("Missing ?url= parameter."); return; }
  if (!/^https?:\/\//i.test(raw) && raw.indexOf("cherri://") !== 0) raw = "https://" + raw;
  var target;
  try { target = new URL(raw); } catch (e) { fail("Invalid URL: " + raw); return; }

  if (!("serviceWorker" in navigator)) { fail("No SW support."); return; }
  if (!window._wdgvkq9 || !window._wdgvkq9.Controller) { fail("Runtime not loaded."); return; }

  // ---- Exact copies of the bundle's helper functions --------------------
  // From bundle-1vghyvjv.js:
  //   IqA = "fn5315/"
  //   BqA() → "bi1wf/8t6ked.js"
  //   QqA() → "bi1wf/ri1n3t.wasm"
  //   dqA() → "bwd9x/cdt4qb.js"
  //   CqA(scope) → scope + "fn5315/"
  //   Ij(scope, path) → scope + path (without leading slash)

  var IqA = "fn5315/";
  function BqA() { return "bi1wf/8t6ked.js"; }
  function QqA() { return "bi1wf/ri1n3t.wasm"; }
  function dqA() { return "bwd9x/cdt4qb.js"; }
  function CqA(scopePath) { return scopePath + IqA; }
  function Ij(scopePath, p) { return scopePath + (p.startsWith("/") ? p.slice(1) : p); }

  // Base64url codec, mirroring `i1A` in the bundle.
  var codec = {
    encode: function (e) {
      if (!e) return e;
      var t = new TextEncoder().encode(e), a = "";
      for (var r = 0; r < t.length; r++) a += String.fromCharCode(t[r]);
      return btoa(a).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    },
    decode: function (e) {
      if (!e) return e;
      var t = e.replace(/-/g, "+").replace(/_/g, "/");
      while (t.length % 4) t += "=";
      var a = atob(t), r = new Uint8Array(a.length);
      for (var o = 0; o < a.length; o++) r[o] = a.charCodeAt(o);
      return new TextDecoder().decode(r);
    }
  };

  // ---- Re-implementation of lqA() from the bundle -----------------------
  // Waits for the SW, then returns { worker, registration }.
  function getWorkerAndRegistration() {
    if (!("serviceWorker" in navigator)) return Promise.reject(new Error("no SW"));
    var SW_FILE = window.__SW_FILE__ ? window.__SW_FILE__.split("/").pop() : "v6hxi5.js";

    return navigator.serviceWorker.getRegistrations().then(function (regs) {
      for (var i = 0; i < regs.length; i++) {
        var w = regs[i].active || regs[i].waiting || regs[i].installing;
        if (w && w.scriptURL.split("/").pop() === SW_FILE) return regs[i];
      }
      log("registering " + SW_FILE);
      return navigator.serviceWorker.register(SW_FILE, { scope: "./" });
    }).then(function () {
      return navigator.serviceWorker.ready;
    }).then(function (registration) {
      function matchWorker() {
        var c = navigator.serviceWorker.controller;
        if (!c) return null;
        try {
          return new URL(c.scriptURL, location.href).pathname.split("/").pop() === SW_FILE ? c : null;
        } catch (e) { return null; }
      }
      var w = matchWorker();
      if (w) return { worker: w, registration: registration };

      // Wait for controllerchange up to 45s (matches gqA=45e3 in the bundle)
      return new Promise(function (resolve) {
        var settled = false;
        function done(val) {
          if (settled) return;
          settled = true;
          navigator.serviceWorker.removeEventListener("controllerchange", onChange);
          clearTimeout(t);
          resolve(val);
        }
        function onChange() { done(matchWorker()); }
        navigator.serviceWorker.addEventListener("controllerchange", onChange);
        var t = setTimeout(function () { done(null); }, 45000);
        var m = matchWorker();
        if (m) done(m);
      }).then(function (w2) {
        if (w2) return { worker: w2, registration: registration };
        var active = registration.active;
        if (!active) throw new Error("Registration has no active worker.");
        return { worker: active, registration: registration };
      });
    });
  }

  // ---- bootController(), mirroring uqA() -------------------------------
  function bootController() {
    stage = "sw";
    return getWorkerAndRegistration().then(function (pair) {
      var worker = pair.worker;
      var registration = pair.registration;
      log("worker = " + worker.scriptURL);

      // Transport.
      //
      // The bundle uses `new eH({wisp: eg().wisp})` where `eH` is a
      // wisp-backed BareClient. That class isn't exported from
      // 8t6ked.js or 9lcbx4.js as far as I can see, so we build a
      // transport that satisfies the same interface the Controller
      // expects: { ready, init, request, connect }.
      //
      // `request` and `connect` are what the runtime calls. `request`
      // is used for all top-level fetches, `connect` for WebSockets.
      stage = "transport";
      var transport = {
        ready: false,
        init: function () {
          this.ready = true;
          return Promise.resolve();
        },
        request: function (remote, method, body, headers) {
          return fetch(remote.href, {
            method: method,
            body: body,
            headers: headers,
            mode: "cors",
            credentials: "omit"
          }).then(function (res) {
            return res.arrayBuffer().then(function (buf) {
              return {
                status: res.status,
                statusText: res.statusText,
                headers: Array.from(res.headers),
                body: buf
              };
            });
          });
        },
        connect: function () {
          throw new Error("WebSocket transport unavailable in direct.html");
        }
      };
      return transport.init().then(function () { return transport; });
    }).then(function (transport) {
      // Now get the worker again (we already have it, but keep the
      // structure parallel to the bundle's uqA).
      return getWorkerAndRegistration().then(function (pair) {
        var worker = pair.worker;
        var registration = pair.registration;

        // `r` in the bundle: the scope path, e.g. "/cherri/cherri/".
        var r = new URL(registration.scope).pathname;
        log("scope path = " + r);

        // Build the config exactly like the bundle.
        var cfg = {
          prefix: CqA(r),                       // r + "fn5315/"
          codec: codec,
          _iyosyjgPath: Ij(r, BqA()),           // r + "bi1wf/8t6ked.js"
          injectPath:   Ij(r, dqA()),           // r + "bwd9x/cdt4qb.js"
          wasmPath:     Ij(r, QqA())            // r + "bi1wf/ri1n3t.wasm"
        };
        log("prefix = " + cfg.prefix);
        log("_iyosyjgPath = " + cfg._iyosyjgPath);
        log("injectPath = " + cfg.injectPath);
        log("wasmPath = " + cfg.wasmPath);

        stage = "controller-ctor";
        var controller = new window._wdgvkq9.Controller({
          serviceworker: worker,     // ← the worker, matching the bundle
          transport: transport,
          config: cfg
        });
        log("controller.prefix = " + controller.prefix);

        stage = "controller-wait";
        return controller.wait().then(function () { return controller; });
      });
    });
  }

  // ---- Go --------------------------------------------------------------
  bootController().then(function (controller) {
    stage = "frame-create";
    var iframe = document.createElement("iframe");
    iframe.setAttribute("allow",
      "autoplay; fullscreen; picture-in-picture; encrypted-media; clipboard-read; clipboard-write");
    iframe.setAttribute("allowfullscreen", "true");
    holder.appendChild(iframe);

    var frame = controller.createFrame(iframe);
    log("frame.prefix = " + frame.prefix);

    iframe.addEventListener("load", function () { log("iframe load"); hide(); });

    stage = "frame-go";
    log("frame.go(" + target.href + ")");
    frame.go(target.href);

    setTimeout(function () {
      if (!statusEl.classList.contains("hidden")) {
        log(""); log("--- 15s after frame.go ---");
        log("iframe.src = " + iframe.src);
      }
    }, 15000);
    setTimeout(hide, 20000);
  }).catch(function (e) {
    fail(stage + ": " + (e && e.message ? e.message : String(e)));
  });
})();
</script>
</body>
</html>
