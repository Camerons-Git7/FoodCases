<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>cherri — direct</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; }
  #frame-holder { position:fixed; inset:0; width:100vw; height:100vh; background:#000; }
  #frame-holder iframe { width:100%; height:100%; border:0; margin:0; padding:0; display:block; }
  #status { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
            color:#aaa; font:13px/1.6 ui-monospace,Menlo,Consolas,monospace; background:#0a0a0a;
            text-align:left; padding:24px; box-sizing:border-box; white-space:pre-wrap;
            overflow:auto; z-index:10; }
  #status.hidden { display:none; }
</style>
</head>
<body>

<div id="status">Starting proxy…</div>
<div id="frame-holder"></div>

<script src="./bi1wf/8t6ked.js"></script>
<script src="./bwd9x/9lcbx4.js"></script>

<script>
(function () {
  var statusEl = document.getElementById("status");
  var holder   = document.getElementById("frame-holder");
  var lines = [];
  function log(m) { lines.push(m); statusEl.textContent = lines.join("\n"); console.log("[direct]", m); }
  function fail(m) { log("FAIL: " + m); }
  function hide() { statusEl.classList.add("hidden"); }

  var params = new URLSearchParams(location.search);
  var raw = params.get("url");
  if (!raw) { fail("no ?url="); return; }
  if (!/^https?:\/\//i.test(raw) && raw.indexOf("cherri://") !== 0) raw = "https://" + raw;
  var target;
  try { target = new URL(raw); } catch (e) { fail("bad url"); return; }

  if (!("serviceWorker" in navigator)) { fail("no SW"); return; }

  var WASM_PATH = new URL("_iyosyjg/_iyosyjg.wasm", location.href).href;

  // ---- 1. Ensure our SW is registered AND ready. -------------------------
  navigator.serviceWorker.getRegistrations().then(function (regs) {
    var ours = regs.find(function (r) {
      var w = r.active || r.waiting || r.installing;
      return w && w.scriptURL.split("/").pop() === "v6hxi5.js";
    });
    if (ours) return ours;
    return navigator.serviceWorker.register("v6hxi5.js", { scope: "./" });
  }).then(function () {
    // .ready resolves to the ServiceWorkerRegistration for our scope.
    return navigator.serviceWorker.ready;
  }).then(function (registration) {
    if (!navigator.serviceWorker.controller) {
      // First load: registration exists but page isn't controlled yet.
      // One reload fixes it; sessionStorage guards against loops.
      if (!sessionStorage.getItem("__d_reload")) {
        sessionStorage.setItem("__d_reload", "1");
        location.reload();
        return new Promise(function () {}); // halt
      }
    }
    sessionStorage.removeItem("__d_reload");

    if (!window._wdgvkq9 || !window._wdgvkq9.Controller) {
      fail("_wdgvkq9.Controller missing");
      return;
    }

    // ---- 2. Build transport. --------------------------------------------
    // The runtime calls .request(url, method, body, headers) and .connect()
    // for websockets. We only support plain HTTP(S) fetches here, so WS
    // targets will fail — but HTML pages load fine.
    var transport = {
      ready: Promise.resolve(true),
      init: function () { return Promise.resolve(); },
      request: function (remote, method, body, headers) {
        // remote is a URL instance.
        return fetch(remote.href, { method: method, body: body, headers: headers })
          .then(function (res) {
            return res.arrayBuffer().then(function (buf) {
              return {
                status: res.status,
                statusText: res.statusText,
                headers: Array.from(res.headers),
                body: buf,
              };
            });
          });
      },
      connect: function () {
        throw new Error("WebSockets not supported in direct.html");
      },
    };

    // ---- 3. Controller. --------------------------------------------------
    // IMPORTANT: `serviceworker` must be the ServiceWorkerRegistration
    // (it has .postMessage()), not navigator.serviceWorker (the container).
    var controller = new window._wdgvkq9.Controller({
      transport: transport,
      serviceworker: registration,
      config: { wasmPath: WASM_PATH },
    });
    window.__directController = controller;

    controller.wait().then(function () {
      // ---- 4. Frame. ----------------------------------------------------
      var iframe = document.createElement("iframe");
      iframe.setAttribute("allow", "clipboard-read; clipboard-write; fullscreen; autoplay; encrypted-media; picture-in-picture");
      iframe.setAttribute("allowfullscreen", "true");
      holder.appendChild(iframe);

      var frame = controller.createFrame(iframe, { plugins: [] });

      iframe.addEventListener("load", function () { hide(); });

      frame.go(target.href);

      // Fallback reveal so you never stare at a splash forever.
      setTimeout(hide, 8000);
    }).catch(function (e) {
      fail("controller.wait(): " + (e && e.message ? e.message : String(e)));
    });
  }).catch(function (e) {
    fail("setup: " + (e && e.message ? e.message : String(e)));
  });
})();
</script>
</body>
</html>
