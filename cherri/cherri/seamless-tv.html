<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cherri | movies</title>
    <style>
        :root {
            --bg: #220f17;
            --bg-2: #3f1e2b;
            --bg-3: #57293c;
            --text: #c0c0c0;
            --accent: #e2588d;
        }
        * { box-sizing: border-box; }
        body, html {
            margin: 0;
            min-height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, system-ui, sans-serif;
        }
        .wrap { max-width: 1100px; margin: 0 auto; padding: 2rem 1.25rem 3rem; }
        h1 { text-align: center; font-size: 2rem; font-weight: 600; margin: 1.5rem 0 1rem; }
        .search {
            display: block;
            width: min(420px, 100%);
            margin: 0 auto 1.25rem;
            padding: 10px 18px;
            border: none;
            border-radius: 999px;
            background: var(--bg-2);
            color: var(--text);
            font-size: 14px;
        }
        .search:focus { outline: none; background: var(--bg-3); }
        .tabs { text-align: center; margin-bottom: 1.5rem; }
        .tabs button, .pager button, .src-btn, .season-btn {
            border: none;
            border-radius: 999px;
            padding: 8px 16px;
            margin: 4px;
            cursor: pointer;
            background: var(--bg-2);
            color: var(--text);
            font-family: Arial, sans-serif;
        }
        .tabs button.on, .src-btn.on, .season-btn.on { background: var(--accent); }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }
        @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); } }
        @media (min-width: 900px) { .grid { grid-template-columns: repeat(4, 1fr); } }
        .card {
            display: block;
            position: relative;
            border-radius: 1.25rem;
            overflow: hidden;
            background: #1a1a1a;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            transition: transform 0.15s;
        }
        .card:hover { transform: scale(1.02); }
        .card img {
            width: 100%;
            aspect-ratio: 3/2;
            object-fit: cover;
            display: block;
            background: #111;
        }
        .card .cap {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: flex-end;
            padding: 0.75rem;
            background: linear-gradient(transparent, rgba(0,0,0,0.75));
            opacity: 0;
            transition: opacity 0.15s;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .card:hover .cap { opacity: 1; }
        .pager { text-align: center; margin-top: 1.5rem; }
        .pager span { margin: 0 0.75rem; }
        .hidden { display: none !important; }
        .back {
            display: inline-block;
            margin-bottom: 1rem;
            color: var(--text);
            text-decoration: none;
        }
        .back:hover { color: #fff; }
        .player-box {
            position: relative;
            background: #1d1d1d;
            border-radius: 1.25rem;
            overflow: hidden;
            margin: 1rem 0 1.5rem;
            padding-top: 56.25%;
        }
        .player-box iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .player-msg {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 1.5rem;
            background: rgba(0,0,0,0.8);
        }
        .panel {
            background: var(--bg);
            border-radius: 1.25rem;
            padding: 1.25rem;
            margin-bottom: 1rem;
        }
        .panel h3 { margin: 0 0 0.75rem; }
        .ep-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
        }
        @media (min-width: 640px) { .ep-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (min-width: 900px) { .ep-grid { grid-template-columns: repeat(4, 1fr); } }
        .ep {
            background: var(--bg-2);
            border-radius: 1rem;
            overflow: hidden;
            cursor: pointer;
        }
        .ep.on { outline: 2px solid var(--accent); }
        .ep img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; }
        .ep .t { padding: 0.5rem 0.65rem; font-size: 0.8rem; }
        .meta { opacity: 0.85; margin-bottom: 0.75rem; }
        #watch-title { font-size: 1.75rem; margin: 0 0 0.5rem; }
    </style>
</head>
<body>
    <div id="browse" class="wrap">
        <h1>cherri | movies</h1>
        <input id="search" class="search" type="text" placeholder="what are we watching today?">
        <div class="tabs">
            <button type="button" id="tab-movies" class="on">movies</button>
            <button type="button" id="tab-shows">tv and shows</button>
        </div>
        <div id="grid" class="grid"></div>
        <div class="pager">
            <button type="button" id="prev">Previous</button>
            <span>Page <span id="page-num">1</span></span>
            <button type="button" id="next">Next</button>
        </div>
    </div>

    <div id="watch" class="wrap hidden">
        <a href="#" class="back" id="back">← Back to Browse</a>
        <h1 id="watch-title"></h1>
        <div class="meta" id="watch-meta"></div>
        <div class="player-box">
            <iframe id="player-frame" allowfullscreen allow="fullscreen; autoplay"></iframe>
            <div id="player-msg" class="player-msg">
                <div>
                    <p id="player-msg-title" style="font-size:1.1rem;margin:0 0 0.5rem">Player loading…</p>
                    <p id="player-msg-body" style="font-size:0.85rem;opacity:0.8;margin:0"></p>
                </div>
            </div>
        </div>
        <div id="episodes-panel" class="panel hidden">
            <h3>Episodes</h3>
            <div id="seasons"></div>
            <div id="episodes" class="ep-grid"></div>
        </div>
        <div class="panel">
            <h3>Sources</h3>
            <div id="sources"></div>
        </div>
        <div class="panel">
            <h3>Overview</h3>
            <p id="overview" style="opacity:0.9;line-height:1.5;margin:0"></p>
        </div>
    </div>

    <script>

    // ---------- Proxy (FoodCases Scramjet) — only when playing ----------
    var PROXY_SCOPE = (function () {
        try {
            var i = location.pathname.indexOf('/cherri/cherri');
            if (i !== -1) return location.pathname.slice(0, i + '/cherri/cherri'.length) + '/';
        } catch (e) {}
        return '/cherri/cherri/';
    })();
    var SJ_SEGMENT = 'fn5315/';
    var DEFAULT_WISP = 'wss://kristenblackburnvolleyballcamps.com/socket/';

    function getWisp() {
        try {
            var raw = localStorage.getItem('cherri_settings') || localStorage.getItem('cherri_wispUrl');
            if (!raw) return DEFAULT_WISP;
            if (raw.indexOf('ws') === 0) return raw.slice(-1) === '/' ? raw : raw + '/';
            var j = JSON.parse(raw);
            if (j && j.wisp) return j.wisp.slice(-1) === '/' ? j.wisp : j.wisp + '/';
        } catch (e) {}
        return DEFAULT_WISP;
    }

    var foodCodec = {
        encode: function (e) {
            if (!e) return e;
            var t = new TextEncoder().encode(e), a = '', r;
            for (r = 0; r < t.length; r++) a += String.fromCharCode(t[r]);
            return btoa(a).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        },
        decode: function (e) {
            if (!e) return e;
            var t = e.replace(/-/g, '+').replace(/_/g, '/');
            while (t.length % 4) t += '=';
            var a = atob(t), r = new Uint8Array(a.length), o;
            for (o = 0; o < a.length; o++) r[o] = a.charCodeAt(o);
            return new TextDecoder().decode(r);
        }
    };

    function joinScope(rel) {
        return PROXY_SCOPE + String(rel).replace(/^\//, '');
    }

    function loadScript(src) {
        return new Promise(function (resolve, reject) {
            if (document.querySelector('script[data-cherri-src="' + src + '"]')) {
                resolve();
                return;
            }
            var s = document.createElement('script');
            s.src = src;
            s.async = false;
            s.dataset.cherriSrc = src;
            s.onload = function () { resolve(); };
            s.onerror = function () { reject(new Error('Failed to load ' + src)); };
            document.head.appendChild(s);
        });
    }

        timeoutMs = timeoutMs || 15000;

        if (navigator.serviceWorker.controller) return Promise.resolve(navigator.serviceWorker.controller);
        return new Promise(function (resolve, reject) {
            var t = setTimeout(function () {
                reject(new Error('Timed out waiting for active service worker'));
            }, timeoutMs);

                clearTimeout(t);
                navigator.serviceWorker.removeEventListener('controllerchange', onChange);
                resolve(w);

                if (navigator.serviceWorker.controller) done(navigator.serviceWorker.controller);

                    }

        });

    function initScramjetProxy() {
        if (proxy.initPromise) return proxy.initPromise;
        proxy.initPromise = (async function () {
            try {
                if (location.pathname.indexOf('/cherri/cherri') === -1) {
                    throw new Error('Host this file under /cherri/cherri/');
                }
                if (!('serviceWorker' in navigator)) throw new Error('No serviceWorker support');

                await loadScript(joinScope('bi1wf/8t6ked.js'));

                var transport = null;

                    (window.CurlMod && (window.CurlMod.LibcurlClient || window.CurlMod.default)) ||
                    (window.LibcurlTransport && (window.LibcurlTransport.LibcurlClient || window.LibcurlTransport)) ||
                    window.LibcurlClient || null;
                var EpoxyClient =
                    (window.EpxMod && (window.EpxMod.EpoxyClient || window.EpxMod.default)) ||
                    window.EpoxyClient || window.EpoxyTransport || null;

                if (LibcurlClient) {
                    transport = new LibcurlClient({ wisp: wisp });
                    if (transport.init) await transport.init();
                } else if (EpoxyClient) {

    async function playThroughProxy(rawUrl) {
        var iframe = document.getElementById('player-frame');
        var st = await initScramjetProxy();
        if (!st.ready || !st.controller) {
            setPlayerMsg(true, 'Player failed', st.error || 'Proxy did not start');
            if (iframe) iframe.removeAttribute('src');
            return false;
        }
        try {
            if (!st.frame || st.iframeEl !== iframe) {
                st.iframeEl = iframe;
                st.frame = st.controller.createFrame(iframe);
            }
            st.frame.go(rawUrl);
            setPlayerMsg(false);
            return true;
        } catch (e) {
            setPlayerMsg(true, 'Player failed', String(e && e.message ? e.message : e));
            if (iframe) iframe.removeAttribute('src');
            return false;
        }
    }

    // ---------- UI ----------
    function $(id) { return document.getElementById(id); }

    function setPlayerMsg(show, title, body) {
        var el = $('player-msg');
        if (!el) return;
        if (!show) {
            el.classList.add('hidden');
            return;
        }
        el.classList.remove('hidden');
        if (title) $('player-msg-title').textContent = title;
        $('player-msg-body').textContent = body || '';
    }

    function showBrowse() {
        $('browse').classList.remove('hidden');
        $('watch').classList.add('hidden');
        var iframe = $('player-frame');
        if (iframe) iframe.removeAttribute('src');
    }

    function showWatch() {
        $('browse').classList.add('hidden');
        $('watch').classList.remove('hidden');
        window.scrollTo(0, 0);
    }

    function renderGrid(items) {
        var grid = $('grid');
        grid.innerHTML = '';
        (items || []).forEach(function (item) {
            if (!item || !item.poster_path) return;
            var a = document.createElement('a');
            a.href = '#';
            a.className = 'card';
            a.innerHTML =
                '<img src="https://image.tmdb.org/t/p/w500' + item.poster_path + '" alt="" loading="lazy">' +
                '<div class="cap">' + escapeHtml(item.title || item.name || '') + '</div>';
            a.addEventListener('click', function (e) {
                e.preventDefault();
                openWatch(item.id, state.tab === 'movies' ? 'movie' : 'tv');
            });
            grid.appendChild(a);
        });
        $('page-num').textContent = String(state.page);
        $('prev').disabled = state.page <= 1;
    }

    function escapeHtml(s) {
        return String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    async function fetchList() {
        var endpoint, url;
        if (state.query.trim()) {
            endpoint = state.tab === 'movies' ? 'movie' : 'tv';
            url = 'https://api.tmdb.org/3/search/' + endpoint +
                '?api_key=' + API_KEY +
                '&query=' + encodeURIComponent(state.query) +
                '&page=' + state.page;
        } else {
            endpoint = state.tab === 'movies' ? 'movie/popular' : 'tv/popular';
            url = 'https://api.tmdb.org/3/' + endpoint +
                '?api_key=' + API_KEY + '&page=' + state.page;
        }
        try {
            var res = await fetch(url, { headers: { Accept: 'application/json' } });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            var data = await res.json();
            renderGrid(data.results || []);
        } catch (e) {
            console.error(e);
            $('grid').innerHTML = '<p style="grid-column:1/-1;text-align:center">Failed to load list.</p>';
        }
    }

    function buildSourceUrl() {
        var source = sources.find(function (s) { return s.id === state.selectedSource; });
        if (!source) return '';
        var url = source.urls[state.isShow ? 'tv' : 'movie'];
        var params = state.isShow
            ? { id: state.contentId, season: state.selectedSeason, episode: state.selectedEpisode }
            : { id: state.contentId };
        Object.keys(params).forEach(function (k) {
            url = url.replace('{' + k + '}', params[k]);
        });
        return url;
    }

    function renderSources() {
        var box = $('sources');
        box.innerHTML = '';
        sources.forEach(function (s) {
            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'src-btn' + (s.id === state.selectedSource ? ' on' : '');
            b.textContent = s.name;
            b.addEventListener('click', function () {
                state.selectedSource = s.id;
                renderSources();
                updatePlayer();
            });
            box.appendChild(b);
        });
    }

    function renderSeasonsAndEpisodes() {
        var panel = $('episodes-panel');
        if (!state.isShow) {
            panel.classList.add('hidden');
            return;
        }
        panel.classList.remove('hidden');
        var seasons = $('seasons');
        seasons.innerHTML = '';
        state.seasons.forEach(function (n) {
            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'season-btn' + (n === state.selectedSeason ? ' on' : '');
            b.textContent = 'Season ' + n;
            b.addEventListener('click', async function () {
                state.selectedSeason = n;
                await loadSeason();
            });
            seasons.appendChild(b);
        });
        var eps = $('episodes');
        eps.innerHTML = '';
        var list = (state.seasonData && state.seasonData.episodes) || [];
        list.forEach(function (ep) {
            var d = document.createElement('div');
            d.className = 'ep' + (ep.episode_number === state.selectedEpisode ? ' on' : '');
            var img = ep.still_path
                ? 'https://image.tmdb.org/t/p/w300' + ep.still_path
                : 'https://via.placeholder.com/300x169';
            d.innerHTML =
                '<img src="' + img + '" alt="">' +
                '<div class="t">Ep ' + ep.episode_number + ' · ' + escapeHtml(ep.name || '') + '</div>';
            d.addEventListener('click', function () {
                state.selectedEpisode = ep.episode_number;
                renderSeasonsAndEpisodes();
                updatePlayer();
            });
            eps.appendChild(d);
        });
    }

    async function loadSeason() {
        var url = 'https://api.themoviedb.org/3/tv/' + state.contentId +
            '/season/' + state.selectedSeason + '?api_key=' + WATCH_KEY;
        try {
            var res = await fetch(url);
            state.seasonData = await res.json();
            state.selectedEpisode = 1;
            renderSeasonsAndEpisodes();
            updatePlayer();
        } catch (e) {
            console.error(e);
        }
    }

    async function openWatch(id, type) {
        state.contentId = id;
        state.contentType = type;
        state.isShow = type === 'tv';
        state.selectedSeason = 1;
        state.selectedEpisode = 1;
        state.seasonData = null;
        state.seasons = [];
        showWatch();
        setPlayerMsg(true, 'Loading…', '');
        $('watch-title').textContent = 'Loading…';
        $('watch-meta').textContent = '';
        $('overview').textContent = '';
        renderSources();

        try {
            var res = await fetch('https://api.themoviedb.org/3/' + type + '/' + id + '?api_key=' + WATCH_KEY);
            var data = await res.json();
            state.watchContent = data;
            $('watch-title').textContent = data.title || data.name || '';
            var bits = [];
            if (data.release_date) bits.push(String(data.release_date).slice(0, 4));
            if (data.first_air_date) bits.push(String(data.first_air_date).slice(0, 4));
            if (data.vote_average) bits.push('★ ' + Number(data.vote_average).toFixed(1));
            $('watch-meta').textContent = bits.join(' · ');
            $('overview').textContent = data.overview || '';
            if (state.isShow) {
                var n = data.number_of_seasons || 1;
                state.seasons = [];
                for (var i = 1; i <= n; i++) state.seasons.push(i);
                await loadSeason();
            } else {
                $('episodes-panel').classList.add('hidden');
                updatePlayer();
            }
        } catch (e) {
            console.error(e);
            setPlayerMsg(true, 'Failed to load title', String(e));
        }
    }

    async function updatePlayer() {
        var url = buildSourceUrl();
        if (!url) return;
        setPlayerMsg(true, 'Starting proxy…', 'Please wait');
        await playThroughProxy(url);
    }

    // events
    $('tab-movies').addEventListener('click', function () {
        state.tab = 'movies';
        state.page = 1;
        state.query = '';
        $('search').value = '';
        $('tab-movies').classList.add('on');
        $('tab-shows').classList.remove('on');
        fetchList();
    });
    $('tab-shows').addEventListener('click', function () {
        state.tab = 'shows';
        state.page = 1;
        state.query = '';
        $('search').value = '';
        $('tab-shows').classList.add('on');
        $('tab-movies').classList.remove('on');
        fetchList();
    });
    var searchTimer = null;
    $('search').addEventListener('input', function () {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(function () {
            state.query = $('search').value;
            state.page = 1;
            fetchList();
        }, 300);
    });
    $('prev').addEventListener('click', function () {
        if (state.page > 1) {
            state.page--;
            fetchList();
            window.scrollTo(0, 0);
        }
    });
    $('next').addEventListener('click', function () {
        state.page++;
        fetchList();
        window.scrollTo(0, 0);
    });
    $('back').addEventListener('click', function (e) {
        e.preventDefault();
        showBrowse();
    });

    // start — no Scramjet until play
    fetchList();
})();
    </script>
</body>
</html>
