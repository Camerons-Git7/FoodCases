      //
      // 1) iframe src attribute changes (full loads)
      // 2) contentWindow.location changes (SPA / JS redirects, e.g. GeForce Now
      //    "Get in") — same-origin under the proxy, so we can read it.

        function isEmbedRoute() {
          var h = (location.hash || "").replace(/^#/, "");
          var path = (h.split("?")[0] || "");
          return path === "/embed" || path === "embed";

        function currentEmbedTarget() {
          try {
            var h = (location.hash || "").replace(/^#/, "");
            var qi = h.indexOf("?");

              return qs;

            return new URLSearchParams(h.slice(qi + 1)).get("u");
          } catch (e) {

          try {
            var b64 = encoded.replace(/-/g, "+").replace(/_/g, "/");
