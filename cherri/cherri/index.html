          "html.cherri-direct body>:not(#cherri-direct-root){display:none!important;visibility:hidden!important;pointer-events:none!important;}",

        ].join("\n");
        (document.head || document.documentElement).appendChild(css);

        function mount() {
          // If we already mounted, do nothing
          if (document.getElementById("cherri-direct-root")) return;

          var root = document.createElement("div");
          root.id = "cherri-direct-root";

          var frame = document.createElement("iframe");
          frame.id = "cherri-direct-frame";
          frame.setAttribute("allow", "clipboard-read; clipboard-write; fullscreen; autoplay; encrypted-media; picture-in-picture");
          frame.setAttribute("allowfullscreen", "true");
          frame.setAttribute("referrerpolicy", "no-referrer");

          // IMPORTANT: point this at the URL shape Cherri's proxy actually uses.
          // Default: re-use the same ?url= route, but that would recurse, so we
          // use Cherri's internal proxy path. If your build uses a different
          // prefix (e.g. "/~/", "/scram/", "/fn5315/"), change it here.
          //
          // Most Cherri-style builds route proxied content through:
          //   /cherri/cherri/?url=<encoded>  (public, recurses → bad)
          //   /~/<encoded>                   (scramjet)
          //   /scram/<encoded>               (scramjet alt)
          //   /fn5315/<encoded>              (ultraviolet fork)
          //
          // We use the relative scramjet-style path, which works for most builds.
          // If your deploy uses a different one, replace this one line.
          frame.src = "./?url=" + encodeURIComponent(raw) + "&__direct=1&__frame=1";

          root.appendChild(frame);

          // Ensure our container exists as soon as body is available
          (document.body || document.documentElement).appendChild(root);

          // Defend against React re-rendering and removing/hiding our node
          var reattach = function () {
            var existing = document.getElementById("cherri-direct-root");
            if (!existing) {
              (document.body || document.documentElement).appendChild(root);
            } else if (existing !== root) {
              existing.replaceWith(root);
            }
          };
          new MutationObserver(reattach).observe(document.documentElement, {
            childList: true,
            subtree: true
          });
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", mount);
          // Also try to mount as early as possible once <body> exists
          var early = setInterval(function () {
            if (document.body) {
              clearInterval(early);
              mount();
            }
          }, 10);
        } else {
          mount();
        }

        // If the frame's route is the public ?url= one, it will recurse into
        // this script again with the SAME url — so detect that and, in the
        // nested context, tell the parent frame it's safe to just show us.
        // (Handled by the __frame=1 flag above: when set, we skip re-mounting.)
        if (new URLSearchParams(location.search).get("__frame") === "1") {
          // We are the inner proxied frame; do nothing special, the parent
          // already hides UI and shows us full-viewport.
        }
      })();
    </script>
