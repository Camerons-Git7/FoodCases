      //   Et(Ne)  → opens a proxy tab
      //
      // So the working form is:
      //   index.html#/?u=https://example.com

      //   index.html?url=https://example.com

          // e.g. #?u=... or #/embed?u=...

            if (qi >= 0) {

          // Strip url/u from the real query string so they don't linger
          search.delete("url");
          search.delete("u");

            location.pathname +
            (nextSearch ? "?" + nextSearch : "") +
            nextHash;

          // Also skip if hash already has the right u and path is /
          if (!fromQuery && fromHash === target && (hashPath === "/" || hashPath === "")) return;

          console.warn("[cherri] boot url rewrite failed:", e);
        }
