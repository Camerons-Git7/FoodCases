<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8"/>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes"/>
<link rel="shortcut icon" href="TemplateData/favicon.ico"/>
<link rel="stylesheet" href="TemplateData/style.css"/>
<style>
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #231F20; }
#unity-container { position: fixed; inset: 0; width: 100vw; height: 100vh; }
#unity-canvas { width: 100%; height: 100%; display: block; background: #231F20; }
#unity-loading-bar { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
#unity-progress-bar-empty { width: 141px; height: 18px; margin-top: 10px; background: url('TemplateData/progress-bar-empty-dark.png') no-repeat center; }
#unity-progress-bar-full { width: 0%; height: 18px; background: url('TemplateData/progress-bar-full-dark.png') no-repeat center; }
#unity-warning { position: absolute; left: 50%; top: 5%; transform: translateX(-50%); }
</style>
<script src="./Modules/WebView/unity-webview.js"></script>
</head>
<body>
<div id="unity-container">
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="unity-loading-bar">
    <div id="unity-progress-bar-empty">
      <div id="unity-progress-bar-full"></div>
    </div>
  </div>
  <div id="unity-warning"></div>
</div>
<script>
(function () {
  var container = document.querySelector("#unity-container");
  var canvas = document.querySelector("#unity-canvas");
  var loadingBar = document.querySelector("#unity-loading-bar");
  var progressBarFull = document.querySelector("#unity-progress-bar-full");
  var warningBanner = document.querySelector("#unity-warning");
  var gameInstance = null;
  window.gameInstance = null;

  // Richer Yandex Games SDK stub (device info + LoadingAPI)
  window.YaGames = {
    init: function () {
      var ysdk = {
        environment: {
          app: { id: "260481" },
          browser: { language: navigator.language || "en" },
          i18n: { lang: (navigator.language || "en").slice(0, 2), tld: "com" },
          payload: null
        },
        deviceInfo: {
          type: /Mobi|Android/i.test(navigator.userAgent) ? "mobile" : "desktop",
          isMobile: function () { return /Mobi|Android/i.test(navigator.userAgent); },
          isDesktop: function () { return !this.isMobile(); },
          isTablet: function () { return false; },
          isTV: function () { return false; }
        },
        getPlayer: function () {
          return Promise.resolve({
            getUniqueID: function () { return "guest-local"; },
            getName: function () { return "Guest"; },
            getMode: function () { return "lite"; },
            isAuthorized: function () { return false; },
            getPhoto: function () { return ""; }
          });
        },
        getPayments: function () { return Promise.resolve({ getPurchases: function () { return Promise.resolve([]); }, getCatalog: function () { return Promise.resolve([]); } }); },
        adv: {
          showFullscreenAdv: function (opts) { if (opts && opts.callbacks && opts.callbacks.onClose) opts.callbacks.onClose(true); },
          showRewardedVideo: function (opts) { if (opts && opts.callbacks) { if (opts.callbacks.onRewarded) opts.callbacks.onRewarded(); if (opts.callbacks.onClose) opts.callbacks.onClose(true); } }
        },
        features: {
          LoadingAPI: {
            ready: function () { console.log("[YaGames stub] LoadingAPI.ready()"); }
          }
        },
        clipboard: { writeText: function (t) { return navigator.clipboard && navigator.clipboard.writeText(t); } },
        isAvailableMethod: function () { return Promise.resolve(false); },
        getFlags: function () { return Promise.resolve({}); },
        on: function () {}, off: function () {}, dispatch: function () {}
      };
      window.ysdk = ysdk;
      console.log("[YaGames stub] init OK — deviceInfo ready");
      return Promise.resolve(ysdk);
    }
  };
  // Auto-init so Unity does not wait forever
  YaGames.init().then(function (ysdk) {
    try { ysdk.features.LoadingAPI.ready(); } catch (e) {}
  });

  function unityShowBanner(msg, type) {
    var div = document.createElement("div");
    div.innerHTML = msg;
    warningBanner.appendChild(div);
    if (type === "error") div.style = "background:red;padding:10px;color:#fff;";
    else {
      if (type === "warning") div.style = "background:yellow;padding:10px;";
      setTimeout(function () {
        if (div.parentNode) warningBanner.removeChild(div);
      }, 5000);
    }
  }


  // Redirect only Ambient.bank (>1MB) to GitHub raw
  var AMBIENT_GH = "https://raw.githubusercontent.com/Camerons-Git7/FoodCases/main/melon-sandbox/StreamingAssets/FMODBanks/Ambient.bank";
  function rewriteAmbientUrl(url) {
    try {
      var s = (typeof url === "string") ? url : (url && url.url) ? url.url : String(url);
      if (/Ambient\.bank(\?|$)/i.test(s) && s.indexOf("raw.githubusercontent.com") === -1) {
        console.log("[BankProxy] Ambient.bank → GitHub raw");
        return AMBIENT_GH;
      }
    } catch (e) {}
    return url;
  }
  var _fetch = window.fetch.bind(window);
  window.fetch = function (input, init) {
    if (typeof input === "string") input = rewriteAmbientUrl(input);
    else if (input && typeof Request !== "undefined" && input instanceof Request) {
      var nu = rewriteAmbientUrl(input.url);
      if (nu !== input.url) input = new Request(nu, input);
    }
    return _fetch(input, init);
  };
  var _open = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function (method, url) {
    arguments[1] = rewriteAmbientUrl(url);
    return _open.apply(this, arguments);
  };

  // --- IndexedDB cache for large build files ---
  var IDB_NAME = "MelonYandexBuildCache";
  var IDB_STORE = "files";
  var IDB_VER = 2;

  function idbOpen() {
    return new Promise(function (resolve, reject) {
      var req = indexedDB.open(IDB_NAME, IDB_VER);
      req.onupgradeneeded = function () {
        var db = req.result;
        if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
  }
  function idbGet(key) {
    return idbOpen().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(IDB_STORE, "readonly");
        var r = tx.objectStore(IDB_STORE).get(key);
        r.onsuccess = function () { resolve(r.result || null); };
        r.onerror = function () { reject(r.error); };
      });
    });
  }
  function idbPut(key, blob) {
    return idbOpen().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(IDB_STORE, "readwrite");
        tx.objectStore(IDB_STORE).put(blob, key);
        tx.oncomplete = function () { resolve(); };
        tx.onerror = function () { reject(tx.error); };
      });
    });
  }
  function cachedBuildUrl(url, key, minBytes) {
    minBytes = minBytes || 1000;
    return idbGet(key).then(function (cached) {
      if (cached && cached.size >= minBytes) {
        console.log("[BuildCache] HIT", key, "(" + Math.round(cached.size / 1e6 * 10) / 10 + " MB)");
        return URL.createObjectURL(cached);
      }
      if (cached) console.warn("[BuildCache] drop bad cache", key, cached.size + " bytes");
      console.log("[BuildCache] MISS", key, "— fetching", url);
      return fetch(url).then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status + " for " + url);
        return r.blob();
      }).then(function (blob) {
        if (blob.size < minBytes) throw new Error("Too small (" + blob.size + " B) — not a real build file: " + url);
        return idbPut(key, blob).then(function () {
          console.log("[BuildCache] SAVED", key, "(" + Math.round(blob.size / 1e6 * 10) / 10 + " MB)");
          return URL.createObjectURL(blob);
        });
      });
    });
  }

  var PREFIX = "137_release-web-37.1_melon_webgl_715ee47518743728602b12ee07f0e9f279aad00c_v37_1";
  var GH = "https://raw.githubusercontent.com/Camerons-Git7/FoodCases/main/melon-sandbox/Build";
  var loaderUrl = "Build/" + PREFIX + ".loader.js";

  if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
    container.className = "unity-mobile";
    canvas.className = "unity-mobile";
  }

  loadingBar.style.display = "block";
  console.log("Skipping early WebGL probe (avoids context limit)");

  // data + wasm from GitHub raw (>1MB); framework local
  Promise.all([
    cachedBuildUrl(GH + "/" + PREFIX + ".data.unityweb", "data.unityweb", 1e6),
    cachedBuildUrl("Build/" + PREFIX + ".framework.js.unityweb", "framework.unityweb", 10000),
    cachedBuildUrl(GH + "/" + PREFIX + ".wasm.unityweb", "wasm.unityweb", 1e6)
  ]).then(function (urls) {
    var config = {
      dataUrl: urls[0],
      frameworkUrl: urls[1],
      codeUrl: urls[2],
      streamingAssetsUrl: "StreamingAssets",
      companyName: "27 Studio",
      productName: "Melon Sandbox",
      productVersion: "37.1",
      showBanner: unityShowBanner,
      webglContextAttributes: { preserveDrawingBuffer: false, powerPreference: 2 }
    };
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      config.devicePixelRatio = 1.2;
    }

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        progressBarFull.style.width = 100 * progress + "%";
      }).then(function (unityInstance) {
        console.log("UnityInstance Created!", unityInstance);
        window.unityInstance = unityInstance;
        window.gameInstance = unityInstance;
        gameInstance = unityInstance;
        loadingBar.style.display = "none";
      }).catch(function (message) {
        console.error(message);
        alert(message);
      });
    };
    script.onerror = function () {
      alert("Failed to load loader.js — make sure Build/" + PREFIX + ".loader.js is the decompressed JS fix, not gzip.");
    };
    document.body.appendChild(script);
  }).catch(function (e) {
    console.error(e);
    alert("Build load failed: " + e + "\n\nClear IndexedDB MelonYandexBuildCache and check GitHub raw URLs.");
  });
})();
</script>

<style>
    #fb_popup_overlay {
        position: fixed;
        top: 0;

        width: 100%;

        backdrop-filter: blur(4px);
        z-index: 9998;
        display: none;
    }
    
    #fb_popup_container {
        position: fixed;
        top: 0;

    .modal {

    .disable-selection {

    .no-context-menu {
        -webkit-touch-callout: none;
    }
</style>
<div id="fb_popup_overlay" class="disable-selection no-context-menu"></div>
<div id="fb_popup_container" class="disable-selection no-context-menu">
<div class="modal">
<!-- <div id="fb_popup_header_title" class="modal-header">Заголовок</div> -->
<div id="fb_popup_description_title" class="modal-content">Описание</div>
<div class="modal-buttons">
<input type="file" id="fileInput" class="file-input" onchange="fbLoadFiles(event.target.files); return false;"/>
<button id="fb_popup_select_button_title" class="modal-button select-button" onclick="document.getElementById('fileInput').click()">Select</button>
<button id="fb_popup_close_button_title" class="modal-button close-button" onclick="requestCloseFileBrowserForOpen()">Close</button>
</div>
</div>
</div>
<script type="text/javascript">
    // Инициализация при загрузке
    document.addEventListener('DOMContentLoaded', function() {
        initializeFBLibrary();
        
        // Защита от контекстного меню
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });
        
        // Защита от выделения текста
        document.addEventListener('selectstart', function(e) {
            e.preventDefault();
            return false;
        });
    });

    function callFBFunctionByName(functionName, parameter) {
        switch (functionName) {
            case "initializeFBLibrary":
                initializeFBLibrary();
                break;
            case "openFileBrowserForLoad":
                openFileBrowserForLoad(parameter);
                break;
            case "cleanupFB":
                cleanupFB();
                break;
            case "closeFileBrowserForOpen":
                closeFileBrowserForOpen();
                break;
            case "saveFile":
                saveFileFB(parameter);
                break;
            case "setLocalization":
                setLocalizationFB(parameter);
                break;
        }
    }
    document.callFBFunctionByName = callFBFunctionByName;

    function initializeFBLibrary() {
        document.fbPopup = document.getElementById("fb_popup_container");
        document.fbOverlay = document.getElementById("fb_popup_overlay");
        document.fbOpenFilePopupInput = document.getElementById("fileInput");

        document.fbStorage = {
            initialized: true,
            loadedFiles: {},
            dataPointers: []
        };
    }

    function openFileBrowserForLoad(parameters) {
        if (!document.fbStorage || document.fbStorage.initialized !== true)
            return;

        var typesFilter = parameters[0];
        var isMultipleSelection = parameters[1] === 1;
        var isFolder = parameters[2] === 1;

        // Сброс предыдущих атрибутов
        document.fbOpenFilePopupInput.removeAttribute('multiple');
        document.fbOpenFilePopupInput.removeAttribute('webkitdirectory');

        if (isMultipleSelection && !isFolder) {
            document.fbOpenFilePopupInput.setAttribute('multiple', '');
        }

        if (isFolder) {
            document.fbOpenFilePopupInput.setAttribute('webkitdirectory', '');
        }

        document.fbOpenFilePopupInput.accept = typesFilter;
        document.fbOverlay.style.display = "block";
        document.fbPopup.style.display = "flex";
    }

    function closeFileBrowserForOpen() {
        if (!document.fbStorage || document.fbStorage.initialized !== true)
            return;
        document.fbOverlay.style.display = "none";
        document.fbPopup.style.display = "none";
    }

    function cleanupFB() {
        if (!document.fbStorage || document.fbStorage.initialized !== true)
            return;
        document.fbStorage.loadedFiles = {};
        document.fbStorage.dataPointers = [];
    }

    function saveFileFB(fileData){
        if(document.fbStorage.initialized !== true)
            return;

        let fileInfo = {
            status: true,
            message: "",
            name: fileData.name
        };

        try{
            var contentType = 'application/octet-stream';
            var a = document.createElement('a');
            var blob = new Blob([fbBase64ToBytesArray(fileData.data)], {
                'type': contentType
            });
            a.href = window.URL.createObjectURL(blob);
            a.download = fileData.name;

            if (document.createEvent) {
                var event = document.createEvent('MouseEvents');
                event.initEvent('click', true, true);
                a.dispatchEvent(event);
            } else {
                a.click();
            }

            gameInstance.SendMessage(libraryHandlerObjectName, "HandleFileSaved", JSON.stringify(fileInfo));
        }
        catch(ex){
            fileInfo.status = false;
            fileInfo.message = ex.message;

            gameInstance.SendMessage(libraryHandlerObjectName, "HandleFileSaved", JSON.stringify(fileInfo));
        }
    }

    const libraryHandlerObjectName = "[FGFileBrowser]";

    function fbLoadFiles(files) {
        gameInstance.SendMessage(libraryHandlerObjectName, 'SetAmountOfFilesToBeLoaded', Array.from(files).filter(item => !item.name.endsWith(".DS_Store")).length);

        for (var i = 0, f; f = files[i]; i++) {
            // ignore Mac hidden file
            if (f.name.endsWith(".DS_Store"))
                continue;

            var reader = new FileReader();
            reader.onload = (function (file) {
                return function (fileloadEvent) {
                    let loadedFileInfo = fileloadEvent.target.result;
            
                    document.fbStorage.loadedFiles[file.name] = {
                        info: loadedFileInfo
                    };

                    let extensionSplit = file.name.split('.');
                    let extension = extensionSplit[extensionSplit.length - 1];
                    let name = file.name.replace(extension, "");
                    name = name.substring(0, name.length - 1);

                    let loadedFile = {
                        fullName: file.name,
                        name: name,
                        path: "unavailable-in-web",
                        length: loadedFileInfo.byteLength,
                        size: file.size,
                        extension: extension
                    };

                    gameInstance.SendMessage(libraryHandlerObjectName, 'HandleLoadedFile', JSON.stringify(loadedFile));
                }
            })(f);
            
            reader.readAsArrayBuffer(f);
        }
        document.fbOpenFilePopupInput.value = "";
    }

    function requestCloseFileBrowserForOpen() {
        gameInstance.SendMessage(libraryHandlerObjectName, "CloseFileBrowserForOpen");
    }

    function fbBase64ToBytesArray(base64) {
        var binary_string = window.atob(base64);
        var len = binary_string.length;
        var bytes = new Uint8Array(len);
        for (var i = 0; i < len; i++) {
            bytes[i] = binary_string.charCodeAt(i);
        }
        return bytes.buffer;
    }

    function setLocalizationFB(parameter){
        switch(parameter.key){
            case "HEADER_TITLE":
                //document.getElementById("fb_popup_header_title").innerHTML = parameter.value;
                break;
            case "DESCRIPTION_TEXT":
                document.getElementById("fb_popup_description_title").innerHTML = parameter.value;
                break;
            case "SELECT_BUTTON_CONTENT":
                document.getElementById("fb_popup_select_button_title").innerHTML = parameter.value;
                break;
            case "CLOSE_BUTTON_CONTENT":
                document.getElementById("fb_popup_close_button_title").innerHTML = parameter.value;
                break;
        }
    }
</script>
</body>
