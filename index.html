<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Seamless OS</title>
<style>
  :root{
    --accent:#4da3ff;
    --accent-soft:rgba(77,163,255,.18);
    --bg:#0a0a0d;
    --glass:rgba(255,255,255,.08);
    --glass-strong:rgba(255,255,255,.14);
    --glass-border:rgba(255,255,255,.14);
    --text:#f2f3f5;
    --text-dim:rgba(242,243,245,.6);
    --radius-lg:18px;
    --radius-md:12px;
    --radius-sm:8px;
    --blur:22px;
    --taskbar-h:56px;
    --dur:.18s;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0; overflow:hidden;}
  body{
    font-family:"Segoe UI Variable","Inter",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    color:var(--text);
    background:#000;
    user-select:none;
    -webkit-user-select:none;
  }
  img{-webkit-user-drag:none; user-drag:none; pointer-events:none;}
  button{font-family:inherit; color:inherit; border:none; background:none; cursor:pointer;}
  ::selection{background:var(--accent-soft);}

  /* ---------- low performance mode ---------- */
  body.low-perf .glass{backdrop-filter:none !important; -webkit-backdrop-filter:none !important; background:rgba(18,18,22,.92) !important;}
  body.low-perf *{transition-duration:.001s !important; animation-duration:.001s !important; box-shadow:none !important;}
  body.low-perf .win{filter:none !important;}

  /* ================= WALLPAPER LAYERS ================= */
  .wallpaper-layer{position:fixed; inset:0; overflow:hidden; z-index:0; background:#111;}
  .wallpaper-layer video, .wallpaper-layer img{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  }
  .wallpaper-layer::after{
    content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,.05), rgba(0,0,0,.22) 82%, rgba(0,0,0,.45));
    pointer-events:none;
  }

  /* ================= LOCK SCREEN ================= */
  #lockscreen{
    position:fixed; inset:0; z-index:9999;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    cursor:pointer;
    transition:transform .5s cubic-bezier(.4,0,.2,1), opacity .4s ease;
  }
  #lockscreen.hidden{ transform:translateY(-100%); opacity:0; pointer-events:none; }
  .lock-clock{ text-align:center; margin-top:-4vh; pointer-events:none; text-shadow:0 4px 30px rgba(0,0,0,.5);}
  .lock-time{ font-size:min(11vw,108px); font-weight:600; letter-spacing:-2px; line-height:1;}
  .lock-date{ font-size:20px; font-weight:400; margin-top:6px; color:rgba(255,255,255,.9);}
  .lock-hint{
    position:absolute; bottom:8vh; font-size:14px; color:rgba(255,255,255,.75);
    display:flex; flex-direction:column; align-items:center; gap:10px;
    animation:lockPulse 2.4s ease-in-out infinite;
  }
  @keyframes lockPulse{0%,100%{opacity:.55;} 50%{opacity:1;}}
  .lock-hint svg{width:22px; height:22px;}

  /* ================= DESKTOP ================= */
  #desktop{position:fixed; inset:0; z-index:1;}
  #desktopIcons{
    position:absolute; top:18px; left:18px; z-index:2;
    display:grid; grid-template-columns:84px; gap:4px;
    max-height:calc(100vh - var(--taskbar-h) - 40px);
  }
  .dicon{
    width:84px; padding:8px 4px 10px; border-radius:var(--radius-sm);
    display:flex; flex-direction:column; align-items:center; gap:6px;
    text-align:center; cursor:pointer;
  }
  .dicon:hover, .dicon.selected{background:rgba(255,255,255,.12);}
  .dicon img{width:42px; height:42px; border-radius:10px; object-fit:cover; box-shadow:0 3px 10px rgba(0,0,0,.4);}
  .dicon span{font-size:11.5px; line-height:1.25; text-shadow:0 1px 4px rgba(0,0,0,.8); word-break:break-word;}

  /* ================= WINDOWS ================= */
  #windowsLayer{position:absolute; inset:0; z-index:5;}
  .win{
    position:absolute; min-width:280px; min-height:200px;
    border-radius:var(--radius-lg); overflow:hidden;
    background:#151519;
    box-shadow:0 24px 60px -10px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06);
    display:flex; flex-direction:column;
    transition:opacity var(--dur) ease, transform var(--dur) ease;
    animation:winOpen .22s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes winOpen{from{opacity:0; transform:scale(.94);} to{opacity:1; transform:scale(1);}}
  .win.minimized{display:none;}
  .win.maximized{border-radius:0 !important;}
  .win-header{
    height:40px; flex:0 0 auto; display:flex; align-items:center; gap:8px;
    padding:0 8px 0 12px; background:rgba(255,255,255,.05); cursor:default;
    border-bottom:1px solid rgba(255,255,255,.06);
  }
  .win-header img{width:18px; height:18px; border-radius:4px;}
  .win-title{font-size:13px; font-weight:500; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:rgba(255,255,255,.9);}
  .win-btn{
    width:30px; height:26px; border-radius:6px; display:flex; align-items:center; justify-content:center;
  }
  .win-btn:hover{background:rgba(255,255,255,.12);}
  .win-btn.close:hover{background:#e5484d;}
  .win-btn svg{width:11px; height:11px;}
  .win-body{flex:1; position:relative; background:#0e0e11;}
  .win-body iframe{width:100%; height:100%; border:0; background:#0e0e11;}
  .win-resize{position:absolute; right:0; bottom:0; width:16px; height:16px; cursor:nwse-resize; z-index:2;}
  .win.dragging, .win.resizing{transition:none; user-select:none;}
  .win.focused{box-shadow:0 30px 70px -8px rgba(0,0,0,.65), 0 0 0 1px var(--accent-soft);}

  /* ================= TASKBAR ================= */
  #taskbar{
    position:fixed; left:50%; bottom:10px; transform:translateX(-50%);
    z-index:100; height:var(--taskbar-h);
    display:flex; align-items:center; gap:4px;
    padding:0 10px; border-radius:16px;
    max-width:calc(100vw - 20px);
  }
  .glass{
    background:rgba(24,24,30,.55);
    backdrop-filter:blur(var(--blur)) saturate(1.4);
    -webkit-backdrop-filter:blur(var(--blur)) saturate(1.4);
    border:1px solid var(--glass-border);
  }
  .tb-btn{
    width:42px; height:42px; border-radius:10px;
    display:flex; align-items:center; justify-content:center; position:relative;
    flex:0 0 auto;
  }
  .tb-btn:hover{background:rgba(255,255,255,.1);}
  .tb-btn.active{background:rgba(255,255,255,.16);}
  .tb-btn img{width:24px; height:24px; border-radius:6px; object-fit:cover;}
  .tb-btn .dot{position:absolute; bottom:3px; left:50%; transform:translateX(-50%); width:4px; height:4px; border-radius:50%; background:var(--accent);}
  #startBtn{width:44px; height:44px; border-radius:11px; display:flex; align-items:center; justify-content:center;}
  #startBtn svg{width:20px; height:20px;}
  #startBtn:hover, #startBtn.active{background:rgba(255,255,255,.12);}
  #tbSearch{
    display:flex; align-items:center; gap:8px; height:42px; padding:0 14px;
    border-radius:10px; width:200px; background:rgba(255,255,255,.06);
  }
  #tbSearch input{background:none; border:0; outline:0; color:var(--text); font-size:13px; width:100%;}
  #tbSearch svg{width:15px; height:15px; opacity:.7; flex:0 0 auto;}
  #pinnedApps, #openApps{display:flex; align-items:center; gap:2px;}
  .tb-sep{width:1px; height:26px; background:rgba(255,255,255,.12); margin:0 4px;}
  #trayIcons{display:flex; align-items:center; gap:2px; margin-left:4px;}
  #clockTray{padding:0 12px; height:42px; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:10px; cursor:pointer;}
  #clockTray:hover{background:rgba(255,255,255,.1);}
  #clockTray .t1{font-size:12.5px; font-weight:600; line-height:1.2;}
  #clockTray .t2{font-size:10.5px; color:var(--text-dim); line-height:1.2;}

  /* ================= START MENU ================= */
  #startMenu{
    position:fixed; left:50%; bottom:calc(var(--taskbar-h) + 20px); transform:translateX(-50%) translateY(12px) scale(.98);
    width:min(620px, 94vw); max-height:70vh;
    border-radius:var(--radius-lg); z-index:99;
    display:flex; flex-direction:column;
    opacity:0; pointer-events:none;
    transition:opacity var(--dur) ease, transform var(--dur) ease;
    box-shadow:0 30px 70px -10px rgba(0,0,0,.6);
  }
  #startMenu.open{opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0) scale(1);}
  .sm-search{display:flex; align-items:center; gap:10px; margin:18px 20px 6px; padding:0 14px; height:42px; border-radius:10px; background:rgba(255,255,255,.07);}
  .sm-search svg{width:15px; height:15px; opacity:.7;}
  .sm-search input{flex:1; background:none; border:0; outline:0; color:var(--text); font-size:13.5px;}
  .sm-label{font-size:12px; font-weight:600; color:var(--text-dim); margin:14px 22px 8px; letter-spacing:.2px;}
  .sm-pinned{display:flex; gap:6px; padding:0 16px; flex-wrap:wrap;}
  .sm-scroll{overflow-y:auto; padding-bottom:8px; flex:1;}
  .sm-grid{display:grid; grid-template-columns:repeat(auto-fill, 88px); gap:2px; padding:0 12px;}
  .sm-app{
    width:88px; padding:10px 4px; border-radius:10px; display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer; text-align:center;
  }
  .sm-app:hover{background:rgba(255,255,255,.09);}
  .sm-app img{width:34px; height:34px; border-radius:8px; object-fit:cover;}
  .sm-app span{font-size:11px; line-height:1.2; color:rgba(255,255,255,.88); word-break:break-word;}
  .sm-pin{
    width:52px; height:52px; border-radius:10px; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .sm-pin:hover{background:rgba(255,255,255,.09);}
  .sm-pin img{width:28px; height:28px; border-radius:7px; object-fit:cover;}
  .sm-footer{display:flex; align-items:center; justify-content:space-between; padding:10px 20px; border-top:1px solid rgba(255,255,255,.08);}
  .sm-userchip{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-dim);}
  .sm-empty{padding:30px; text-align:center; color:var(--text-dim); font-size:13px;}

  /* ================= SETTINGS PANEL ================= */
  #settingsPanel{
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) scale(.97);
    width:min(720px, 94vw); max-height:82vh;
    border-radius:var(--radius-lg); z-index:200;
    display:flex; flex-direction:column; opacity:0; pointer-events:none;
    transition:opacity var(--dur) ease, transform var(--dur) ease;
    box-shadow:0 40px 90px -10px rgba(0,0,0,.65);
  }
  #settingsPanel.open{opacity:1; pointer-events:auto; transform:translate(-50%,-50%) scale(1);}
  .set-head{display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid rgba(255,255,255,.08);}
  .set-head h2{font-size:16px; font-weight:600; margin:0;}
  .set-body{overflow-y:auto; padding:20px 22px 26px;}
  .set-section{margin-bottom:26px;}
  .set-section h3{font-size:12.5px; font-weight:600; color:var(--text-dim); text-transform:uppercase; letter-spacing:.4px; margin:0 0 12px;}
  .set-tabs{display:flex; gap:6px; margin-bottom:12px;}
  .set-tab{padding:7px 14px; border-radius:8px; font-size:12.5px; background:rgba(255,255,255,.06);}
  .set-tab.active{background:var(--accent); color:#08131f; font-weight:600;}
  .wall-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px;}
  .wall-item{border-radius:10px; overflow:hidden; cursor:pointer; position:relative; aspect-ratio:16/10; background:#1a1a20; border:2px solid transparent;}
  .wall-item.selected{border-color:var(--accent);}
  .wall-item img, .wall-item video{width:100%; height:100%; object-fit:cover; display:block;}
  .wall-item .wname{position:absolute; left:0; right:0; bottom:0; font-size:10.5px; padding:4px 6px; background:linear-gradient(0deg, rgba(0,0,0,.75), transparent); }
  .toggle-row{display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border-radius:10px; background:rgba(255,255,255,.05); margin-bottom:8px;}
  .toggle-row .tr-txt strong{display:block; font-size:13.5px;}
  .toggle-row .tr-txt span{font-size:11.5px; color:var(--text-dim);}
  .switch{width:42px; height:24px; border-radius:99px; background:rgba(255,255,255,.16); position:relative; flex:0 0 auto; transition:background .15s;}
  .switch.on{background:var(--accent);}
  .switch::after{content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#fff; transition:transform .15s;}
  .switch.on::after{transform:translateX(18px);}

  /* ================= CONTEXT MENU ================= */
  #ctxMenu{
    position:fixed; z-index:500; min-width:200px; border-radius:10px; padding:6px; display:none;
    box-shadow:0 20px 50px -8px rgba(0,0,0,.6);
  }
  .ctx-item{padding:9px 12px; border-radius:7px; font-size:13px; cursor:pointer; display:flex; align-items:center; gap:10px;}
  .ctx-item:hover{background:rgba(255,255,255,.1);}
  .ctx-sep{height:1px; background:rgba(255,255,255,.1); margin:5px 4px;}

  /* scrollbars */
  ::-webkit-scrollbar{width:9px; height:9px;}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18); border-radius:99px;}
  ::-webkit-scrollbar-track{background:transparent;}

  @media (max-width:700px){
    #tbSearch{width:120px;}
    #desktopIcons{grid-template-columns:72px;}
    .dicon{width:72px;}
  }
</style>
</head>

    <!-- SETTINGS PANEL -->

      <div class="set-head">
        <h2>Settings</h2>
        <button class="tb-btn" id="settingsCloseBtn">

      </div>
      <div class="set-body">
        <div class="set-section">
          <h3>Performance</h3>

            <div class="switch" id="perfSwitch"></div>

        </div>
        <div class="set-section">
          <h3>Personalize background</h3>

          <div class="wall-grid" id="wallGrid"></div>
        </div>
      </div>
    </div>

    <!-- TASKBAR -->
    <div id="taskbar" class="glass">

        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>
      </button>
      <div id="tbSearch">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3" stroke-linecap="round"/></svg>

      <div id="trayIcons">
        <button class="tb-btn" id="perfTrayBtn" title="Low performance mode">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"/></svg>
        </button>
        <button class="tb-btn" id="wallpaperTrayBtn" title="Personalize">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="14" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 15l-5-5-9 9"/></svg>

        <div id="clockTray">
          <div class="t1" id="trayTime">--:--</div>
          <div class="t2" id="trayDate">--/--</div>
        </div>
      </div>
    </div>

  </div>

  <!-- CONTEXT MENU -->
  <div id="ctxMenu" class="glass"></div>

function loadPrefs(){
  try{
    var lp = localStorage.getItem('sos_lowperf');
    if(lp !== null) state.lowPerf = lp === '1';
    else {
      // auto-detect weak devices
      var cores = navigator.hardwareConcurrency || 4;
      var mem = navigator.deviceMemory || 4;
      var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      state.lowPerf = cores <= 2 || mem <= 2 || reduced;
    }
    var hk = localStorage.getItem('sos_home');
    if(hk && wallpaperRegistry[hk]) state.homeKey = hk;
    var lk = localStorage.getItem('sos_lock');
    if(lk && wallpaperRegistry[lk]) state.lockKey = lk;
  }catch(e){}
}
function savePrefs(){
  try{
    localStorage.setItem('sos_lowperf', state.lowPerf ? '1':'0');
    localStorage.setItem('sos_home', state.homeKey);
    localStorage.setItem('sos_lock', state.lockKey);
  }catch(e){}
}

/* =========================================================
   HELPERS
========================================================= */
function $(sel){ return document.querySelector(sel); }
function el(tag, cls){ var e=document.createElement(tag); if(cls) e.className=cls; return e; }
function isVideoUrl(u){ return /\.(mp4|mov|webm)$/i.test(u); }
function sortedAppKeys(){
  return Object.keys(APPS).sort(function(a,b){
    return APPS[a].title.localeCompare(APPS[b].title);
  });
}
function pinnedAppKeys(){
  return sortedAppKeys().filter(function(k){ return APPS[k].pinned; });
}

/* =========================================================
   WALLPAPER RENDERING
========================================================= */
function renderWallpaper(containerId, key){
  var container = document.getElementById(containerId);
  container.innerHTML = '';
  var entry = wallpaperRegistry[key];
  if(!entry){ container.style.background = '#111'; return; }
  if(isVideoUrl(entry.url)){
    var v = document.createElement('video');
    v.muted = true; v.playsInline = true; v.setAttribute('playsinline','');
    v.src = entry.url;
    if(state.lowPerf){
      // optimization: no autoplay/loop, decode a single frame and pause
      v.loop = false; v.autoplay = false;
      v.addEventListener('loadeddata', function(){ try{ v.currentTime = 0.1; v.pause(); }catch(e){} }, {once:true});
    } else {
      v.loop = true; v.autoplay = true;
      v.play && v.play().catch(function(){});
    }
    container.appendChild(v);
  } else {
    var img = document.createElement('img');
    img.src = entry.url;
    img.loading = 'eager';
    container.appendChild(img);
  }
}
function applyWallpapers(){
  renderWallpaper('homeWallpaper', state.homeKey);
  renderWallpaper('lockWallpaper', state.lockKey);
}

   LOW PERF MODE
========================================================= */
function applyLowPerf(){
  document.body.classList.toggle('low-perf', state.lowPerf);
  $('#perfSwitch').classList.toggle('on', state.lowPerf);
  $('#perfTrayBtn').classList.toggle('active', state.lowPerf);
  applyWallpapers();
}

/* =========================================================
   CLOCK
========================================================= */
function pad(n){ return n<10 ? '0'+n : ''+n; }
function updateClock(){
  var now = new Date();
  var h = now.getHours(), m = pad(now.getMinutes());
  var h12 = h % 12; if(h12===0) h12 = 12;
  var ampm = h >= 12 ? 'PM' : 'AM';
  var timeStr = h12 + ':' + m + ' ' + ampm;
  var dateOpts = { weekday:'long', month:'long', day:'numeric' };
  var dateStr = now.toLocaleDateString(undefined, dateOpts);
  var shortDate = (now.getMonth()+1) + '/' + now.getDate() + '/' + now.getFullYear();

  $('#lockTime').textContent = timeStr;
  $('#lockDate').textContent = dateStr;
  $('#trayTime').textContent = h12 + ':' + m + ' ' + ampm;
  $('#trayDate').textContent = shortDate;
}

/* =========================================================
   DESKTOP ICONS + START MENU + TASKBAR PINS
========================================================= */
function buildDesktopIcons(){
  var wrap = $('#desktopIcons');
  wrap.innerHTML = '';
  pinnedAppKeys().forEach(function(key){
    var app = APPS[key];
    var d = el('div','dicon');
    d.dataset.key = key;
    d.innerHTML = '<img src="'+app.icon+'" alt=""><span>'+app.title+'</span>';
    d.addEventListener('click', function(ev){
      ev.stopPropagation();
      document.querySelectorAll('.dicon.selected').forEach(function(x){x.classList.remove('selected');});
      d.classList.add('selected');
    });
    d.addEventListener('dblclick', function(){ openApp(key); });
    wrap.appendChild(d);
  });
}

function buildTaskbarPins(){
  var wrap = $('#pinnedApps');
  wrap.innerHTML = '';
  pinnedAppKeys().forEach(function(key){
    var app = APPS[key];
    var b = el('button','tb-btn');
    b.dataset.key = key;
    b.title = app.title;
    b.innerHTML = '<img src="'+app.icon+'" alt="">';
    b.addEventListener('click', function(){
      var existing = findWindowByApp(key);
      if(existing) toggleWindowFocus(existing);
      else openApp(key);
    });
    wrap.appendChild(b);
  });
}

function buildStartMenu(filter){
  filter = (filter||'').toLowerCase().trim();

  var pinnedWrap = $('#smPinned');
  pinnedWrap.innerHTML = '';
  pinnedAppKeys().forEach(function(key){
    var app = APPS[key];
    var p = el('div','sm-pin');
    p.title = app.title;
    p.innerHTML = '<img src="'+app.icon+'" alt="">';
    p.addEventListener('click', function(){ openApp(key); closeStartMenu(); });
    pinnedWrap.appendChild(p);
  });

  var grid = $('#smGrid');
  grid.innerHTML = '';
  var keys = sortedAppKeys().filter(function(k){
    return !filter || APPS[k].title.toLowerCase().indexOf(filter) !== -1;
  });
  if(keys.length === 0){
    var empty = el('div','sm-empty');
    empty.textContent = 'No apps found for "' + filter + '"';
    grid.appendChild(empty);
    return;
  }
  keys.forEach(function(key){
    var app = APPS[key];
    var a = el('div','sm-app');
    a.innerHTML = '<img src="'+app.icon+'" alt=""><span>'+app.title+'</span>';
    a.addEventListener('click', function(){ openApp(key); closeStartMenu(); });
    grid.appendChild(a);
  });
}

/* =========================================================
   START MENU open/close
========================================================= */
function openStartMenu(){
  $('#startMenu').classList.add('open');
  $('#startBtn').classList.add('active');
  buildStartMenu('');
  $('#smSearchInput').value = '';
  setTimeout(function(){ $('#smSearchInput').focus(); }, 60);
}
function closeStartMenu(){
  $('#startMenu').classList.remove('open');
  $('#startBtn').classList.remove('active');
}
function toggleStartMenu(){
  if($('#startMenu').classList.contains('open')) closeStartMenu();
  else openStartMenu();
}

/* =========================================================
   WINDOW MANAGER
========================================================= */
function findWindowByApp(key){
  for(var id in state.windows){ if(state.windows[id].appKey === key) return id; }
  return null;
}

function nextZ(){ state.zTop += 1; return state.zTop; }

function focusWindow(id){
  Object.keys(state.windows).forEach(function(wid){
    var w = state.windows[wid];
    w.el.classList.toggle('focused', wid === id);
  });
  var w = state.windows[id];
  w.el.style.zIndex = nextZ();
  updateTaskbarRunningState();
}

function toggleWindowFocus(id){
  var w = state.windows[id];
  if(!w) return;
  if(w.minimized){
    w.minimized = false;
    w.el.classList.remove('minimized');
    focusWindow(id);
  } else {
    var isTop = parseInt(w.el.style.zIndex||0,10) === state.zTop;
    if(isTop){
      w.minimized = true;
      w.el.classList.add('minimized');
    } else {
      focusWindow(id);
    }
  }
  updateTaskbarRunningState();
}

function updateTaskbarRunningState(){
  var wrap = $('#openApps');
  wrap.innerHTML = '';
  Object.keys(state.windows).forEach(function(id){
    var w = state.windows[id];
    var app = APPS[w.appKey];
    var b = el('button','tb-btn');
    var isTop = !w.minimized && parseInt(w.el.style.zIndex||0,10) === state.zTop;
    if(isTop) b.classList.add('active');
    b.innerHTML = '<img src="'+app.icon+'" alt=""><span class="dot"></span>';
    b.title = app.title;
    b.addEventListener('click', function(){ toggleWindowFocus(id); });
    wrap.appendChild(b);
  });
  if(Object.keys(state.windows).length){
    wrap.insertAdjacentHTML('afterbegin','');
  }
  var sep = $('.tb-sep');
}

function openApp(key){
  var existing = findWindowByApp(key);
  if(existing){
    var w = state.windows[existing];
    w.minimized = false;
    w.el.classList.remove('minimized');
    focusWindow(existing);
    return;
  }
  var app = APPS[key];
  if(!app) return;

  state.winCount += 1;
  var id = 'win_' + state.winCount;

  var winW = Math.min(920, window.innerWidth - 60);
  var winH = Math.min(600, window.innerHeight - 140);
  var offset = (state.winCount % 6) * 24;
  var left = Math.max(20, (window.innerWidth - winW)/2 + offset - 60);
  var top = Math.max(20, (window.innerHeight - winH)/2 + offset - 60 - 20);

  var winEl = el('div','win');
  winEl.style.left = left+'px';
  winEl.style.top = top+'px';
  winEl.style.width = winW+'px';
  winEl.style.height = winH+'px';
  winEl.style.zIndex = nextZ();

  winEl.innerHTML =
    '<div class="win-header">'+
      '<img src="'+app.icon+'" alt="">'+
      '<div class="win-title">'+app.title+'</div>'+
      '<button class="win-btn" data-act="min" title="Minimize">'+
        '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>'+
      '</button>'+
      '<button class="win-btn" data-act="max" title="Maximize">'+
        '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><rect x="5" y="5" width="14" height="14" rx="1.5"/></svg>'+
      '</button>'+
      '<button class="win-btn close" data-act="close" title="Close">'+
        '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'+
      '</button>'+
    '</div>'+
    '<div class="win-body"><iframe src="'+app.path+'" loading="lazy" allow="autoplay; fullscreen; gamepad; clipboard-write" allowfullscreen></iframe></div>'+
    '<div class="win-resize"></div>';

  $('#windowsLayer').appendChild(winEl);

  state.windows[id] = { el: winEl, appKey: key, minimized:false, maximized:false, prevRect:null };

  // header drag
  var header = winEl.querySelector('.win-header');
  header.addEventListener('mousedown', function(e){
    if(e.target.closest('.win-btn')) return;
    startDrag(e, id);
  });
  header.addEventListener('touchstart', function(e){
    if(e.target.closest('.win-btn')) return;
    startDrag(e.touches[0], id, true);
  }, {passive:true});
  header.addEventListener('dblclick', function(e){
    if(e.target.closest('.win-btn')) return;
    toggleMaximize(id);
  });

  // resize
  var rHandle = winEl.querySelector('.win-resize');
  rHandle.addEventListener('mousedown', function(e){ startResize(e, id); });

  // buttons
  winEl.querySelector('[data-act="min"]').addEventListener('click', function(){ minimizeWindow(id); });
  winEl.querySelector('[data-act="max"]').addEventListener('click', function(){ toggleMaximize(id); });
  winEl.querySelector('[data-act="close"]').addEventListener('click', function(){ closeWindow(id); });

  winEl.addEventListener('mousedown', function(){ focusWindow(id); });

  focusWindow(id);
  updateTaskbarRunningState();
}

function minimizeWindow(id){
  var w = state.windows[id];
  if(!w) return;
  w.minimized = true;
  w.el.classList.add('minimized');
  updateTaskbarRunningState();
}

function toggleMaximize(id){
  var w = state.windows[id];
  if(!w) return;
  if(!w.maximized){
    w.prevRect = { left:w.el.style.left, top:w.el.style.top, width:w.el.style.width, height:w.el.style.height };
    w.el.style.left='0px'; w.el.style.top='0px';
    w.el.style.width='100vw'; w.el.style.height='calc(100vh - '+ (parseInt(getComputedStyle(document.documentElement).getPropertyValue('--taskbar-h'))+18) +'px)';
    w.el.classList.add('maximized');
    w.maximized = true;
  } else {
    if(w.prevRect){
      w.el.style.left = w.prevRect.left; w.el.style.top = w.prevRect.top;
      w.el.style.width = w.prevRect.width; w.el.style.height = w.prevRect.height;
    }
    w.el.classList.remove('maximized');
    w.maximized = false;
  }
  focusWindow(id);
}

function closeWindow(id){
  var w = state.windows[id];
  if(!w) return;
  w.el.remove();
  delete state.windows[id];
  updateTaskbarRunningState();
}

var dragCtx = null;
function startDrag(pt, id, touch){
  var w = state.windows[id];
  if(!w || w.maximized) return;
  focusWindow(id);
  var rect = w.el.getBoundingClientRect();
  dragCtx = { id:id, offX: pt.clientX - rect.left, offY: pt.clientY - rect.top };
  w.el.classList.add('dragging');
  if(touch){
    document.addEventListener('touchmove', onDragTouch, {passive:false});
    document.addEventListener('touchend', endDrag);
  } else {
    document.addEventListener('mousemove', onDrag);
    document.addEventListener('mouseup', endDrag);
  }
}
function onDrag(e){ doDrag(e.clientX, e.clientY); }
function onDragTouch(e){ e.preventDefault(); doDrag(e.touches[0].clientX, e.touches[0].clientY); }
function doDrag(x,y){
  if(!dragCtx) return;
  var w = state.windows[dragCtx.id];
  if(!w) return;
  var nx = Math.max(0, Math.min(window.innerWidth - 120, x - dragCtx.offX));
  var ny = Math.max(0, Math.min(window.innerHeight - 60, y - dragCtx.offY));
  w.el.style.left = nx+'px';
  w.el.style.top = ny+'px';
}
function endDrag(){
  if(dragCtx){
    var w = state.windows[dragCtx.id];
    if(w) w.el.classList.remove('dragging');
  }
  dragCtx = null;
  document.removeEventListener('mousemove', onDrag);
  document.removeEventListener('mouseup', endDrag);
  document.removeEventListener('touchmove', onDragTouch);
  document.removeEventListener('touchend', endDrag);
}

var resizeCtx = null;
function startResize(e, id){
  e.stopPropagation();
  var w = state.windows[id];
  if(!w || w.maximized) return;
  focusWindow(id);
  var rect = w.el.getBoundingClientRect();
  resizeCtx = { id:id, startX:e.clientX, startY:e.clientY, startW:rect.width, startH:rect.height };
  w.el.classList.add('resizing');
  document.addEventListener('mousemove', onResize);
  document.addEventListener('mouseup', endResize);
}
function onResize(e){
  if(!resizeCtx) return;
  var w = state.windows[resizeCtx.id];
  if(!w) return;
  var newW = Math.max(320, resizeCtx.startW + (e.clientX - resizeCtx.startX));
  var newH = Math.max(220, resizeCtx.startH + (e.clientY - resizeCtx.startY));
  w.el.style.width = newW+'px';
  w.el.style.height = newH+'px';
}
function endResize(){
  if(resizeCtx){
    var w = state.windows[resizeCtx.id];
    if(w) w.el.classList.remove('resizing');
  }
  resizeCtx = null;
  document.removeEventListener('mousemove', onResize);
  document.removeEventListener('mouseup', endResize);
}

/* =========================================================
   SETTINGS PANEL
========================================================= */
var settingsTab = 'home';
function openSettings(){
  $('#settingsPanel').classList.add('open');
  buildWallGrid();
  closeStartMenu();
}
function closeSettings(){ $('#settingsPanel').classList.remove('open'); }

function buildWallGrid(){
  var grid = $('#wallGrid');
  grid.innerHTML = '';
  var currentKey = settingsTab === 'home' ? state.homeKey : state.lockKey;
  Object.keys(wallpaperRegistry).forEach(function(key){
    var entry = wallpaperRegistry[key];
    var item = el('div','wall-item');
    if(key === currentKey) item.classList.add('selected');
    if(isVideoUrl(entry.url)){
      item.innerHTML = '<video muted playsinline preload="metadata"></video><div class="wname">'+entry.name+'</div>';
      var v = item.querySelector('video');
      v.src = entry.url;
    } else {
      item.innerHTML = '<img loading="lazy"><div class="wname">'+entry.name+'</div>';
      item.querySelector('img').src = entry.url;
    }
    item.addEventListener('click', function(){
      if(settingsTab === 'home') state.homeKey = key; else state.lockKey = key;
      savePrefs();
      applyWallpapers();
      buildWallGrid();
    });
    grid.appendChild(item);
  });
}

/* =========================================================
   CONTEXT MENU
========================================================= */
function showContextMenu(x,y){
  var menu = $('#ctxMenu');
  menu.innerHTML =
    '<div class="ctx-item" id="ctxPersonalize">'+
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="14" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M21 15l-5-5-9 9"/></svg>'+
      'Personalize'+
    '</div>'+
    '<div class="ctx-item" id="ctxPerf">'+
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"/></svg>'+
      (state.lowPerf ? 'Disable low performance mode' : 'Enable low performance mode')+
    '</div>'+
    '<div class="ctx-sep"></div>'+
    '<div class="ctx-item" id="ctxRefresh">'+
      '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-3-6.7"/><path d="M21 3v6h-6"/></svg>'+
      'Refresh'+
    '</div>';
  menu.style.left = Math.min(x, window.innerWidth-210)+'px';
  menu.style.top = Math.min(y, window.innerHeight-170)+'px';
  menu.style.display = 'block';

  $('#ctxPersonalize').addEventListener('click', function(){ hideContextMenu(); settingsTab='home'; document.querySelectorAll('.set-tab').forEach(function(t){t.classList.toggle('active', t.dataset.target==='home');}); openSettings(); });
  $('#ctxPerf').addEventListener('click', function(){ hideContextMenu(); state.lowPerf = !state.lowPerf; savePrefs(); applyLowPerf(); });
  $('#ctxRefresh').addEventListener('click', function(){ hideContextMenu(); applyWallpapers(); });
}
function hideContextMenu(){ $('#ctxMenu').style.display = 'none'; }

/* =========================================================
   EVENTS / INIT
========================================================= */
function unlock(){
  if(state.unlocked) return;
  state.unlocked = true;
  $('#lockscreen').classList.add('hidden');
}

function initEvents(){
  // lock screen
  $('#lockscreen').addEventListener('click', unlock);
  document.addEventListener('keydown', function(e){
    if(!state.unlocked){ unlock(); }
    else if(e.key === 'Escape'){ closeStartMenu(); closeSettings(); hideContextMenu(); }
  });

  // start menu
  $('#startBtn').addEventListener('click', function(e){ e.stopPropagation(); toggleStartMenu(); });
  $('#smSearchInput').addEventListener('input', function(){ buildStartMenu(this.value); });
  $('#smSettingsBtn').addEventListener('click', function(){ closeStartMenu(); openSettings(); });

  // taskbar search
  $('#tbSearchInput').addEventListener('focus', function(){ openStartMenu(); });
  $('#tbSearchInput').addEventListener('input', function(){
    if(!$('#startMenu').classList.contains('open')) openStartMenu();
    $('#smSearchInput').value = this.value;
    buildStartMenu(this.value);
  });

  // tray
  $('#perfTrayBtn').addEventListener('click', function(){ state.lowPerf = !state.lowPerf; savePrefs(); applyLowPerf(); });
  $('#wallpaperTrayBtn').addEventListener('click', function(){ openSettings(); });
  $('#clockTray').addEventListener('click', function(){});

  // settings panel
  $('#settingsCloseBtn').addEventListener('click', closeSettings);
  $('#perfRow').addEventListener('click', function(){ state.lowPerf = !state.lowPerf; savePrefs(); applyLowPerf(); });
  document.querySelectorAll('.set-tab').forEach(function(tab){
    tab.addEventListener('click', function(){
      document.querySelectorAll('.set-tab').forEach(function(t){t.classList.remove('active');});
      tab.classList.add('active');
      settingsTab = tab.dataset.target;
      buildWallGrid();
    });
  });

  // desktop clicks
  $('#desktop').addEventListener('click', function(e){
    if(e.target.id === 'desktop' || e.target.classList.contains('wallpaper-layer')){
      document.querySelectorAll('.dicon.selected').forEach(function(x){x.classList.remove('selected');});
      closeStartMenu();
      hideContextMenu();
    }
  });
  $('#desktop').addEventListener('contextmenu', function(e){
    if(e.target.closest('.win') || e.target.closest('#taskbar') || e.target.closest('#startMenu') || e.target.closest('#settingsPanel')) return;
    e.preventDefault();
    showContextMenu(e.clientX, e.clientY);
  });
  document.addEventListener('click', function(e){
    if(!e.target.closest('#ctxMenu')) hideContextMenu();
    if(!e.target.closest('#startMenu') && !e.target.closest('#startBtn') && !e.target.closest('#tbSearch')) closeStartMenu();
  });
  window.addEventListener('resize', function(){ /* keep windows within viewport loosely */ });
}

function init(){
  loadPrefs();
  applyWallpapers();
  applyLowPerf();
  buildDesktopIcons();
  buildTaskbarPins();
  buildStartMenu('');
  updateClock();
  setInterval(updateClock, 1000 * 15);
  setInterval(updateClock, 1000);
  initEvents();
}

document.addEventListener('DOMContentLoaded', init);

})();
</script>
