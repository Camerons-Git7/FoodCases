    <path d="M87 101 A48 48 0 0 1 60 108"/>
    <path d="M53 108 A48 48 0 0 1 26 94"/>
    <path d="M19 87 A48 48 0 0 1 12 60"/>
    <path d="M12 53 A48 48 0 0 1 26 26"/>
    <path d="M33 19 A48 48 0 0 1 60 12"/>
  </g>
  <!-- Inner sun core -->
  <circle cx="60" cy="60" r="22" fill="url(#solaraCore)"/>
  <circle cx="60" cy="60" r="22" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="1.5"/>
