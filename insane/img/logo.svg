<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="solaraGrad" x1="20" y1="14" x2="100" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD56B"/>
      <stop offset="0.45" stop-color="#FF8A5B"/>
      <stop offset="0.75" stop-color="#FF5E8A"/>
      <stop offset="1" stop-color="#A95BFF"/>
    </linearGradient>
    <linearGradient id="solaraCore" x1="40" y1="40" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF3D6"/>
