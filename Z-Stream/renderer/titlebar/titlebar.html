<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      height:32px;background:rgba(8,8,8,0.95);
      display:flex;align-items:center;justify-content:space-between;
      padding:0 14px;-webkit-app-region:drag;
      border-bottom:1px solid rgba(255,255,255,0.05);
      font-family:'Inter',sans-serif;user-select:none;overflow:hidden;
    }
    span{color:#555;font-size:11px;letter-spacing:0.08em;font-weight:500;max-width:calc(100vw - 200px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .btns{display:flex;gap:7px;align-items:center;-webkit-app-region:no-drag;}
    button{width:12px;height:12px;border-radius:50%;border:none;cursor:pointer;padding:0;transition:transform 0.15s ease,opacity 0.15s ease,box-shadow 0.15s ease;}
    button:hover{transform:scale(1.15);opacity:0.85;}
    button:active{transform:scale(0.95);}
    .min{background:#f59e0b;}
    .min:hover{box-shadow:0 0 8px rgba(245,158,11,0.6);}
    .max{background:#22c55e;}
    .max:hover{box-shadow:0 0 8px rgba(34,197,94,0.6);}
    .cls{background:#ef4444;}
    .cls:hover{box-shadow:0 0 8px rgba(239,68,68,0.6);}
  </style>
</head>
<body>
  <div style="display:flex;align-items:center;gap:7px;">
    <img src="logo.png" width="16" height="16" style="border-radius:3px;" draggable="false"/>
    <span id="titleText" title="ZSTREAM">ZSTREAM</span>
    <svg id="gamepadIcon" style="display:none; color: #4ade80; width: 14px; height: 14px; margin-left: 4px; opacity: 0.9;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" title="Controller Connected">
      <line x1="6" y1="12" x2="10" y2="12"></line>
      <line x1="8" y1="10" x2="8" y2="14"></line>
      <line x1="15" y1="13" x2="15.01" y2="13"></line>
      <line x1="18" y1="11" x2="18.01" y2="11"></line>
      <path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"></path>
    </svg>
  </div>
  <script>
    window.electronAPI.onTitleUpdate?.((title) => {
      const el = document.getElementById('titleText');
      if (el) {
        el.textContent = title || 'ZSTREAM';
        el.title = title || 'ZSTREAM';
      }
    });

    // Gamepad detection for UI
    function updateGamepadStatus() {
      const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
      const hasGamepad = Array.from(gamepads).some(gp => gp !== null);
      const icon = document.getElementById('gamepadIcon');
      if (icon) {
        icon.style.display = hasGamepad ? 'block' : 'none';
      }
    }

    window.addEventListener("gamepadconnected", updateGamepadStatus);
    window.addEventListener("gamepaddisconnected", updateGamepadStatus);

    setInterval(updateGamepadStatus, 1000);
  </script>
  <div class="btns">
    <button class="min" onclick="window.electronAPI.minimizeWindow()"></button>
    <button class="max" onclick="window.electronAPI.maximizeWindow()"></button>
    <button class="cls" onclick="window.electronAPI.closeWindow()"></button>
  </div>
</body>
</html>
