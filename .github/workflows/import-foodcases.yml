```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Download Unity files
    run: |
      mkdir -p melon-sandbox

      curl -L \
        "https://github.com/Camerons-Git7/FoodCases/releases/download/files/data.unityweb" \
        -o "melon-sandbox/data.unityweb"

      curl -L \
        "https://github.com/Camerons-Git7/FoodCases/releases/download/files/framework.unityweb" \
        -o "melon-sandbox/framework.unityweb"

      curl -L \
        "https://github.com/Camerons-Git7/FoodCases/releases/download/files/wasm.unityweb" \
        -o "melon-sandbox/wasm.unityweb"

  - name: Commit and push
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add melon-sandbox/data.unityweb
      git add melon-sandbox/framework.unityweb
      git add melon-sandbox/wasm.unityweb

      if git diff --cached --quiet; then
        echo "No changes to commit."
      else
        git commit -m "Update FoodCases Unity files"
        git push
      fi
