name: Deploy Release Assets to FoodCases

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-assets
          gh release download "Build_Files" \
            --repo "Camerons-Git7/FoodCases" \
            --dir release-assets \
            --clobber \
            --pattern "BuildNow.data.br" \
            --pattern "BuildNow.wasm.br"

      - name: Checkout FoodCases
        uses: actions/checkout@v4
        with:
          repository: Camerons-Git7/FoodCases
          token: ${{ secrets.FOODCASES_TOKEN }}
          path: target
          ref: main

      - name: Copy assets into Buildnow.GG/build
        run: |
          mkdir -p target/Buildnow.GG/build
          rm -rf target/Buildnow.GG/build/*
          cp -r release-assets/* target/Buildnow.GG/build/

      - name: Commit and push
        working-directory: target
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Buildnow.GG/build
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update build from Build_Files"
            git push
          fi
