```yaml
name: 🚀 Deploy to InfinityFree

on:
  push:
    branches: [ main, master ]

  workflow_dispatch:
    inputs:
      force_full_sync:
        description: 'Force complete re-upload (delete sync state first)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  web-deploy:
    name: Deploy to InfinityFree
    runs-on: ubuntu-latest

    steps:
      # ──────────────────────────────────────────────
      # GET SOURCE
      # ──────────────────────────────────────────────
      - name: Get latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ──────────────────────────────────────────────
      # CLEAR FTP SYNC STATE IF REQUESTED
      # ──────────────────────────────────────────────
      - name: Clear sync state (Force Full Sync)
        if: inputs.force_full_sync == 'true'
        run: |
          echo "Force full sync requested."
          rm -f \
            .ftp-sync-state-1.json \
            .ftp-sync-state-2.json \
            .ftp-sync-state-3.json
          echo "FTP sync state cleared."

      # ══════════════════════════════════════════════
      # SITE 1
      # ══════════════════════════════════════════════

      - name: Prepare Site 1
        run: |
          if [ -f "desktop/index.html" ]; then
            sed -i 's/\.ico/\.png/g' desktop/index.html
            echo "Site 1: .ico → .png replacement completed."
          else
            echo "Site 1: desktop/index.html not found; skipping."
          fi

      - name: Deploy to InfinityFree Site 1
        id: deploy1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: htdocs/
          local-dir: ./
          state-name: .ftp-sync-state-1.json

          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            README.md
            .gitignore
            .ftp-sync-state-1.json
            .ftp-sync-state-2.json
            .ftp-sync-state-3.json

          log-level: standard

      # ──────────────────────────────────────────────
      # RESET BEFORE SITE 2
      # ──────────────────────────────────────────────

      - name: Reset repository before Site 2
        run: |
          git reset --hard HEAD

      # ══════════════════════════════════════════════
      # SITE 2
      # ══════════════════════════════════════════════

      - name: Prepare Site 2 domain
        run: |
          find . -type f \
            \( -name '*.html' -o \
               -name '*.js' -o \
               -name '*.css' -o \
               -name '*.php' -o \
               -name '*.json' \) \
            ! -path './.git/*' \
            ! -path './.github/*' \
            -exec sed -i 's/free\.nf/site.je/g' {} +

          echo "Site 2: free.nf → site.je replacement completed."

      - name: Prepare Site 2 icons
        run: |
          if [ -f "desktop/index.html" ]; then
            sed -i 's/\.ico/\.png/g' desktop/index.html
            echo "Site 2: .ico → .png replacement completed."
          else
            echo "Site 2: desktop/index.html not found; skipping."
          fi

      - name: Deploy to InfinityFree Site 2
        id: deploy2
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME_2 }}
          password: ${{ secrets.FTP_PASSWORD_2 }}
          protocol: ftp
          port: 21
          server-dir: htdocs/
          local-dir: ./
          state-name: .ftp-sync-state-2.json

          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            README.md
            .gitignore
            .ftp-sync-state-1.json
            .ftp-sync-state-2.json
            .ftp-sync-state-3.json

          log-level: standard

      # ──────────────────────────────────────────────
      # RESET BEFORE SITE 3
      # ──────────────────────────────────────────────

      - name: Reset repository before Site 3
        run: |
          git reset --hard HEAD

      # ══════════════════════════════════════════════
      # SITE 3
      # ══════════════════════════════════════════════

      - name: Prepare Site 3 domain
        run: |
          find . -type f \
            \( -name '*.html' -o \
               -name '*.js' -o \
               -name '*.css' -o \
               -name '*.php' -o \
               -name '*.json' \) \
            ! -path './.git/*' \
            ! -path './.github/*' \
            -exec sed -i 's/menist/seamless/g' {} +

          echo "Site 3: menist → seamless replacement completed."

      - name: Deploy to InfinityFree Site 3
        id: deploy3
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME_3 }}
          password: ${{ secrets.FTP_PASSWORD_3 }}
          protocol: ftp
          port: 21
          server-dir: htdocs/
          local-dir: ./
          state-name: .ftp-sync-state-3.json

          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            README.md
            .gitignore
            .ftp-sync-state-1.json
            .ftp-sync-state-2.json
            .ftp-sync-state-3.json

          log-level: standard

      # ══════════════════════════════════════════════
      # FINAL STATUS
      # ══════════════════════════════════════════════

      - name: Check deploy results
        run: |
          echo "======================================"
          echo "Deployment Results"
          echo "======================================"

          echo "Site 1: ${{ steps.deploy1.outcome }}"
          echo "Site 2: ${{ steps.deploy2.outcome }}"
          echo "Site 3: ${{ steps.deploy3.outcome }}"

          echo "======================================"

          if [[ "${{ steps.deploy1.outcome }}" == "failure" && \
                "${{ steps.deploy2.outcome }}" == "failure" && \
                "${{ steps.deploy3.outcome }}" == "failure" ]]; then

            echo "❌ All three sites failed."
            exit 1

          elif [[ "${{ steps.deploy1.outcome }}" == "failure" || \
                  "${{ steps.deploy2.outcome }}" == "failure" || \
                  "${{ steps.deploy3.outcome }}" == "failure" ]]; then

            echo "⚠️ One or more sites failed."
            echo "The successful sites were still deployed."

          else

            echo "✅ All three sites deployed successfully."

          fi
```
