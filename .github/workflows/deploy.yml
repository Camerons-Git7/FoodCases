name: 🚀 Deploy to InfinityFree

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      force_full_sync:
        description: 'Force complete re-upload (delete sync state first)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  web-deploy:
    name: Deploy to InfinityFree
    runs-on: ubuntu-latest
    
    steps:
      - name: Get latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
       
      - name: Clear sync state (Force Full Sync)
        if: github.event.inputs.force_full_sync == 'true'
        run: |
          echo "Force full sync requested - will delete local sync state if it exists"
          rm -f .ftp-sync-state-1.json .ftp-sync-state-2.json
          echo "Sync state cleared. All files will be re-uploaded."

      # ─── FIRST WEBSITE ─────────────────────────────
      - name: Replace .ico with .png in desktop/index.html for Site 1 deploy
        run: |
          if [ -f "desktop/index.html" ]; then
            sed -i 's/\.ico/\.png/g' desktop/index.html || true
            echo "Replacement completed for Site 1 (or skipped if no changes)"
          else
            echo "desktop/index.html not found, skipping replacement"
          fi

      - name: Deploy to InfinityFree Site 1
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: htdocs/
          local-dir: ./
          state-name: .ftp-sync-state-1.json
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            README.md
            .gitignore
            .ftp-sync-state-1.json
            .ftp-sync-state-2.json
          log-level: standard

      # ─── SECOND WEBSITE ────────────────────────────
      - name: Restore original code for Site 2
        run: git checkout .

      - name: Replace "free.nf" with "free.je" for Site 2 deploy
        run: |
          find . -type f \
            ! -path './.git/*' \
            ! -path './.github/*' \
            ! -name '.ftp-sync-state-1.json' \
            ! -name '.ftp-sync-state-2.json' \
            -exec sed -i 's/free\.nf/free.je/g' {} +

      - name: Replace .ico with .png in desktop/index.html for Site 2 deploy
        run: |
          if [ -f "desktop/index.html" ]; then
            sed -i 's/\.ico/\.png/g' desktop/index.html || true
            echo "Replacement completed for Site 2 (or skipped if no changes)"
          else
            echo "desktop/index.html not found, skipping replacement"
          fi

      - name: Deploy to InfinityFree Site 2
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME_2 }}
          password: ${{ secrets.FTP_PASSWORD_2 }}
          protocol: ftp
          port: 21
          server-dir: htdocs/
          local-dir: ./
          state-name: .ftp-sync-state-2.json
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            README.md
            .gitignore
            .ftp-sync-state-1.json
            .ftp-sync-state-2.json
          log-level: standard
