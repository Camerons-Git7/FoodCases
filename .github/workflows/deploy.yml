name: 🚀 Deploy to InfinityFree
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      force_full_sync:
        description: 'Force complete re-upload (delete sync state first)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
jobs:
  web-deploy:
    name: Deploy to InfinityFree
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clear sync state (Force Full Sync)
        if: github.event.inputs.force_full_sync == 'true'
        run: |
          echo "Force full sync requested - will delete local sync state if it exists"
          rm -f .ftp-sync-state-1.json .ftp-sync-state-2.json .ftp-sync-state-3.json
          echo "Sync state cleared. All files will be re-uploaded."
      # ─── FIRST WEBSITE ─────────────────────────────
      - name: Replace .ico with .png in desktop/index.html for Site 1 deploy
        run: |
          if [ -f "desktop/index.html" ]; then
            sed -i 's/\.ico/\.png/g' desktop/index.html || true
            echo "Replacement completed for Site 1 (or skipped if no changes)"
          else
            echo "desktop/index.html not found, skipping replacement"
          fi
      - name: Deploy to InfinityFree Site 1
        id: deploy1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: htdocs/
          local-dir: ./
          state-name: .ftp-sync-state-1.json
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            README.md
            .gitignore
            .ftp-sync-state-1.json
            .ftp-sync-state-2.json
            .ftp-sync-state-3.json
          log-level: standard
      # ─── SECOND WEBSITE ────────────────────────────
      - name: Restore original code for Site 2
        run: git checkout .
      - name: Replace "menist.free.nf" with "seamfull-os.free.je" for Site 2 deploy
        run: |
          find . -type f \
            ! -path './.git/*' \
            ! -path './.github/*' \
            ! -name '.ftp-sync-state-1.json' \
            ! -name '.ftp-sync-state-2.json' \
            ! -name '.ftp-sync-state-3.json' \
            -exec sed -i \
              -e 's/menist\.free\.nf/seamfull-os.free.je/g' \
              {} +
      - name: Replace .ico with .png in desktop/index.html for Site 2 deploy
        run: |
          if [ -f "desktop/index.html" ]; then
            sed -i 's/\.ico/\.png/g' desktop/index.html || true
            echo "Replacement completed for Site 2 (or skipped if no changes)"
          else
            echo "desktop/index.html not found, skipping replacement"
          fi
      - name: Deploy to InfinityFree Site 2
        id: deploy2
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME_2 }}
          password: ${{ secrets.FTP_PASSWORD_2 }}
          protocol: ftp
          port: 21
          server-dir: htdocs/
          local-dir: ./
          state-name: .ftp-sync-state-2.json
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            README.md
            .gitignore
            .ftp-sync-state-1.json
            .ftp-sync-state-2.json
            .ftp-sync-state-3.json
          log-level: standard
      # ─── THIRD WEBSITE ─────────────────────────────
      - name: Restore original code for Site 3
        run: git checkout .
      - name: Replace "menist.free.nf" with "seamfull.free.je" for Site 3 deploy
        run: |
          find . -type f \
            ! -path './.git/*' \
            ! -path './.github/*' \
            ! -name '.ftp-sync-state-1.json' \
            ! -name '.ftp-sync-state-2.json' \
            ! -name '.ftp-sync-state-3.json' \
            -exec sed -i 's/menist\.free\.nf/seamfull.free.je/g' {} +
      - name: Deploy to InfinityFree Site 3
        id: deploy3
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME_3 }}
          password: ${{ secrets.FTP_PASSWORD_3 }}
          protocol: ftp
          port: 21
          server-dir: htdocs/
          local-dir: ./
          state-name: .ftp-sync-state-3.json
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            README.md
            .gitignore
            .ftp-sync-state-1.json
            .ftp-sync-state-2.json
            .ftp-sync-state-3.json
          log-level: standard
      # ─── FINAL CHECK ───────────────────────────────
      - name: Check deploy results
        run: |
          echo "Site 1 outcome: ${{ steps.deploy1.outcome }}"
          echo "Site 2 outcome: ${{ steps.deploy2.outcome }}"
          echo "Site 3 outcome: ${{ steps.deploy3.outcome }}"
          if [[ "${{ steps.deploy1.outcome }}" == "failure" && \
                "${{ steps.deploy2.outcome }}" == "failure" && \
                "${{ steps.deploy3.outcome }}" == "failure" ]]; then
            echo "❌ All three sites failed!"
            exit 1
          fi
          if [[ "${{ steps.deploy1.outcome }}" == "failure" ]]; then
            echo "⚠️ Site 1 failed"
          else
            echo "✅ Site 1 deployed successfully"
          fi
          if [[ "${{ steps.deploy2.outcome }}" == "failure" ]]; then
            echo "⚠️ Site 2 failed"
          else
            echo "✅ Site 2 deployed successfully"
          fi
          if [[ "${{ steps.deploy3.outcome }}" == "failure" ]]; then
            echo "⚠️ Site 3 failed"
          else
            echo "✅ Site 3 deployed successfully"
          fi
