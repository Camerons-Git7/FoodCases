name: Apply fixed Ruffle loaders

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-loaders:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download fixed loaders zip
        run: |
          curl -fsSL -o /tmp/fixed_ruffle_game_loaders.zip \
            "https://github.com/Camerons-Git7/FoodCases/releases/download/files/fixed_ruffle_game_loaders.zip"

      - name: Extract and replace matching folders under core/
        run: |
          set -euo pipefail

          rm -rf /tmp/fixed_extract
          mkdir -p /tmp/fixed_extract
          unzip -q /tmp/fixed_ruffle_game_loaders.zip -d /tmp/fixed_extract

          # Handle nested zip layout:
          # fixed_ruffle_game_loaders/fixed_ruffle_loaders/<game>/index.html
          SRC_ROOT=$(find /tmp/fixed_extract -type d -name 'fixed_ruffle_loaders' | head -1)
          if [ -z "${SRC_ROOT:-}" ]; then
            echo "ERROR: could not find fixed_ruffle_loaders folder inside zip"
            find /tmp/fixed_extract -maxdepth 4 -type d
            exit 1
          fi
          echo "Source root: $SRC_ROOT"

          replaced=0
          skipped=0

          for game_dir in "$SRC_ROOT"/*/; do
            [ -d "$game_dir" ] || continue
            name=$(basename "$game_dir")
            dest="core/$name"

            if [ ! -d "$dest" ]; then
              echo "SKIP (no core/$name): $name"
              skipped=$((skipped + 1))
              continue
            fi

            echo "REPLACE: $name -> $dest"
            cp -a "$game_dir"/. "$dest"/
            replaced=$((replaced + 1))
          done

          echo "Replaced: $replaced | Skipped: $skipped"
          if [ "$replaced" -eq 0 ]; then
            echo "ERROR: nothing was replaced"
            exit 1
          fi

      - name: Remove stray zip from repo if present
        run: |
          rm -f fixed_ruffle_game_loaders.zip
          rm -f /tmp/fixed_ruffle_game_loaders.zip

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Apply fixed Ruffle game loaders (remove sandbox, accurate progress)"
            git push
          fi
