name: Sync EmeraldOS folder

on:
  # Run manually from the Actions tab
  workflow_dispatch:

  # Optional: run automatically every day at 03:00 UTC
  # schedule:
  #   - cron: '0 3 * * *'

  # Optional: also run when you push to main
  # push:
  #   branches: [ main ]

permissions:
  contents: write   # needed so the workflow can commit & push

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4
        with:
          # Keep the full history so we can push cleanly
          fetch-depth: 0

      - name: Checkout source repository (Securly-plans)
        uses: actions/checkout@v4
        with:
          repository: Securly-plans/Securly-plans.github.io
          path: source-repo
          # Only need the EmeraldOS folder, but full checkout is fine for a public repo

      - name: Copy EmeraldOS folder into your repo
        run: |
          # Remove the old EmeraldOS folder if it exists
          rm -rf EmeraldOS

          # Copy the entire folder from the other repo
          cp -r source-repo/EmeraldOS EmeraldOS

          # Show what was copied (optional, for logs)
          echo "=== Contents of EmeraldOS after copy ==="
          ls -la EmeraldOS

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add EmeraldOS

          # Only commit if there are actual changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sync EmeraldOS folder from Securly-plans/Securly-plans.github.io"
            git push
          fi
