name: Replace CoolDude2349 with Camerons-Git7

on:
  workflow_dispatch:   # Manual trigger only (recommended)

jobs:
  replace:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Needed to push the commit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace all instances of CoolDude2349
        run: |
          # Find all text files (excluding .git) and replace the string
          find . -type f \
            -not -path './.git/*' \
            -not -path './.github/workflows/*' \
            -exec grep -l 'CoolDude2349' {} \; | while read -r file; do
              sed -i 's/CoolDude2349/Camerons-Git7/g' "$file"
            done

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          if git diff --quiet; then
            echo "No changes to commit"
          else
            git add -A
            git commit -m "chore: replace CoolDude2349 with Camerons-Git7"
            git push
          fi
