name: Replace domain in EmeraldOS

on:
  # Run manually from the Actions tab
  workflow_dispatch:

  # Optional: also run when files inside EmeraldOS change
  # push:
  #   paths:
  #     - 'EmeraldOS/**'

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace "securly-plans.github.io" with "menist.free.nf" in EmeraldOS
        run: |
          echo "Searching and replacing inside EmeraldOS folder..."

          # Find all files under EmeraldOS and perform the replacement
          find EmeraldOS -type f \( \
            -name "*.html" -o \
            -name "*.js" -o \
            -name "*.css" -o \
            -name "*.json" -o \
            -name "*.md" -o \
            -name "*.txt" -o \
            -name "*.xml" -o \
            -name "*.svg" \
          \) -print0 | while IFS= read -r -d '' file; do
            if grep -q "securly-plans.github.io" "$file"; then
              echo "Updating: $file"
              sed -i 's/securly-plans\.github\.io/menist.free.nf/g' "$file"
            fi
          done

          echo "Replacement finished."

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add EmeraldOS

          if git diff --staged --quiet; then
            echo "No changes detected – nothing to commit."
          else
            git commit -m "Replace securly-plans.github.io with menist.free.nf in EmeraldOS"
            git push
            echo "Changes committed and pushed."
          fi
