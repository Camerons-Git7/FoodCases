# install-noomiclone.yml
# Downloads Unity WebGL assets into /peak/noomiclone/

name: Install NoomiClone files

dest: /peak/noomiclone

files:
  - name: webgl.4.data.unityweb
    url: https://github.com/Camerons-Git7/FoodCases/releases/download/files/webgl.4.data.unityweb
  - name: webgl.4.wasm.code.unityweb
    url: https://github.com/Camerons-Git7/FoodCases/releases/download/files/webgl.4.wasm.code.unityweb
  - name: webgl.4.wasm.framework.unityweb
    url: https://github.com/Camerons-Git7/FoodCases/releases/download/files/webgl.4.wasm.framework.unityweb

