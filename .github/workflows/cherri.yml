# mkdir -p /peak/noomiclone
# cd /peak/noomiclone
# curl -L -o webgl.4.data.unityweb "https://github.com/Camerons-Git7/FoodCases/releases/download/files/webgl.4.data.unityweb"
# curl -L -o webgl.4.wasm.code.unityweb "https://github.com/Camerons-Git7/FoodCases/releases/download/files/webgl.4.wasm.code.unityweb"
# curl -L -o webgl.4.wasm.framework.unityweb "https://github.com/Camerons-Git7/FoodCases/releases/download/files/webgl.4.wasm.framework.unityweb"
