name: Fetch cherri

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and extract
        run: |
          curl -L -o cherri.zip "https://github.com/Camerons-Git7/FoodCases/releases/download/files/cherri.zip"
          mkdir -p extracted
          unzip -q cherri.zip -d extracted
          rm -rf cherri
          mkdir -p cherri
          # Copy everything from the zip into the cherri folder
          cp -a extracted/. cherri/ || cp -a extracted/* cherri/
          find cherri -maxdepth 2

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cherri
          git diff --staged --quiet || git commit -m "Add cherri folder from release"
          git push
