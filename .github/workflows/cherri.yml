name: Import FoodCases Files

on:
workflow_dispatch:

permissions:
contents: write

jobs:
import-files:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Download release
    run: |
      mkdir -p /tmp/foodcases
      curl -L \
        "https://github.com/Camerons-Git7/FoodCases/releases/download/files/files.zip" \
        -o /tmp/foodcases/files.zip

  - name: Extract into melon-sandbox
    run: |
      mkdir -p melon-sandbox
      unzip -o /tmp/foodcases/files.zip -d melon-sandbox

  - name: Commit changes
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add melon-sandbox

      if git diff --cached --quiet; then
        echo "No changes to commit."
      else
        git commit -m "Import FoodCases files"
        git push
      fi
```
