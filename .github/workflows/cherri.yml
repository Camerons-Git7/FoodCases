name: Import FoodCases Files

on:
workflow_dispatch:

permissions:
contents: write

jobs:
import-files:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v7

  - name: Download FoodCases release
    run: |
      mkdir -p /tmp/foodcases-release

      curl -L \
        -H "Accept: application/vnd.github+json" \
        "https://api.github.com/repos/Camerons-Git7/FoodCases/releases/tags/files" \
        -o /tmp/release.json

      python - <<'PY'
      import json
      import os
      import urllib.request

      with open("/tmp/release.json", "r") as f:
          release = json.load(f)

      assets = release.get("assets", [])

      if not assets:
          raise SystemExit("No assets found in the 'files' release.")

      os.makedirs("/tmp/foodcases-release", exist_ok=True)

      for asset in assets:
          name = asset["name"]
          url = asset["browser_download_url"]

          print(f"Downloading: {name}")

          urllib.request.urlretrieve(
              url,
              os.path.join("/tmp/foodcases-release", name)
          )
      PY

  - name: Copy files into melon-sandbox
    run: |
      mkdir -p melon-sandbox
      cp -a /tmp/foodcases-release/. melon-sandbox/

  - name: Commit changes
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add melon-sandbox

      if git diff --cached --quiet; then
        echo "No changes to commit."
      else
        git commit -m "Import FoodCases release files"
        git push
      fi
```
