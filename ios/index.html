};

(function(){
  'use strict';

  if (!window.navigator.standalone) {
    document.documentElement.style.setProperty('--fakebar', '30px');
    document.body.classList.add('show-fake-bar');
  }

  var keys = Object.keys(APPS);
  var dockKeys = keys.filter(function(k){ return APPS[k].pinned; });
  var gridKeys = keys.filter(function(k){ return !APPS[k].pinned; });
  var PAGE_SIZE = 24;

  function iconVisual(key){
    var data = APPS[key];
    var icon = document.createElement('div');
    icon.className = 'app-icon';
    icon.textContent = data.title.charAt(0).toUpperCase();
    var img = document.createElement('img');
    img.loading = 'lazy';
    img.alt = '';
    img.draggable = false;
    img.onerror = function(){ img.remove(); };
    img.src = data.icon;
    icon.appendChild(img);
    return icon;
  }

  function appIcon(key, withLabel){
    var data = APPS[key];
    var wrap = document.createElement('div');
    wrap.className = 'app-icon-wrap';
    wrap.setAttribute('role', 'button');
    wrap.setAttribute('tabindex', '0');
    wrap.setAttribute('aria-label', data.title);
    wrap.appendChild(iconVisual(key));
    if (withLabel) {
      var label = document.createElement('div');
      label.className = 'app-label';
      label.textContent = data.title;
      wrap.appendChild(label);
    }
    wrap.addEventListener('click', function(){ openApp(key); });
    wrap.addEventListener('keydown', function(e){
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openApp(key); }
    });
    return wrap;
  }

  function renderPages(){
    var pages = document.getElementById('pages');
    var dots = document.getElementById('dots');
    pages.innerHTML = '';
    dots.innerHTML = '';
    var totalPages = Math.max(1, Math.ceil(gridKeys.length / PAGE_SIZE));
    for (var p = 0; p < totalPages; p++) {
      var pageEl = document.createElement('div');
      pageEl.className = 'page';
      gridKeys.slice(p * PAGE_SIZE, (p + 1) * PAGE_SIZE).forEach(function(k){
        pageEl.appendChild(appIcon(k, true));
      });
      pages.appendChild(pageEl);
      var dot = document.createElement('div');
      dot.className = 'dot' + (p === 0 ? ' active' : '');
      dots.appendChild(dot);
    }
    var dotEls = dots.children;
    pages.addEventListener('scroll', function(){
      var idx = Math.round(pages.scrollLeft / pages.clientWidth);
      for (var i = 0; i < dotEls.length; i++) {
        dotEls[i].classList.toggle('active', i === idx);
      }
    });
  }

  function renderDock(){
    var dock = document.getElementById('dock');
    dock.innerHTML = '';
    dockKeys.forEach(function(k){ dock.appendChild(appIcon(k, false)); });
  }

  function openApp(key){
    var data = APPS[key];
    document.getElementById('app-frame').src = data.path;
    document.getElementById('app-overlay').classList.add('open');
    closeSearch();
  }

  function closeApp(){
    var overlay = document.getElementById('app-overlay');
    if (!overlay.classList.contains('open')) return;
    overlay.classList.remove('open');
    setTimeout(function(){ document.getElementById('app-frame').src = 'about:blank'; }, 400);
  }

  // swipe-up or tap on the home indicator to exit, like iOS
  var homeZone = document.getElementById('home-zone');
  var startY = null;
  homeZone.addEventListener('touchstart', function(e){ startY = e.touches[0].clientY; }, {passive:true});
  homeZone.addEventListener('touchmove', function(e){
    if (startY === null) return;
    if (startY - e.touches[0].clientY > 24) { closeApp(); startY = null; }
  }, {passive:true});
  homeZone.addEventListener('click', closeApp);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeApp(); });

  // search
  var searchPanel = document.getElementById('search-panel');
  var searchInput = document.getElementById('search-input');
  var searchResults = document.getElementById('search-results');

  function renderResults(q){
    searchResults.innerHTML = '';
    var query = q.trim().toLowerCase();
    var matches = keys.filter(function(k){
      return query === '' || APPS[k].title.toLowerCase().indexOf(query) !== -1;
    });
    if (matches.length === 0) {
      var empty = document.createElement('div');
      empty.id = 'search-empty';
      empty.textContent = 'No apps found';
      searchResults.appendChild(empty);
      return;
    }
    matches.forEach(function(k){
      var row = document.createElement('div');
      row.className = 'search-row';
      row.setAttribute('role', 'button');
      row.setAttribute('tabindex', '0');
      row.appendChild(iconVisual(k));
      var name = document.createElement('div');
      name.className = 'name';
      name.textContent = APPS[k].title;
      row.appendChild(name);
      row.addEventListener('click', function(){ closeSearch(); openApp(k); });
      row.addEventListener('keydown', function(e){
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); closeSearch(); openApp(k); }
      });
      searchResults.appendChild(row);
    });
  }

  function openSearch(){
    searchPanel.classList.add('open');
    renderResults('');
    setTimeout(function(){ searchInput.focus(); }, 60);
  }
  function closeSearch(){
    searchPanel.classList.remove('open');
    searchInput.value = '';
  }

  document.getElementById('search-toggle').addEventListener('click', openSearch);
  document.getElementById('search-toggle').addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openSearch(); }
  });
  document.getElementById('search-cancel').addEventListener('click', closeSearch);
  searchInput.addEventListener('input', function(){ renderResults(searchInput.value); });

  function updateClock(){
    var now = new Date();
    var h = now.getHours() % 12; if (h === 0) h = 12;
    var m = ('0' + now.getMinutes()).slice(-2);
    document.getElementById('fake-clock').textContent = h + ':' + m;
  }
  updateClock();
  setInterval(updateClock, 15000);

  renderPages();
  renderDock();
})();
</script>
