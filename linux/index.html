<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Remote Desktop</title>
<style>
html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;
}
iframe{
position:absolute;
inset:0;
width:100%;
height:100%;
border:0;
}
</style>
</head>
<body>
<iframe
src="https://camerons-laptop.taila7ae01.ts.net/vnc.html?autoconnect=true&resize=remote&view_only=false"
allow="fullscreen"
></iframe>

<script>
window.addEventListener("load",()=>{
const frame=document.querySelector("iframe");
document.documentElement.requestFullscreen?.().catch(()=>{});
frame.addEventListener("load",()=>{
frame.contentWindow?.focus();
});
});
</script>
</body>
</html>
