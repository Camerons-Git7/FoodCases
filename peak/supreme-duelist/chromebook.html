<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Supreme Duelist</title>
  <style>
    html, body { margin:0; height:100%; background:#231F20; overflow:hidden; }
    #unity-container { width:100%; height:100%; position:relative; }
    #unity-canvas { width:100%; height:100%; display:block; }
    #unity-loading-bar {
      position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
      display:none;
    }
    #unity-progress-bar-empty { width:141px; height:18px; margin-top:10px; background:#555; }
    #unity-progress-bar-full { width:0%; height:100%; background:#fff; }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo"></div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
  </div>

  <script>
    // YouTube environment spoofs
    try {
      Object.defineProperty(window, 'parent', { get: () => window, configurable: true });
      Object.defineProperty(window, 'top', { get: () => window, configurable: true });
    } catch(e) {}
    try {
      Object.defineProperty(document, 'referrer', {
        get: () => 'https://www.youtube.com/', configurable: true
      });
    } catch(e) {}
    try {
      Object.defineProperty(window.location, 'ancestorOrigins', {
        get: () => ({ length:1, 0:'https://www.youtube.com', contains:o=>o==='https://www.youtube.com' }),
        configurable: true
      });
    } catch(e) {}

    try {
      location.hash = '#flags=%7B"enableServiceWorker"%3Afalse%7D&origin=https%3A%2F%2Fwww.youtube.com';
    } catch(e) {}

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then(rs => rs.forEach(r => r.unregister())).catch(() => {});
    }

    // Full ytgame stub required by the Unity build
    window.ytgame = {
      IN_PLAYABLES_ENV: true,
      SDK_VERSION: '1',
      system: {
        isAudioEnabled: () => true,
        onAudioEnabledChange: (cb) => { setTimeout(() => cb(true), 10); return () => {}; },
        onPause: () => () => {},
        onResume: (cb) => { setTimeout(cb, 10); return () => {}; },
        notifyLoadComplete: () => {}
      },
      game: {
        onStart: (cb) => { setTimeout(cb, 30); return () => {}; },
        onVisibilityChange: (cb) => { setTimeout(() => cb(true), 10); return () => {}; },
        firstFrameReady: () => {},
        gameReady: () => {},
        loadData: () => Promise.resolve(''),
        saveData: () => Promise.resolve()
      },
      ads: {
        isAdBreakAvailable: () => false,
        requestAdBreak: (cb) => cb && cb({ breakStatus: 'dismissed' }),
        requestInterstitialAd: () => Promise.resolve()
      },
      engagement: { sendScore: () => Promise.resolve() },
      health: {
        logError: () => {},
        logWarning: () => {}
      }
    };

    // Audio keep-alive
    const _AC = window.AudioContext || window.webkitAudioContext;
    if (_AC) {
      const Orig = _AC;
      window.AudioContext = window.webkitAudioContext = function(...a) {
        const ctx = new Orig(...a);
        window._unityAudioContext = ctx;
        ctx.suspend = () => Promise.resolve();
        return ctx;
      };
      window.AudioContext.prototype = Orig.prototype;
      setInterval(() => {
        const c = window._unityAudioContext;
        if (c && c.state !== 'running') c.resume().catch(() => {});
      }, 700);
    }
  </script>

  <script>
    const MIRRORS = [
      'https://gcore.jsdelivr.net/gh/greeniYT/stickywicky@main/Build',
      'https://fastly.jsdelivr.net/gh/greeniYT/stickywicky@main/Build',
      'https://cdn.jsdelivr.net/gh/greeniYT/stickywicky@main/Build',
      'https://raw.githubusercontent.com/greeniYT/stickywicky/main/Build'
    ];

    const canvas = document.getElementById('unity-canvas');
    const loadingBar = document.getElementById('unity-loading-bar');
    const bar = document.getElementById('unity-progress-bar-full');
    const container = document.getElementById('unity-container');

    if (/CrOS|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
      container.className = canvas.className = 'unity-mobile';
    } else {
      canvas.style.width = canvas.style.height = '100%';
    }

    async function tryFetch(url, ms = 45000) {
      const c = new AbortController();
      const t = setTimeout(() => c.abort(), ms);
      try {
        const r = await fetch(url, { signal: c.signal, mode: 'cors' });
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r;
      } finally { clearTimeout(t); }
    }

    async function pickMirror() {
      for (const base of MIRRORS) {
        try {
          await tryFetch(base + '/YTPlayables.loader.js', 12000);
          return base;
        } catch(e) {}
      }
      throw new Error('All mirrors blocked');
    }

    // Detect gzip (magic 1f 8b) and decompress when needed
    async function loadAndMaybeGunzip(url, mime) {
      const resp = await tryFetch(url, 90000);
      const buf = await resp.arrayBuffer();
      const u8 = new Uint8Array(buf);

      if (u8[0] === 0x1f && u8[1] === 0x8b) {
        const ds = new DecompressionStream('gzip');
        const stream = new Response(buf).body.pipeThrough(ds);
        const decompressed = await new Response(stream).arrayBuffer();
        return URL.createObjectURL(new Blob([decompressed], { type: mime }));
      }
      return URL.createObjectURL(new Blob([buf], { type: mime }));
    }

    function loadScript(url) {
      return new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = url;
        s.onload = res;
        s.onerror = () => rej(new Error('script load failed'));
        document.body.appendChild(s);
      });
    }

    // Emscripten FS safety net
    function patchFS() {
      if (typeof FS === 'undefined' || !FS.lookupNode) {
        setTimeout(patchFS, 40);
        return;
      }
      const orig = FS.lookupNode;
      FS.lookupNode = function(parent, name) {
        if (parent && parent.contents === undefined) parent.contents = {};
        return orig(parent, name);
      };
      const origRm = FS.rmdir;
      FS.rmdir = function(path) {
        try { return origRm(path); } catch(e) { return 0; }
      };
    }

    async function cleanupIDB() {
      try {
        if (!indexedDB.databases) return;
        const dbs = await Promise.race([
          indexedDB.databases(),
          new Promise(r => setTimeout(() => r([]), 500))
        ]);
        for (const db of (dbs || [])) {
          try { indexedDB.deleteDatabase(db.name); } catch(e) {}
        }
      } catch(e) {}
    }

    async function run() {
      try {
        await cleanupIDB();
        const base = await pickMirror();

        const [dataUrl, codeUrl, frameworkUrl] = await Promise.all([
          loadAndMaybeGunzip(base + '/YTPlayables.data', 'application/octet-stream'),
          loadAndMaybeGunzip(base + '/YTPlayables.wasm', 'application/wasm'),
          loadAndMaybeGunzip(base + '/YTPlayables.framework.js.gzip', 'text/javascript')
            .catch(() => loadAndMaybeGunzip(base + '/YTPlayables.framework.js.gz', 'text/javascript'))
        ]);

        const config = {
          dataUrl,
          codeUrl,
          frameworkUrl,
          streamingAssetsUrl: 'https://raw.githubusercontent.com/greeniYT/stickywicky/9f5aa0e5dc4708a05d72ef330699421a58f841eb/StreamingAssets/',
          companyName: "Neron's Brother",
          productName: 'Supreme Duelist',
          productVersion: '1.0.16.0002',
          showBanner: () => {},
          autoSyncPersistentDataPath: false
        };

        try {
          await loadScript(base + '/YTPlayables.loader.js');
        } catch(e) {
          const r = await tryFetch(base + '/YTPlayables.loader.js');
          const text = await r.text();
          const blobUrl = URL.createObjectURL(new Blob([text], { type: 'application/javascript' }));
          await loadScript(blobUrl);
          URL.revokeObjectURL(blobUrl);
        }

        patchFS();
        loadingBar.style.display = 'block';

        const instance = await createUnityInstance(canvas, config, p => {
          bar.style.width = (p * 100) + '%';
        });

        window.unityGameInstance = instance;
        window.unityInstance = instance;

        loadingBar.style.display = 'none';

        try { ytgame.system.notifyLoadComplete(); } catch(e) {}
        if (window._unityAudioContext) window._unityAudioContext.resume().catch(() => {});
      } catch (err) {
        // Silent fail – nothing to show
      }
    }

    run();
  </script>
</body>
</html>
