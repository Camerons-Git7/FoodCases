<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Peggle</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<meta http-equiv="x-ua-compatible" content="ie=edge">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,sans-serif}
#game{position:fixed;inset:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#000}
ruffle-player{display:block;width:min(100vw,133.333333vh);height:min(100vh,75vw);flex:0 0 auto}
#loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;color:#fff;z-index:10}
#bar{width:min(80vw,420px);height:12px;background:#222;border-radius:6px;overflow:hidden;margin-top:18px}
#fill{height:100%;width:0%;background:#4caf50;transition:width .15s}
#status{margin-top:12px;font-size:14px;opacity:.8}
</style>
<script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
<div id="loader">
<div>Loading Peggle assets…</div>
<div id="bar"><div id="fill"></div></div>
<div id="status">0 / 0</div>
</div>
<div id="game"></div>
<script>
const BASE = "https://raw.githubusercontent.com/Camerons-Git7/FoodCases/main/peak/peggle/";
const SWF_URL = BASE + "peggle.swf";

const ASSETS = [
SWF_URL,
BASE + "stages.cfg",
BASE + "assets/peghit_low.wav",
BASE + "assets/peghit_plus4b.wav",
BASE + "assets/score_counter.wav",
BASE + "interstitials/interstitials.xml",
BASE + "lang/en.xml",
BASE + "lang/languages.xml",
BASE + "levels/_base.dat.zip",
BASE + "levels/challenges.xml",
BASE + "levels/backspiral.dat.zip", BASE + "levels/backspiral.jpg",
BASE + "levels/beans.dat.zip", BASE + "levels/beans.jpg",
BASE + "levels/bowl.dat.zip", BASE + "levels/bowl.jpg",
BASE + "levels/bricks.dat.zip", BASE + "levels/bricks.jpg",
BASE + "levels/doublebucket.dat.zip", BASE + "levels/doublebucket.jpg",
BASE + "levels/funnel.dat.zip", BASE + "levels/funnel.jpg",
BASE + "levels/level10web.dat.zip", BASE + "levels/level10web.jpg",
BASE + "levels/level12web.dat.zip", BASE + "levels/level12web.jpg",
BASE + "levels/level13web.dat.zip", BASE + "levels/level13web.jpg",
BASE + "levels/level14web.dat.zip", BASE + "levels/level14web.jpg",
BASE + "levels/level15web.dat.zip", BASE + "levels/level15web.jpg",
BASE + "levels/level16web.dat.zip", BASE + "levels/level16web.jpg",
BASE + "levels/level17web.dat.zip", BASE + "levels/level17web.jpg",
BASE + "levels/level18web.dat.zip", BASE + "levels/level18web.jpg",
BASE + "levels/level19aweb.dat.zip", BASE + "levels/level19aweb.jpg",
BASE + "levels/pinwheels.dat.zip", BASE + "levels/pinwheels.jpg",
BASE + "levels/scary.dat.zip", BASE + "levels/scary.jpg",
BASE + "levels/slides.dat.zip", BASE + "levels/slides.jpg",
BASE + "levels/sonofowl.dat.zip", BASE + "levels/sonofowl.jpg",
BASE + "levels/spinners.dat.zip", BASE + "levels/spinners.jpg",
BASE + "levels/tri.dat.zip", BASE + "levels/tri.jpg",
BASE + "levels/wiggles.dat.zip", BASE + "levels/wiggles.jpg"
];

const DB_NAME = "peggle-idb-v3";
const STORE = "files";
const originalFetch = window.fetch.bind(window);

function mimeFor(url) {
  if (url.endsWith(".swf")) return "application/x-shockwave-flash";
  if (url.endsWith(".jpg") || url.endsWith(".jpeg")) return "image/jpeg";
  if (url.endsWith(".png")) return "image/png";
  if (url.endsWith(".wav")) return "audio/wav";
  if (url.endsWith(".xml") || url.endsWith(".cfg")) return "text/xml";
  if (url.endsWith(".zip") || url.endsWith(".dat.zip")) return "application/zip";
  return "application/octet-stream";
}

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function idbGet(key) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, "readonly");
    const req = tx.objectStore(STORE).get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

async function idbPut(key, blob) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE, "readwrite");
    tx.objectStore(STORE).put(blob, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

async function getBlob(url) {
  let blob = await idbGet(url);
  if (blob) return blob;
  const res = await originalFetch(url);
  if (!res.ok) throw new Error(url + " " + res.status);
  blob = await res.blob();
  await idbPut(url, blob);
  return blob;
}

window.fetch = async function(input, init) {
  let url = typeof input === "string" ? input : (input && input.url) || "";
  try {
    const abs = new URL(url, location.href).href;
    const blob = await idbGet(abs);
    if (blob) {
      return new Response(blob, {
        status: 200,
        statusText: "OK",
        headers: {
          "Content-Type": mimeFor(abs),
          "Content-Length": String(blob.size)
        }
      });
    }
  } catch (_) {}
  return originalFetch(input, init);
};

(function() {
  const NativeXHR = window.XMLHttpRequest;
  function ProxyXHR() {
    const real = new NativeXHR();
    let _url = "";
    let _method = "GET";
    let _async = true;
    let _responseType = "";
    const self = this;

    this.open = function(method, url, async = true, ...rest) {
      _method = method;
      _url = url;
      _async = async;
      return real.open(method, url, async, ...rest);
    };

    this.setRequestHeader = function(...a) { return real.setRequestHeader(...a); };
    this.abort = function() { return real.abort(); };
    this.getAllResponseHeaders = function() { return real.getAllResponseHeaders(); };
    this.getResponseHeader = function(n) { return real.getResponseHeader(n); };
    this.overrideMimeType = function(m) { return real.overrideMimeType(m); };

    Object.defineProperty(this, "responseType", {
      get() { return _responseType; },
      set(v) { _responseType = v; real.responseType = v; }
    });
    Object.defineProperty(this, "timeout", {
      get() { return real.timeout; },
      set(v) { real.timeout = v; }
    });
    Object.defineProperty(this, "withCredentials", {
      get() { return real.withCredentials; },
      set(v) { real.withCredentials = v; }
    });
    Object.defineProperty(this, "readyState", { get() { return real.readyState; } });
    Object.defineProperty(this, "status", { get() { return real.status; } });
    Object.defineProperty(this, "statusText", { get() { return real.statusText; } });
    Object.defineProperty(this, "responseURL", { get() { return real.responseURL; } });
    Object.defineProperty(this, "response", { get() { return real.response; } });
    Object.defineProperty(this, "responseText", { get() { return real.responseText; } });
    Object.defineProperty(this, "responseXML", { get() { return real.responseXML; } });

    this.addEventListener = function(...a) { return real.addEventListener(...a); };
    this.removeEventListener = function(...a) { return real.removeEventListener(...a); };
    this.dispatchEvent = function(...a) { return real.dispatchEvent(...a); };

    Object.defineProperty(this, "onreadystatechange", {
      get() { return real.onreadystatechange; },
      set(v) { real.onreadystatechange = v; }
    });
    Object.defineProperty(this, "onload", {
      get() { return real.onload; },
      set(v) { real.onload = v; }
    });
    Object.defineProperty(this, "onerror", {
      get() { return real.onerror; },
      set(v) { real.onerror = v; }
    });
    Object.defineProperty(this, "onloadend", {
      get() { return real.onloadend; },
      set(v) { real.onloadend = v; }
    });
    Object.defineProperty(this, "ontimeout", {
      get() { return real.ontimeout; },
      set(v) { real.ontimeout = v; }
    });
    Object.defineProperty(this, "onprogress", {
      get() { return real.onprogress; },
      set(v) { real.onprogress = v; }
    });

    this.send = function(body) {
      if (_method.toUpperCase() !== "GET" || !_url) {
        return real.send(body);
      }
      const abs = new URL(_url, location.href).href;
      idbGet(abs).then(async blob => {
        if (!blob) {
          return real.send(body);
        }
        let responseValue;
        if (_responseType === "arraybuffer") {
          responseValue = await blob.arrayBuffer();
        } else if (_responseType === "blob") {
          responseValue = blob;
        } else if (_responseType === "text" || _responseType === "") {
          responseValue = await blob.text();
        } else {
          responseValue = await blob.arrayBuffer();
        }

        Object.defineProperty(real, "status", { value: 200, configurable: true });
        Object.defineProperty(real, "statusText", { value: "OK", configurable: true });
        Object.defineProperty(real, "readyState", { value: 4, configurable: true });
        Object.defineProperty(real, "responseURL", { value: abs, configurable: true });
        Object.defineProperty(real, "response", { value: responseValue, configurable: true });
        if (typeof responseValue === "string") {
          Object.defineProperty(real, "responseText", { value: responseValue, configurable: true });
        }

        real.dispatchEvent(new Event("readystatechange"));
        real.dispatchEvent(new ProgressEvent("load"));
        real.dispatchEvent(new ProgressEvent("loadend"));
      }).catch(() => real.send(body));
    };
  }
  window.XMLHttpRequest = ProxyXHR;
})();

async function prefetchAll() {
  const fill = document.getElementById("fill");
  const status = document.getElementById("status");
  let done = 0;
  const total = ASSETS.length;
  status.textContent = `0 / ${total}`;

  const queue = [...ASSETS];
  const workers = 6;
  async function worker() {
    while (queue.length) {
      const url = queue.shift();
      try {
        await getBlob(url);
      } catch (e) {
        console.warn("prefetch failed", url, e);
      }
      done++;
      fill.style.width = ((done / total) * 100) + "%";
      status.textContent = `${done} / ${total}`;
    }
  }
  await Promise.all(Array.from({ length: workers }, worker));
}

window.addEventListener("DOMContentLoaded", async () => {
  try {
    await prefetchAll();
  } catch (e) {
    console.warn(e);
  }
  document.getElementById("loader").style.display = "none";

  const ruffle = window.RufflePlayer.newest();
  const player = ruffle.createPlayer();
  document.getElementById("game").appendChild(player);

  player.ruffle().load({
    url: SWF_URL,
    autoplay: "on",
    letterbox: "fullscreen",
    backgroundColor: "#000000",
    quality: "medium",
    scale: "showAll",
    allowNetworking: "all",
    splashScreen: false
  });
});
</script>
</body>
</html>
