<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Seamless Chat</title>
<style>
:root{
  --bg:#000000;
  --panel:#1c1c1e;
  --header-bg:#1c1c1e;
  --border:#2c2c2e;
  --text:#ffffff;
  --text-dim:#8e8e93;
  --bubble-me:#0b84ff;
  --bubble-other:#3a3a3c;
  --input-bg:#2c2c2e;
}
*{
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}
html{
  height:100%;
  overflow:hidden;
}
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  height:100dvh;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  display:flex;
  flex-direction:column;
}
img.avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  object-fit:cover;
  flex-shrink:0;
}
/* ================= HEADER ================= */
.header{
  background:var(--header-bg);
  border-bottom:1px solid var(--border);
  padding:10px 16px;
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  max-width:100%;
}
.header-title{
  flex:1;
  min-width:0;
}
.header .chat-title{
  font-size:clamp(15px,4vw,17px);
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.header .stats{
  font-size:clamp(10px,2.8vw,12px);
  color:var(--text-dim);
  margin-top:2px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.header .stats b{
  color:var(--text);
}
.header button{
  background:transparent;
  border:none;
  color:var(--bubble-me);
  font-size:14px;
  cursor:pointer;
  padding:4px 6px;
  white-space:nowrap;
  flex-shrink:0;
}
/* ================= LAYOUT ================= */
.header{
  flex-shrink:0;
}
.container{
  display:flex;
  flex-direction:column;
  flex:1;
  min-height:0;
  width:100%;
  max-width:100%;
  overflow:hidden;
}
/* ================= MAIN CHAT ================= */
.main{
  display:flex;
  flex-direction:column;
  flex:1;
  background:var(--bg);
  min-height:0;
  width:100%;
  max-width:100%;
}
.messages{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  padding:20px 16px;
  background:var(--bg);
  display:flex;
  flex-direction:column;
  gap:14px;
  width:100%;
  max-width:100%;
}
.msg-row{
  display:flex;
  align-items:flex-end;
  gap:10px;
  width:100%;
  max-width:100%;
}
.msg-row.me{
  flex-direction:row-reverse;
}
.msg-row .avatar{
  width:42px;
  height:42px;
}
.bubble-col{
  display:flex;
  flex-direction:column;
  max-width:82%;
  min-width:0;
}
.msg-row.me .bubble-col{
  align-items:flex-end;
}
.msg-row.other .bubble-col{
  align-items:flex-start;
}
.sender-name{
  font-size:13px;
  color:var(--text-dim);
  margin:0 12px 3px;
}
.bubble{
  padding:14px 20px;
  border-radius:24px;
  font-size:clamp(16px,4.5vw,20px);
  line-height:1.4;
  overflow-wrap:break-word;
  word-break:break-word;
  white-space:pre-wrap;
  max-width:100%;
}
.msg-row.me .bubble{
  background:var(--bubble-me);
  color:#fff;
  border-bottom-right-radius:6px;
}
.msg-row.other .bubble{
  background:var(--bubble-other);
  color:#fff;
  border-bottom-left-radius:6px;
}
.bubble img, .bubble video{
  max-width:100%;
  width:100%;
  border-radius:16px;
  display:block;
  margin-top:6px;
}
.bubble audio{
  margin-top:6px;
  max-width:100%;
  width:100%;
}
.bubble a{
  color:#cfe8ff;
}
.msg-time{
  font-size:11px;
  color:var(--text-dim);
  margin:3px 12px 0;
}
.empty{
  color:var(--text-dim);
  font-style:italic;
  text-align:center;
  margin-top:20px;
  font-size:14px;
}
/* ================= CHAT BOX ================= */
.chat-box{
  background:var(--header-bg);
  border-top:1px solid var(--border);
  padding:12px 14px;
  width:100%;
  max-width:100%;
}
.chat-controls{
  display:flex;
  gap:10px;
  align-items:center;
  width:100%;
  max-width:100%;
}
.plus-btn{
  width:38px;
  height:38px;
  min-width:38px;
  border-radius:50%;
  background:var(--input-bg);
  color:var(--bubble-me);
  border:none;
  font-size:24px;
  font-weight:600;
  line-height:1;
  cursor:pointer;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
}
.plus-btn:active{
  opacity:0.7;
}
.chat-controls input{
  flex:1;
  min-width:0;
  padding:11px 16px;
  border:1px solid var(--border);
  border-radius:22px;
  background:var(--input-bg);
  color:var(--text);
  font-size:clamp(14px,4vw,17px);
  outline:none;
}
.chat-controls input::placeholder{
  color:var(--text-dim);
}
.chat-controls button.primary{
  background:var(--bubble-me);
  color:#fff;
  border:none;
  border-radius:18px;
  padding:10px 16px;
  font-weight:600;
  cursor:pointer;
  font-size:clamp(13px,3.5vw,15px);
  flex-shrink:0;
  white-space:nowrap;
}
.chat-controls button.primary:active{
  opacity:0.7;
}
.file-name-preview{
  color:var(--text-dim);
  font-size:12px;
  margin-top:6px;
  padding-left:48px;
}
/* ================= AUTH SCREEN ================= */
.auth-overlay{
  position:fixed;
  inset:0;
  background:var(--bg);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:999;
}
.auth-box{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
  padding:24px;
  width:280px;
  max-width:90vw;
}
.auth-box h2{
  margin:0 0 16px 0;
  font-size:17px;
  text-align:center;
  font-weight:600;
}
.auth-box input{
  width:100%;
  padding:10px 12px;
  margin-bottom:10px;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--input-bg);
  color:var(--text);
  font-size:14px;
  outline:none;
}
.auth-box input::placeholder{
  color:var(--text-dim);
}
.auth-tabs{
  display:flex;
  margin-bottom:14px;
  background:var(--input-bg);
  border-radius:10px;
  padding:3px;
}
.auth-tab{
  flex:1;
  text-align:center;
  padding:6px;
  border-radius:8px;
  cursor:pointer;
  font-weight:600;
  font-size:13px;
  color:var(--text-dim);
}
.auth-tab.active{
  background:var(--bubble-me);
  color:#fff;
}
.auth-error{
  color:#ff453a;
  font-size:12px;
  margin-bottom:8px;
  min-height:14px;
  text-align:center;
}
.auth-box button{
  width:100%;
  background:var(--bubble-me);
  color:#fff;
  border:none;
  border-radius:10px;
  padding:10px;
  font-weight:600;
  font-size:14px;
  cursor:pointer;
}
.auth-box button:active{
  opacity:0.7;
}
.auth-hidden{
  display:none;
}
/* ================= SMALL SCREEN SAFETY NET ================= */
@media (max-width:380px){
  .header{
    padding:8px 10px;
    gap:8px;
  }
  .messages{
    padding:14px 10px;
  }
  .bubble-col{
    max-width:85%;
  }
  .chat-box{
    padding:10px;
  }
  .file-name-preview{
    padding-left:0;
  }
}
</style>
</head>
<body>

<div class="auth-overlay" id="authOverlay" style="display:none;">
  <div class="auth-box">
    <h2>Seamless Chat</h2>
    <div class="auth-tabs">
      <div class="auth-tab active" id="tabLogin" onclick="switchAuthTab('login')">Log In</div>
      <div class="auth-tab" id="tabRegister" onclick="switchAuthTab('register')">Register</div>
    </div>
    <div class="auth-error" id="authError"></div>

    <div id="loginForm">
      <input type="text" id="loginUsername" placeholder="Username">
      <input type="password" id="loginPassword" placeholder="Password">
      <button class="primary" onclick="doLogin()">Log In</button>
    </div>

    <div id="registerForm" class="auth-hidden">
      <input type="text" id="registerUsername" placeholder="Choose a username">
      <input type="password" id="registerPassword" placeholder="Choose a password">
      <input type="password" id="registerPassword2" placeholder="Confirm password">
      <button class="primary" onclick="doRegister()">Create Account</button>
    </div>
  </div>
</div>

<div class="header">
  <img class="avatar" src="https://i.ibb.co/FGzH1jK/Seamless-Cloud.png" alt="">
  <div class="header-title">
    <div class="chat-title" id="chatTitle">Seamless Chat</div>
    <div class="stats"><span id="msgCount">0</span> messages · You: <b id="meDisplay"></b></div>
  </div>
  <button onclick="doLogout()">Log Out</button>
</div>

<div class="container">
  <div class="main">
    <div class="messages" id="messages">
      <div class="empty">Loading global chat...</div>
    </div>

    <div class="chat-box">
      <div class="chat-controls">
        <button class="plus-btn" onclick="document.getElementById('fileInput').click()">+</button>
        <input type="text" id="msgInput" placeholder="iMessage">
        <button class="primary" onclick="sendMsg()">Send</button>
      </div>
      <input type="file" id="fileInput" accept="image/*,video/*,audio/*,.pdf,.txt,.zip,.doc,.docx" style="display:none">
      <div id="fileNamePreview" class="file-name-preview"></div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  updateDoc,
  onSnapshot,
  arrayUnion
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
  getStorage,
  ref,
  uploadBytes,
  getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

/* ================= FIREBASE CONFIG =================
   Replace this with YOUR project's config, found in:
   Firebase Console → Project settings → General → Your apps → SDK setup and configuration
   ==================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyBLghWLth0syJhARDMWiJ7xNwyJAh7MWjQ",
  authDomain: "securly-plans-main.firebaseapp.com",
  projectId: "securly-plans-main",
  storageBucket: "securly-plans-main.firebasestorage.app",
  messagingSenderId: "613499545769",
  appId: "1:613499545769:web:baa071714434c4814de1b8"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

/* ================= DOMAIN LOCK ================= */
const ALLOWED_HOST = "menist.free.nf";
const isAllowedDomain = window.location.hostname === ALLOWED_HOST;

function blockIfWrongDomain(){
  if(!isAllowedDomain){
    showError(`This chat only works when loaded from ${ALLOWED_HOST}. Current domain: ${window.location.hostname || "(local file)"}`);
    return true;
  }
  return false;
}

/* ================= HELPERS ================= */
function escapeHtml(str){
  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function showError(msg){
  const box = document.getElementById("messages");
  box.innerHTML = `<div class="empty" style="color:#a00;">⚠ ${escapeHtml(msg)}</div>`;
  console.error(msg);
}

/* ================= AUTH HELPERS ================= */
// Simple SHA-256 hash so we're not storing plaintext passwords.
// Note: for a real production app, use Firebase Authentication instead —
// this is a lightweight scheme suitable for a hobby/internal project.
async function hashPassword(pw){
  const enc = new TextEncoder().encode(pw);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf))
    .map(b=>b.toString(16).padStart(2,"0"))
    .join("");
}

function setAuthError(msg){
  document.getElementById("authError").textContent = msg || "";
}

window.switchAuthTab = function(tab){
  const isLogin = tab === "login";
  document.getElementById("tabLogin").classList.toggle("active", isLogin);
  document.getElementById("tabRegister").classList.toggle("active", !isLogin);
  document.getElementById("loginForm").classList.toggle("auth-hidden", !isLogin);
  document.getElementById("registerForm").classList.toggle("auth-hidden", isLogin);
  setAuthError("");
};

window.doRegister = async function(){
  setAuthError("");
  const username = document.getElementById("registerUsername").value.trim();
  const pw1 = document.getElementById("registerPassword").value;
  const pw2 = document.getElementById("registerPassword2").value;

  if(!username || !pw1){
    setAuthError("Enter a username and password.");
    return;
  }
  if(pw1 !== pw2){
    setAuthError("Passwords do not match.");
    return;
  }
  if(pw1.length < 4){
    setAuthError("Password must be at least 4 characters.");
    return;
  }

  try{
    const userRef = doc(db,"users",username);
    const snap = await getDoc(userRef);
    if(snap.exists()){
      setAuthError("That username is already taken.");
      return;
    }
    const passwordHash = await hashPassword(pw1);
    await setDoc(userRef,{
      username,
      passwordHash,
      created:Date.now()
    });
    completeLogin(username);
  }catch(err){
    setAuthError("Registration failed: " + err.message);
  }
};

window.doLogin = async function(){
  setAuthError("");
  const username = document.getElementById("loginUsername").value.trim();
  const pw = document.getElementById("loginPassword").value;

  if(!username || !pw){
    setAuthError("Enter your username and password.");
    return;
  }

  try{
    const userRef = doc(db,"users",username);
    const snap = await getDoc(userRef);
    if(!snap.exists()){
      setAuthError("No account with that username. Try registering.");
      return;
    }
    const passwordHash = await hashPassword(pw);
    if(snap.data().passwordHash !== passwordHash){
      setAuthError("Incorrect password.");
      return;
    }
    completeLogin(username);
  }catch(err){
    setAuthError("Login failed: " + err.message);
  }
};

window.doLogout = function(){
  localStorage.removeItem("username");
  location.reload();
};

function completeLogin(username){
  localStorage.setItem("username", username);
  location.reload();
}

/* ================= STATE ================= */
const currentChatId = "GLOBAL_CHAT";
const pageOpenTime = Date.now();

// Premade greeting shown locally on every page load — not stored in Firestore.
const PREMADE_MESSAGE = {
  from: "Seamless Guy",
  text: "Welcome to Seamless Chat!",
  displayTime: "17:48",
  media: null,
  mediaType: null
};

/* ================= USER ================= */
const me = localStorage.getItem("username");

if(!me){
  // Show auth screen, chat stays hidden until login/register succeeds.
  document.getElementById("authOverlay").style.display = "flex";
} else {
  document.getElementById("authOverlay").style.display = "none";
  document.getElementById("meDisplay").textContent = me;
  if(!blockIfWrongDomain()){
    initGlobalChat();
  }
}

async function markSeen(chatId){
  try{
    await setDoc(
      doc(db,"chatSeen",chatId + "_" + me),
      { chatId, user:me, lastSeen:Date.now() }
    );
  }catch(err){
    console.warn("Could not update chatSeen:", err.message);
  }
}

/* ================= INIT GLOBAL CHAT ================= */
async function initGlobalChat(){
  try{
    const chatRef = doc(db,"chats",currentChatId);
    const snap = await getDoc(chatRef);
    if(!snap.exists()){
      await setDoc(chatRef,{
        type:"global",
        participants:["GLOBAL"],
        messages:[],
        created:Date.now()
      });
    }
    await markSeen(currentChatId);

    // Render the premade welcome message immediately, before any real messages arrive.
    renderMessages([]);

    /* Real-time listener — only messages created after this page was opened are shown */
    onSnapshot(chatRef, (snap)=>{
      if(!snap.exists()) return;
      const all = snap.data().messages || [];
      const newOnly = all.filter(m => m.time >= pageOpenTime);
      renderMessages(newOnly);
    }, (err)=>{
      showError("Realtime listener failed: " + err.message);
    });

  }catch(err){
    showError("Failed to open global chat: " + err.message);
  }
}

/* ================= SEND ================= */
window.sendMsg = async function(){
  if(blockIfWrongDomain()) return;

  const text = document.getElementById("msgInput").value.trim();
  const file = document.getElementById("fileInput").files[0];

  let mediaURL = null;
  let mediaType = null;

  try{
    if(file){
      const storageRef = ref(
        storage,
        `chatUploads/${currentChatId}/${Date.now()}_${file.name}`
      );
      await uploadBytes(storageRef, file);
      mediaURL = await getDownloadURL(storageRef);
      mediaType = file.type;
    }

    if(!text && !mediaURL){
      return;
    }

    const chatRef = doc(db,"chats",currentChatId);
    await updateDoc(chatRef,{
      messages:arrayUnion({
        from:me,
        text:text || "",
        media:mediaURL,
        mediaType,
        time:Date.now()
      }),
      updated:Date.now()
    });

    document.getElementById("msgInput").value = "";
    document.getElementById("fileInput").value = "";
    document.getElementById("fileNamePreview").textContent = "";
  }catch(err){
    showError("Failed to send message: " + err.message);
  }
};

/* ================= RENDER ================= */
const CONTACT_PHOTO = "https://i.ibb.co/FGzH1jK/Seamless-Cloud.png";

function renderMessages(messages){
  const box = document.getElementById("messages");
  const wasNearBottom =
    box.scrollHeight - box.scrollTop - box.clientHeight < 50;

  box.innerHTML = "";

  const allMessages = [PREMADE_MESSAGE, ...messages];
  document.getElementById("msgCount").textContent = allMessages.length;

  allMessages.forEach(m=>{
    const isMe = m.from === me;
    const row = document.createElement("div");
    row.className = "msg-row " + (isMe ? "me" : "other");

    let mediaHTML = "";
    if(m.media){
      if(m.mediaType && m.mediaType.startsWith("image/")){
        mediaHTML = `<img src="${m.media}">`;
      }else if(m.mediaType && m.mediaType.startsWith("video/")){
        mediaHTML = `<video controls><source src="${m.media}"></video>`;
      }else if(m.mediaType && m.mediaType.startsWith("audio/")){
        mediaHTML = `<audio controls><source src="${m.media}"></audio>`;
      }else{
        mediaHTML = `<a href="${m.media}" target="_blank">📎 Download File</a>`;
      }
    }

    const textHTML = m.text ? escapeHtml(m.text) : "";
    const timeLabel = m.displayTime
      ? m.displayTime
      : new Date(m.time).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});

    row.innerHTML = `
      <img class="avatar" src="${CONTACT_PHOTO}" alt="">
      <div class="bubble-col">
        ${!isMe ? `<div class="sender-name">${escapeHtml(m.from)}</div>` : ""}
        <div class="bubble">${textHTML}${mediaHTML}</div>
        <div class="msg-time">${timeLabel}</div>
      </div>
    `;
    box.appendChild(row);
  });

  if(wasNearBottom){
    box.scrollTop = box.scrollHeight;
  }
}

/* ================= ENTER KEY ================= */
document.getElementById("msgInput").addEventListener("keypress", e=>{
  if(e.key === "Enter"){
    sendMsg();
  }
});

/* ================= FILE PREVIEW ================= */
document.getElementById("fileInput").addEventListener("change", ()=>{
  const file = document.getElementById("fileInput").files[0];
  const preview = document.getElementById("fileNamePreview");
  preview.textContent = file ? `📎 ${file.name} (tap Send to attach)` : "";
});

</script>
</body>
</html>
