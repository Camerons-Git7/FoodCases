<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YouTube Browser</title>
  <link rel="icon" type="image/x-icon" href="https://www.youtube.com/s/desktop/14cba078/img/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      font-family: "Inter", "Segoe UI", system-ui, sans-serif;
      background: #202124;
      color: #e8eaed;
      overflow: hidden;
    }

    #chrome-titlebar {
      height: 36px;
      background: #202124;
      display: flex;
      align-items: flex-end;
      padding: 0 0 0 8px;
      gap: 0;
      user-select: none;
      border-bottom: 1px solid #3c4043;
      overflow-x: hidden;
      flex-shrink: 0;
    }
    #chrome-titlebar::-webkit-scrollbar { height: 0; }

    .chrome-tab {
      position: relative;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 4px 0 6px;
      height: 32px;
      background: transparent;
      border-radius: 8px 8px 0 0;
      font-size: 12.5px;
      color: #9aa0a6;
      flex: 1 1 0;
      max-width: 240px;
      min-width: 48px;
      width: 0;
      cursor: pointer;
      transition: background 0.12s, color 0.12s;
      margin-right: 1px;
      overflow: hidden;
    }
    .chrome-tab:hover:not(.active) {
      background: #2d2e30;
      color: #e8eaed;
    }
    .chrome-tab.active {
      background: #292a2d;
      color: #e8eaed;
      z-index: 2;
    }
    .chrome-tab.active::before,
    .chrome-tab.active::after {
      content: "";
      position: absolute;
      bottom: 0;
      width: 8px;
      height: 8px;
      background: transparent;
    }
    .chrome-tab.active::before {
      left: -8px;
      border-bottom-right-radius: 8px;
      box-shadow: 4px 4px 0 0 #292a2d;
    }
    .chrome-tab.active::after {
      right: -8px;
      border-bottom-left-radius: 8px;
      box-shadow: -4px 4px 0 0 #292a2d;
    }
    .chrome-tab .tab-favicon {
      width: 16px;
      height: 16px;
      min-width: 16px;
      min-height: 16px;
      border-radius: 50%;
      flex-shrink: 0;
      color: #ff0000;
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      line-height: 1;
    }
    .chrome-tab .tab-favicon img {
      width: 16px !important;
      height: 16px !important;
      max-width: 16px;
      max-height: 16px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }
    .chrome-tab span:not(.tab-favicon) {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 500;
      min-width: 0;
    }
    .chrome-tab .tab-close {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: #9aa0a6;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      display: grid;
      place-items: center;
      opacity: 0;
      flex-shrink: 0;
      transition: background 0.12s, color 0.12s, opacity 0.12s;
    }
    .chrome-tab:hover .tab-close,
    .chrome-tab.active .tab-close {
      opacity: 1;
    }
    .chrome-tab .tab-close:hover {
      background: #5f6368;
      color: #fff;
    }

    .chrome-newtab {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: #9aa0a6;
      font-size: 18px;
      cursor: pointer;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      margin: 0 6px 2px 4px;
      transition: background 0.12s, color 0.12s;
    }
    .chrome-newtab:hover {
      background: #3c4043;
      color: #e8eaed;
    }

    .chrome-window-btns {
      margin-left: auto;
      display: flex;
      align-items: stretch;
      height: 100%;
      flex-shrink: 0;
    }
    .chrome-window-btns button {
      width: 46px;
      height: 100%;
      border: none;
      background: transparent;
      color: #9aa0a6;
      font-size: 14px;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background 0.12s, color 0.12s;
    }
    .chrome-window-btns button:hover {
      background: #3c4043;
      color: #e8eaed;
    }
    .chrome-window-btns .chrome-close:hover {
      background: #e81123;
      color: #fff;
    }

    #chrome-toolbar {
      height: 40px;
      background: #292a2d;
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 4px;
      border-bottom: 1px solid #3c4043;
      flex-shrink: 0;
    }
    .chrome-nav-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: #9aa0a6;
      font-size: 16px;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background 0.12s, color 0.12s;
    }
    .chrome-nav-btn:hover:not(:disabled) {
      background: #3c4043;
      color: #e8eaed;
    }
    .chrome-nav-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }

    #chrome-omnibox {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #202124;
      border-radius: 24px;
      padding: 0 14px;
      height: 34px;
      border: 1px solid transparent;
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
      margin: 0 6px;
    }
    #chrome-omnibox:hover {
      background: #303134;
    }
    #chrome-omnibox:focus-within {
      border-color: #8ab4f8;
      background: #202124;
      box-shadow: 0 0 0 1px #8ab4f8;
    }
    #chrome-omnibox .omni-icon {
      color: #9aa0a6;
      font-size: 13px;
      flex-shrink: 0;
    }
    #chrome-omnibox input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #e8eaed;
      font-size: 13.5px;
      font-family: inherit;
    }
    #chrome-omnibox input::placeholder {
      color: #9aa0a6;
    }
    #chrome-omnibox .omni-star {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: #9aa0a6;
      font-size: 15px;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background 0.12s, color 0.12s;
    }
    #chrome-omnibox .omni-star:hover {
      background: #3c4043;
    }
    #chrome-omnibox .omni-star.bookmarked {
      color: #fbbc04;
    }

    #chrome-bookmarks {
      min-height: 34px;
      background: #292a2d;
      display: flex;
      align-items: center;
      padding: 3px 12px;
      gap: 2px;
      border-bottom: 1px solid #3c4043;
      overflow-x: auto;
      flex-shrink: 0;
    }
    #chrome-bookmarks::-webkit-scrollbar { height: 0; }

    .bm-bar-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 16px;
      cursor: pointer;
      font-size: 12.5px;
      color: #e8eaed;
      white-space: nowrap;
      transition: background 0.12s;
      font-weight: 500;
    }
    .bm-bar-item:hover {
      background: #3c4043;
    }
    .bm-bar-item .bm-favicon {
      width: 14px;
      height: 14px;
      border-radius: 2px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      color: #ff0000;
      font-size: 10px;
      font-weight: 700;
    }
    .bm-bar-item .bm-del {
      opacity: 0;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: #9aa0a6;
      cursor: pointer;
      font-size: 12px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      transition: opacity 0.12s, background 0.12s;
    }
    .bm-bar-item:hover .bm-del {
      opacity: 1;
    }
    .bm-bar-item .bm-del:hover {
      background: #5f6368;
      color: #fff;
    }

    #chrome-content {
      flex: 1;
      overflow: hidden;
      position: relative;
      background: #0f0f0f;
      display: flex;
      flex-direction: column;
    }
    .tab-content {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      overflow-x: hidden;
      display: none;
      flex-direction: column;
      background: #0f0f0f;
    }
    .tab-content.active {
      display: flex;
    }

    .home-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      background: radial-gradient(circle at 50% 28%, #1a1a1a 0%, #0f0f0f 65%);
      min-height: 100%;
      width: 100%;
    }
    .home-screen .home-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 1.4rem;
    }
    .home-screen .home-logo .logo-icon {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: #ff0000;
      display: grid;
      place-items: center;
      box-shadow: 0 4px 18px rgba(255,0,0,0.28);
    }
    .home-screen .home-logo .logo-icon svg {
      width: 26px;
      height: 26px;
      fill: white;
    }
    .home-screen .home-logo .logo-text {
      font-size: 2.6rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #fff;
    }
    .home-screen .home-subtitle {
      font-size: 1.05rem;
      color: #9aa0a6;
      margin-bottom: 2.2rem;
      max-width: 460px;
      line-height: 1.45;
    }
    .home-screen .home-search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #1f1f1f;
      border: 1px solid #3c4043;
      border-radius: 28px;
      padding: 0 8px 0 18px;
      width: 100%;
      max-width: 560px;
      height: 50px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .home-screen .home-search-box:focus-within {
      border-color: #ff0000;
      box-shadow: 0 0 0 3px rgba(255,0,0,0.12);
    }
    .home-screen .home-search-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #e8eaed;
      font-size: 1rem;
      font-family: inherit;
    }
    .home-screen .home-search-box input::placeholder {
      color: #9aa0a6;
    }
    .home-screen .home-search-box button {
      background: #ff0000;
      color: white;
      border: none;
      border-radius: 22px;
      padding: 8px 20px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .home-screen .home-search-box button:hover {
      background: #cc0000;
    }

    .browse-screen {
      padding-bottom: 2rem;
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
    }
    .browse-screen:has(.loading-wrap.active) {
      align-items: center;
      justify-content: center;
    }
    .browse-content {
      max-width: 1240px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem;
      width: 100%;
    }
    .channel-section {
      margin-bottom: 2.2rem;
      display: none;
    }
    .channel-section.loaded {
      display: block;
    }
    .channel-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #ff0000;
      border-bottom: 2px solid #ff0000;
      padding-bottom: 0.45rem;
      margin-bottom: 1.1rem;
    }
    .video-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.1rem;
    }
    .video-card {
      background: #1f1f1f;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.18s, border-color 0.18s, box-shadow 0.18s;
      border: 1px solid #333;
      display: flex;
      flex-direction: column;
      flex: 0 1 270px;
      max-width: 100%;
    }
    .video-card:hover {
      transform: translateY(-3px);
      border-color: #ff0000;
      box-shadow: 0 8px 22px rgba(255,0,0,0.1);
    }
    .video-thumb {
      width: 100%;
      padding-bottom: 56.25%;
      position: relative;
      background: #000;
      overflow: hidden;
    }
    .video-thumb img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .video-info {
      padding: 0.7rem 0.9rem 0.4rem;
      color: #e8eaed;
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .video-meta {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 0.2rem 0.9rem 0.7rem;
      font-size: 0.75rem;
      color: #aaa;
    }
    .video-meta .meta-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #333;
      flex-shrink: 0;
      object-fit: cover;
      display: block;
      margin-top: 1px;
    }
    .video-meta .meta-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
      flex: 1;
      min-width: 0;
    }
    .video-meta .meta-channel {
      font-weight: 600;
      color: #aaa;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 0.8rem;
    }
    .video-meta .meta-stats {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
      color: #888;
      flex-wrap: wrap;
    }
    .video-meta .meta-stats span {
      white-space: nowrap;
    }
    .video-meta .meta-stats .dot {
      font-size: 0.6rem;
      opacity: 0.6;
    }
    .video-duration {
      position: absolute;
      bottom: 6px;
      right: 6px;
      background: rgba(0,0,0,0.8);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: 0.3px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.1);
      z-index: 2;
    }

    .video-screen {
      background: #000;
      padding: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .video-container {
      position: relative;
      width: 100%;
      flex: 1;
      max-width: 100%;
      overflow: hidden;
      background: #000;
    }
    .video-container iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .loading-wrap {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 4rem 2rem;
      min-height: 300px;
    }
    .loading-wrap.active {
      display: flex;
    }
    .red-spinner {
      width: 42px;
      height: 42px;
      border: 4px solid rgba(255,0,0,0.2);
      border-top: 4px solid #ff0000;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .error-msg {
      color: #ff4444;
      padding: 2rem;
      text-align: center;
      font-weight: 600;
    }

    #toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      background: #323232;
      color: #fff;
      padding: 0.7rem 1.4rem;
      border-radius: 8px;
      border: 1px solid #444;
      font-size: 0.85rem;
      font-weight: 500;
      z-index: 9999;
      transition: opacity 0.3s ease;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      display: none;
    }
    #toast.show {
      opacity: 1;
      pointer-events: auto;
      display: block;
    }

    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: #0f0f0f; }
    ::-webkit-scrollbar-thumb {
      background: #5f6368;
      border-radius: 5px;
      border: 2px solid #0f0f0f;
    }
    ::-webkit-scrollbar-thumb:hover { background: #80868b; }
    ::-webkit-scrollbar-corner { background: transparent; }

    #context-menu {
      position: fixed;
      background: #2d2e30;
      border: 1px solid #3c4043;
      border-radius: 8px;
      padding: 6px 0;
      min-width: 190px;
      z-index: 100000;
      box-shadow: 0 8px 28px rgba(0,0,0,0.55);
      font-size: 13px;
      user-select: none;
      display: none;
    }
    .ctx-item {
      padding: 9px 18px;
      color: #e8eaed;
      cursor: pointer;
      transition: background 0.1s;
      font-weight: 500;
    }
    .ctx-item:hover {
      background: #ff0000;
      color: #fff;
    }
    .ctx-item.hidden {
      display: none !important;
    }

    @media (max-width: 640px) {
      #chrome-toolbar { padding: 0 6px; }
      .video-grid { grid-template-columns: 1fr; }
      .home-screen .home-logo .logo-text { font-size: 2rem; }
      .home-screen .home-search-box { max-width: 100%; }
      .chrome-tab { min-width: 40px; }
      .video-meta .meta-stats { font-size: 0.65rem; }
    }
  </style>
</head>

    function setTabIcon(tabId, icon) {
      const fav = document.querySelector(`#tab-${tabId} .tab-favicon`);

      if (icon && (icon.startsWith("http") || icon.startsWith("//"))) {

    let tabs = [];
    let activeTabId = 0;
    let nextTabId = 1;

    const preloadCache = {};
    let preloadInProgress = false;

    function initTabState(id) {
      tabs[id] = {
        allChannelVideos: {},
        channelStates: {},
        currentVideoId: null,
        currentVideoTitle: "",
        currentChannels: [],
        currentBrowseTitle: "",
        isSearchMode: false,

        screen: "home",

      };

    initTabState(0);

    const BM_KEY = "yt_browser_bookmarks";

    function getBookmarks() {
      try { return JSON.parse(localStorage.getItem(BM_KEY)) || []; } catch { return []; }
    }
    function saveBookmarks(bms) { localStorage.setItem(BM_KEY, JSON.stringify(bms)); renderBookmarksBar(); }

    function ensureDefaultBookmark() {
      let bms = getBookmarks();
      const joeIdx = bms.findIndex(b => b.id === "joe-default");
      if (joeIdx === -1) {
        bms.unshift({
          id: "joe-default",
          name: "Joe",
          type: "collection",
          channels: defaultChannels,
          created: Date.now(),
          deletable: true
        });
        saveBookmarks(bms);
      }
    }

    function deleteBookmark(id) {
      let bms = getBookmarks().filter(b => b.id !== id);
      saveBookmarks(bms);
      toast("Bookmark removed");
    }

    function addBookmark(name, type, data) {
      let bms = getBookmarks();
      if (type === "video" && bms.some(b => b.type === "video" && b.videoId === data.videoId)) {
        toast("Already bookmarked"); return;
      }
      const bm = { id: "bm-" + Date.now() + "-" + Math.random().toString(36).slice(2,7), name, type, created: Date.now(), deletable: true, ...data };
      bms.push(bm);
      saveBookmarks(bms);
      toast("Bookmarked: " + name);
    }

    function bookmarkCurrent() {
      const t = tabs[activeTabId];
      if (!t.currentVideoId) return;
      addBookmark(t.currentVideoTitle || "Video " + t.currentVideoId, "video", { videoId: t.currentVideoId });
    }

    function bookmarkCurrentChannels(title, channels) {
      addBookmark(title, "collection", { channels });
    }

    function renderBookmarksBar() {
      const bar = document.getElementById("chrome-bookmarks");
      const bms = getBookmarks();
      bar.innerHTML = "";
      bms.forEach(bm => {
        const item = document.createElement("div");
        item.className = "bm-bar-item";
        item.dataset.dynamic = "true";
        item.innerHTML = `
          <div class="bm-favicon">▶</div>
          <span>${escapeHtml(bm.name)}</span>
          ${bm.deletable !== false ? `<button class="bm-del" onclick="event.stopPropagation(); deleteBookmark('${bm.id}')">×</button>` : ""}
        `;
        item.onclick = () => {
          if (bm.type === "video") { playVideo(bm.videoId); }
          else if (bm.type === "collection") { openBrowse(null, bm.channels, bm.name); }
        };
        bar.appendChild(item);
      });
    }

    function starCurrent() {
      const t = tabs[activeTabId];
      const input = document.getElementById("omnibox-input").value.trim();
      if (t.currentVideoId) {
        bookmarkCurrent();
        document.getElementById("omni-star").classList.add("bookmarked");
        setTimeout(() => document.getElementById("omni-star").classList.remove("bookmarked"), 2000);
      } else if (t.currentChannels.length > 0) {
        bookmarkCurrentChannels(t.currentBrowseTitle || "Channel", t.currentChannels);
        document.getElementById("omni-star").classList.add("bookmarked");
        setTimeout(() => document.getElementById("omni-star").classList.remove("bookmarked"), 2000);
      } else if (input) {
        const ch = extractChannel(input);
        if (ch) {
          const channels = [{ id: "dynamic-channel", title: ch.name || "Channel", url: ch.url }];
          bookmarkCurrentChannels(ch.name || "Channel", channels);
          document.getElementById("omni-star").classList.add("bookmarked");
          setTimeout(() => document.getElementById("omni-star").classList.remove("bookmarked"), 2000);

      } else {
        toast("Nothing to bookmark");
      }
    }

    function getCacheKey(channels) {
      return channels.map(c => c.id).sort().join("|");
    }

    async function preloadChannels(channels) {
      const key = getCacheKey(channels);
      if (preloadCache[key] || preloadInProgress) return;
      preloadInProgress = true;

      const cacheEntry = {
        allChannelVideos: {},
        channelStates: {},
        ready: false,
        loading: true,
        error: null
      };
      preloadCache[key] = cacheEntry;

      channels.forEach(ch => {
        cacheEntry.allChannelVideos[ch.id] = [];
        cacheEntry.channelStates[ch.id] = { continuationToken: null, apiKey: null, clientVersion: null, proxy: null, loading: true, error: null, isSearch: ch.isSearch || false };
      });

      try {
        await Promise.all(channels.map(ch => preloadChannelVideos(ch, cacheEntry)));
        cacheEntry.ready = true;
      } catch (err) {
        cacheEntry.error = err.message;
      } finally {
        cacheEntry.loading = false;
        preloadInProgress = false;
      }
    }

    async function preloadChannelVideos(channel, cacheEntry) {
      try {
        let initSuccess = false, lastError = null;
        for (const proxy of proxies) {
          try {
            let fetchUrl = channel.url;
            if (!fetchUrl.includes("hl=")) fetchUrl += (fetchUrl.includes("?") ? "&" : "?") + "hl=en&gl=US";
            const res = await fetch(proxy + encodeURIComponent(fetchUrl), { headers: { "Accept": "text/html", "Accept-Language": "en-US,en;q=0.9", "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" } });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const html = await res.text();
            if (html.length < 2000) throw new Error("Empty response");
            const apiKey = html.match(/"INNERTUBE_API_KEY":"([^"]+)"/)?.[1];
            const clientVersion = html.match(/"INNERTUBE_CLIENT_VERSION":"([^"]+)"/)?.[1];
            if (!apiKey || !clientVersion) throw new Error("Missing API key/version");
            const videos = parseVideos(html);
            if (videos.length === 0) throw new Error("No videos found");
            const continuationToken = findContinuation(html);
            cacheEntry.allChannelVideos[channel.id] = videos;
            cacheEntry.channelStates[channel.id] = { continuationToken, apiKey, clientVersion, proxy, loading: false, error: null, isSearch: channel.isSearch || false };
            initSuccess = true; break;
          } catch (e) { lastError = e; }
        }
        if (!initSuccess) throw lastError || new Error("All proxies failed");

        while (cacheEntry.channelStates[channel.id].continuationToken && cacheEntry.allChannelVideos[channel.id].length < 120) {
          const ok = await preloadMoreVideos(channel, cacheEntry);
          if (!ok) break;
          await new Promise(r => setTimeout(r, 200));
        }
      } catch (err) {
        cacheEntry.channelStates[channel.id].error = err.message;
        console.error(channel.title + " preload error:", err);
      } finally {
        cacheEntry.channelStates[channel.id].loading = false;
      }
    }

    async function preloadMoreVideos(channel, cacheEntry) {
      const s = cacheEntry.channelStates[channel.id];
      if (!s.continuationToken || !s.apiKey || !s.proxy) return false;
      try {
        const url = `https://www.youtube.com/youtubei/v1/browse?key=${s.apiKey}`;
        const body = { context: { client: { clientName: "WEB", clientVersion: s.clientVersion || "2.20250301.01.00", hl: "en", gl: "US" } }, continuation: s.continuationToken };
        const res = await fetch(s.proxy + encodeURIComponent(url), { method: "POST", headers: { "Content-Type": "application/json", "Accept-Language": "en-US,en;q=0.9", "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" }, body: JSON.stringify(body) });
        if (!res.ok) return false;
        const data = await res.json();
        const newVideos = parseContinuationVideos(data);
        if (newVideos.length === 0) { s.continuationToken = null; return false; }
        const seen = new Set(cacheEntry.allChannelVideos[channel.id].map(v => v.id));
        cacheEntry.allChannelVideos[channel.id].push(...newVideos.filter(v => !seen.has(v.id)));
        s.continuationToken = data?.continuationContents?.gridContinuation?.continuations?.[0]?.nextContinuationData?.continuation || data?.onResponseReceivedActions?.[0]?.appendContinuationItemsAction?.continuationItems?.find(i => i.continuationItemRenderer)?.continuationItemRenderer?.continuationEndpoint?.continuationCommand?.token || null;
        return true;
      } catch (e) { console.warn("Preload continuation error:", e); return false; }
    }

    function newTab() {
      const id = nextTabId++;
      initTabState(id);

      const tabEl = document.createElement("div");
      tabEl.className = "chrome-tab";
      tabEl.id = "tab-" + id;
      tabEl.onclick = () => switchTab(id);
      tabEl.innerHTML = `
        <span class="tab-favicon">▶</span>
        <span>New Tab</span>
        <button class="tab-close" onclick="event.stopPropagation(); closeTab(${id})">×</button>
      `;
      document.getElementById("chrome-titlebar").insertBefore(tabEl, document.querySelector(".chrome-newtab"));

      const contentEl = document.createElement("div");
      contentEl.className = "tab-content";
      contentEl.setAttribute("data-tab", id);
      contentEl.innerHTML = `
        <div class="home-screen">

              <svg viewBox="0 0 24 24"><path d="M10 15l5.19-3L10 9v6zm11.56-7.83c.13.47.22 1.1.28 1.9.07.8.1 1.49.1 2.09L22 12c0 2.19-.16 3.8-.44 4.83-.25.9-.83 1.48-1.73 1.73-.47.13-1.33.22-2.65.28-1.3.07-2.49.1-3.59.1L12 19c-4.19 0-6.8-.16-7.83-.44-.9-.25-1.48-.83-1.73-1.73-.13-.47-.22-1.1-.28-1.9-.07-.8-.1-1.49-.1-2.09L2 12c0-2.19.16-3.8.44-4.83.25-.9.83-1.48 1.73-1.73.47-.13 1.33-.22 2.65-.28 1.3-.07 2.49-.1 3.59-.1L12 5c4.19 0 6.8.16 7.83.44.9.25 1.48.83 1.73 1.73z"/></svg>

      switchTab(id);

    function switchTab(id) {
      activeTabId = id;
      document.querySelectorAll(".chrome-tab").forEach(t => t.classList.remove("active"));
      document.getElementById("tab-" + id)?.classList.add("active");
      document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
      document.querySelector(`.tab-content[data-tab="${id}"]`)?.classList.add("active");
      updateNavButtons();
      syncOmnibox();
    }

    let tabResizeTimer = null;
    function freezeTabWidths() {
      const tabsEls = document.querySelectorAll(".chrome-tab");
      tabsEls.forEach(t => {
        const w = t.getBoundingClientRect().width;
        t.style.flex = "none";
        t.style.width = w + "px";
        t.style.maxWidth = "none";
        t.style.minWidth = "0";
      });
    }
    function unfreezeTabWidths() {
      const tabsEls = document.querySelectorAll(".chrome-tab");
      tabsEls.forEach(t => {
        t.style.flex = "";
        t.style.width = "";
        t.style.maxWidth = "";
        t.style.minWidth = "";
      });
    }
    function scheduleTabUnfreeze() {
      clearTimeout(tabResizeTimer);
      tabResizeTimer = setTimeout(() => { unfreezeTabWidths(); }, 400);
    }

    function closeTab(id) {
      const tabEl = document.getElementById("tab-" + id);
      const contentEl = document.querySelector(`.tab-content[data-tab="${id}"]`);
      if (!tabEl || !contentEl) return;

      freezeTabWidths();
      const player = contentEl.querySelector(".player");
      if (player) player.src = "";

      const allTabs = [...document.querySelectorAll(".chrome-tab")];
      const idx = allTabs.indexOf(tabEl);
      tabEl.remove();
      contentEl.remove();
      delete tabs[id];

      const remaining = document.querySelectorAll(".chrome-tab");
      if (remaining.length === 0) {
        unfreezeTabWidths();
        newTab();
        return;
      }
      if (activeTabId === id) {
        const newIdx = Math.max(0, Math.min(idx, remaining.length - 1));
        const newId = parseInt(remaining[newIdx].id.replace("tab-", ""));
        switchTab(newId);
      }
      scheduleTabUnfreeze();
    }

    function getActiveContent() {
      return document.querySelector(`.tab-content[data-tab="${activeTabId}"]`);
    }

    function getActiveHomeInput() {
      const content = getActiveContent();
      return content?.querySelector(".home-input");
    }

    function pushNav(type, data, title) {
      const t = tabs[activeTabId];
      t.navHistory = t.navHistory.slice(0, t.navIndex + 1);
      t.navHistory.push({ type, data, title });
      t.navIndex++;
      updateNavButtons();
    }

    function goBack() {
      const t = tabs[activeTabId];
      if (t.navIndex > 0) {
        t.navIndex--;
        const entry = t.navHistory[t.navIndex];
        restoreNav(entry, false);
        updateNavButtons();
      }
    }

    function goForward() {
      const t = tabs[activeTabId];
      if (t.navIndex < t.navHistory.length - 1) {
        t.navIndex++;
        const entry = t.navHistory[t.navIndex];
        restoreNav(entry, false);
        updateNavButtons();
      }
    }

    function updateNavButtons() {
      const t = tabs[activeTabId];
      document.getElementById("btn-back").disabled = t.navIndex <= 0;
      document.getElementById("btn-fwd").disabled = t.navIndex >= t.navHistory.length - 1;
    }

    function restoreNav(entry, push=true) {
      if (!entry) return;
      if (entry.type === "home") goHome(false);
      else if (entry.type === "video") playVideo(entry.data, false);
      else if (entry.type === "browse") openBrowse(null, entry.data, entry.title, false);
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(()=>{});
      } else {
        document.exitFullscreen().catch(()=>{});
      }
    }

    function showScreen(id) {
      const content = getActiveContent();
      if (!content) return;

      const currentScreen = tabs[activeTabId]?.screen;
      if (currentScreen === "video" && id !== "video-screen") {
        const player = content.querySelector(".player");
        if (player) player.src = "";
      }

      content.querySelectorAll(".home-screen, .browse-screen, .video-screen").forEach(s => s.style.display = "none");
      const target = content.querySelector("." + id);
      if (target) target.style.display = "flex";
      tabs[activeTabId].screen = id.replace("-screen", "");
    }

    function ensureScreens() {
      const content = getActiveContent();
      if (!content) return;
      if (!content.querySelector(".browse-screen")) {
        const browse = document.createElement("div");
        browse.className = "browse-screen";
        browse.style.display = "none";
        browse.innerHTML = `
          <div class="browse-content"></div>
          <div class="loading-wrap">
            <div class="red-spinner"></div>
            <div style="color:#888;font-size:1.1rem;">Loading…</div>
          </div>
        `;
        content.appendChild(browse);
      }
      if (!content.querySelector(".video-screen")) {
        const video = document.createElement("div");
        video.className = "video-screen";
        video.style.display = "none";
        video.innerHTML = `
          <div class="video-container">
            <iframe class="player" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
          </div>
        `;
        content.appendChild(video);
      }
    }

    function goHome(push=true) {
      ensureScreens();
      showScreen("home-screen");
      const t = tabs[activeTabId];
      const content = getActiveContent();
      const player = content?.querySelector(".player");
      if (player) player.src = "";
      t.currentVideoId = null;
      t.currentChannels = [];
      t.currentBrowseTitle = "";
      document.getElementById("tab-" + activeTabId).querySelector("span:not(.tab-favicon)").textContent = "New Tab";
      setTabIcon(activeTabId, "▶");
      document.getElementById("omnibox-input").value = "";
      document.getElementById("omni-secure").textContent = "🔒";
      if (push) pushNav("home");
    }

    function reloadPage() {
      const t = tabs[activeTabId];
      if (t.currentVideoId) {
        playVideo(t.currentVideoId, false);
        toast("Reloaded");
      } else if (t.currentChannels.length > 0) {
        openBrowse(null, t.currentChannels, t.currentBrowseTitle, false);
        toast("Reloaded");
      } else {
        goHome(false);
        toast("Reloaded");
      }
    }

    function focusHomeSearch() {
      const input = getActiveHomeInput();
      if (input) input.focus();
    }

    function syncOmnibox() {
      const t = tabs[activeTabId];
      if (t.currentVideoId) {
        document.getElementById("omnibox-input").value = `https://www.youtube.com/watch?v=${t.currentVideoId}`;
      } else if (t.currentBrowseTitle && t.isSearchMode) {
        document.getElementById("omnibox-input").value = t.currentBrowseTitle.replace(/^Search:\s*"|"$/g, "");
      } else if (t.currentBrowseTitle && t.currentChannels.length === 1 && t.currentChannels[0].url && t.currentChannels[0].url.includes('youtube.com')) {
        let channelUrl = t.currentChannels[0].url.replace(/[?&](hl|gl)=[^&]*/g, '');
        channelUrl = channelUrl.replace(/[?&]$/, '');
        if (!channelUrl.endsWith('/videos')) channelUrl = channelUrl.replace(/\/$/, '') + '/videos';
        document.getElementById("omnibox-input").value = channelUrl;
      } else if (t.currentBrowseTitle) {
        document.getElementById("omnibox-input").value = t.currentBrowseTitle;
      } else {
        document.getElementById("omnibox-input").value = "";
      }
    }

    document.getElementById("omnibox-input").addEventListener("keypress", e => {
      if (e.key === "Enter") handleOmnibox();
    });

    function handleOmnibox() {
      const input = document.getElementById("omnibox-input").value.trim();
      if (!input) return;
      handleInput(input);
    }

    function handleHomeSearch(btn) {
      const input = btn.parentElement.querySelector(".home-input").value.trim();
      if (!input) return;
      handleInput(input);
    }

    function handleInput(input) {
      const videoId = extractVideoId(input);
      if (videoId) { playVideo(videoId); return; }

      const ch = extractChannel(input);
      if (ch) {
        const channels = [{ id: "dynamic-channel", title: ch.name || "Channel", url: ch.url }];
        openBrowse(null, channels, ch.name || "Channel Videos");
        return;
      }

      const searchUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(input)}`;
      const searchTitle = input;
      const searchChannels = [{ id: "search-results", title: searchTitle, url: searchUrl, isSearch: true }];
      openBrowse(null, searchChannels, searchTitle);
    }

    function extractVideoId(input) {
      return input.match(/(?:v=|youtu\.be\/|embed\/)([a-zA-Z0-9_-]{11})/)?.[1] || (input.length === 11 && /^[a-zA-Z0-9_-]{11}$/.test(input) ? input : null);
    }

    function extractChannel(input) {
      const m = input.match(/youtube\.com\/(@[^/]+|channel\/[^/]+|c\/[^/]+)/i);
      if (!m) return null;
      let url = input;
      if (!/\/videos/i.test(url)) url = url.replace(/\/?(\?.*)?$/, "") + "/videos";
      if (!url.includes("gl=") && !url.includes("hl=")) url += (url.includes("?") ? "&" : "?") + "gl=US&hl=en";
      const name = m[1].startsWith("@") ? m[1] : "Channel";
      return { url, name };
    }

    function playVideo(input, push=true, title=null, avatar=null) {
      const videoId = typeof input === "string" && input.length === 11 ? input : extractVideoId(input);
      if (!videoId) { toast("Invalid YouTube link"); return; }
      ensureScreens();
      const t = tabs[activeTabId];
      t.currentVideoId = videoId;
      t.currentVideoTitle = title || "YouTube Video";
      t.currentChannels = [];
      showScreen("video-screen");
      const content = getActiveContent();
      const player = content.querySelector(".player");
      player.src = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1&iv_load_policy=3&playsinline=1`;
      const tabTitle = title ? title : "YouTube Video";
      document.getElementById("tab-" + activeTabId).querySelector("span:not(.tab-favicon)").textContent = tabTitle;
      setTabIcon(activeTabId, avatar || "▶");
      document.getElementById("omnibox-input").value = `https://www.youtube.com/watch?v=${videoId}`;
      document.getElementById("omni-secure").textContent = "🔒";
      if (push) pushNav("video", videoId);
    }

    function getBrowseIcon(channels, title) {
      if (!channels || channels.length === 0) return "▶";
      if (channels[0]?.isSearch) return "▶";
      if (channels.length === 1) {
        if (channels[0].avatar) return channels[0].avatar;
        const known = defaultChannels.find(c => c.id === channels[0].id || c.url === channels[0].url);
        if (known?.avatar) return known.avatar;
      }
      if (channels.length > 1 && channels.some(c => c.id === "joe-bart" || (c.url && c.url.includes("JoeBartolozzi")))) return JOE_MAIN_AVATAR;
      const withAvatar = channels.find(c => c.avatar);
      if (withAvatar) return withAvatar.avatar;
      for (const ch of channels) {
        const known = defaultChannels.find(c => c.id === ch.id || c.url === ch.url);
        if (known?.avatar) return known.avatar;
      }
      return "▶";
    }

    function loadDefaultJoe() { openBrowse(null, defaultChannels, "Joe Bart Videos"); }

    async function loadAllChannelVideos(channel) {
      const t = tabs[activeTabId];
      const grid = document.getElementById(`grid-${activeTabId}-${channel.id}`);
      try {
        let initSuccess = false, lastError = null;
        for (const proxy of proxies) {
          try {
            let fetchUrl = channel.url;
            if (!fetchUrl.includes("hl=")) fetchUrl += (fetchUrl.includes("?") ? "&" : "?") + "hl=en&gl=US";
            const res = await fetch(proxy + encodeURIComponent(fetchUrl), { headers: { "Accept": "text/html", "Accept-Language": "en-US,en;q=0.9", "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" } });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const html = await res.text();
            if (html.length < 2000) throw new Error("Empty response");
            const apiKey = html.match(/"INNERTUBE_API_KEY":"([^"]+)"/)?.[1];
            const clientVersion = html.match(/"INNERTUBE_CLIENT_VERSION":"([^"]+)"/)?.[1];
            if (!apiKey || !clientVersion) throw new Error("Missing API key/version");
            const videos = parseVideos(html);
            if (videos.length === 0) throw new Error("No videos found");
            const continuationToken = findContinuation(html);
            t.allChannelVideos[channel.id] = videos;
            t.channelStates[channel.id] = { continuationToken, apiKey, clientVersion, proxy, loading: false, error: null, isSearch: channel.isSearch || false };
            renderChannelVideos(channel);
            initSuccess = true; break;
          } catch (e) { lastError = e; }
        }
        if (!initSuccess) throw lastError || new Error("All proxies failed");
        while (t.channelStates[channel.id].continuationToken && t.allChannelVideos[channel.id].length < 120) {
          const ok = await loadMoreVideos(channel);
          if (!ok) break;
          renderChannelVideos(channel);
          await new Promise(r => setTimeout(r, 200));
        }
      } catch (err) {
        grid.innerHTML = `<div class="error-msg">Failed to load<br>${escapeHtml(err.message)}</div>`;
        t.channelStates[channel.id].error = err.message;
        console.error(channel.title + " error:", err);
      } finally {
        t.channelStates[channel.id].loading = false;
        renderChannelVideos(channel);
      }
    }

    function findContinuation(html) {
      const matches = [...html.matchAll(/"continuationCommand"\s*:\s*\{\s*"token"\s*:\s*"([^"]+)"/g)].map(m => m[1]);
      if (matches.length) {
        return matches.reduce((a, b) => a.length >= b.length ? a : b);
      }
      const m2 = html.match(/"continuation"\s*:\s*"([^"]{40,})"/);
      return m2 ? m2[1] : null;
    }

    function parseVideos(html) {
      const videos = [];
      try {
        const match = html.match(/var ytInitialData = ({.+?});<\/script>/s);
        if (match) {
          const data = JSON.parse(match[1]);
          function recurse(obj) {
            if (!obj || typeof obj !== "object") return;

            const vr = obj.videoRenderer || obj.gridVideoRenderer || obj.richItemRenderer?.content?.videoRenderer || obj.compactVideoRenderer || obj.reelItemRenderer;
            if (vr?.videoId) {
              let title = vr.title?.runs?.[0]?.text || vr.title?.simpleText || vr.headline?.simpleText || "Untitled Video";
              const thumbs = vr.thumbnail?.thumbnails || [];
              const thumb = thumbs[thumbs.length - 1]?.url || `https://i.ytimg.com/vi/${vr.videoId}/hqdefault.jpg`;

              const duration = vr.lengthText?.simpleText || vr.lengthText?.runs?.[0]?.text || null;

              const channelName =
                vr.ownerText?.runs?.[0]?.text ||
                vr.shortBylineText?.runs?.[0]?.text ||
                vr.longBylineText?.runs?.[0]?.text ||
                vr.owner?.title?.runs?.[0]?.text ||
                vr.channelName?.simpleText ||
                null;

              let avatar = null;
              const chThumbs = vr.channelThumbnailSupportedRenderers?.channelThumbnailWithLinkRenderer?.thumbnail?.thumbnails
                || vr.owner?.thumbnail?.thumbnails
                || vr.channelThumbnail?.thumbnails;
              if (chThumbs?.length) avatar = chThumbs[chThumbs.length - 1].url;

              const publishedTime = vr.publishedTimeText?.simpleText || null;
              const viewCount = vr.viewCountText?.simpleText || vr.shortViewCountText?.simpleText || null;
              let viewsAndDate = "";
              if (viewCount) viewsAndDate += viewCount;
              if (publishedTime) {
                if (viewsAndDate) viewsAndDate += " • ";
                viewsAndDate += publishedTime;
              }

              videos.push({
                id: vr.videoId,
                title: title.trim(),
                thumbnail: thumb,
                avatar,
                channelName,
                duration,
                viewCount,
                publishedTime,
                viewsAndDate
              });
            }

            const lockup = obj.lockupViewModel || (obj.richItemRenderer?.content?.lockupViewModel);
            if (lockup) {
              const id = lockup.contentId || lockup.rendererContext?.commandContext?.onTap?.innertubeCommand?.watchEndpoint?.videoId;
              if (id && /^[a-zA-Z0-9_-]{11}$/.test(id)) {
                const lockupMeta = lockup.metadata?.lockupMetadataViewModel;
                let title = lockupMeta?.title?.content
                  || lockup.metadata?.title?.content
                  || lockup.metadata?.metadataDetails?.title?.content
                  || lockup.rendererContext?.accessibilityContext?.label
                  || "Untitled Video";
                if (typeof title === "string" && /\d+\s+minutes/.test(title)) {
                  title = title.replace(/\s+\d+\s+minutes.*$/, "").trim() || title;
                }
                const sources = lockup.contentImage?.thumbnailViewModel?.image?.sources || [];
                const thumb = (sources.length ? sources[sources.length - 1].url : null) || `https://i.ytimg.com/vi/${id}/hqdefault.jpg`;

                let duration = null;
                const overlays = lockup.contentImage?.thumbnailViewModel?.overlays || [];
                for (const ov of overlays) {
                  const badges = ov.thumbnailOverlayBadgeViewModel?.thumbnailBadges;
                  if (badges) {
                    for (const b of badges) {
                      if (b.thumbnailBadgeViewModel?.text) { duration = b.thumbnailBadgeViewModel.text; break; }
                    }
                  }
                  if (!duration && ov.thumbnailOverlayTimeStatusViewModel?.simpleText) {
                    duration = ov.thumbnailOverlayTimeStatusViewModel.simpleText;
                  }
                  if (duration) break;
                }

                const metaRows = lockupMeta?.metadata?.contentMetadataViewModel?.metadataRows
                              || lockup.metadata?.contentMetadataViewModel?.metadataRows
                              || [];

                let channelName = null;
                let viewCount = null;
                let publishedTime = null;

                const allParts = [];
                for (const row of metaRows) {
                  for (const part of (row.metadataParts || [])) {
                    const txt = part.text?.content;
                    if (txt) allParts.push(txt);
                  }
                }

                for (const txt of allParts) {
                  if (/^\d+:\d+(:\d+)?$/.test(txt)) {
                    if (!duration) duration = txt;
                    continue;
                  }
                  if (/views?$/i.test(txt)) {
                    if (!viewCount) viewCount = txt;
                    continue;
                  }
                  if (/(ago|premiered|streamed)/i.test(txt)) {
                    if (!publishedTime) publishedTime = txt;
                    continue;
                  }
                  if (!channelName) channelName = txt;
                }

                if (!channelName) {
                  const acc = lockup.rendererContext?.accessibilityContext?.label;
                  if (acc) {
                    const m = acc.match(/\bby\s+(.+?)\s+\d/i);
                    if (m) channelName = m[1].trim();
                  }
                }

                let viewsAndDate = "";
                if (viewCount) viewsAndDate += viewCount;
                if (publishedTime) {
                  if (viewsAndDate) viewsAndDate += " • ";
                  viewsAndDate += publishedTime;
                }

                videos.push({
                  id,
                  title: String(title).trim(),
                  thumbnail: thumb,
                  avatar: null,
                  channelName,
                  duration,
                  viewCount,
                  publishedTime,
                  viewsAndDate
                });
              }
            }

            Object.values(obj).forEach(recurse);
          }
          recurse(data);
        }
      } catch (e) { console.error("JSON parse failed:", e); }

      if (videos.length === 0) {
        const seen = new Set();
        [...html.matchAll(/"videoId":"([a-zA-Z0-9_-]{11})"/g)].forEach(m => {
          if (!seen.has(m[1])) {
            seen.add(m[1]);
            let title = "Video (fallback)";
            const titleMatch = html.match(new RegExp(`"videoId":"${m[1]}"[\\s\\S]{0,800}?"title":\\s*(?:\\{\\s*"content":\\s*)?"([^"]+)"`));
            if (titleMatch) title = titleMatch[1];
            videos.push({
              id: m[1],
              title: title,
              thumbnail: `https://i.ytimg.com/vi/${m[1]}/hqdefault.jpg`,
              avatar: null,
              channelName: null,
              duration: null,
              viewCount: null,
              publishedTime: null,
              viewsAndDate: null
            });
          }
        });
      }
      const unique = [], seenIds = new Set();
      for (const v of videos) { if (!seenIds.has(v.id)) { seenIds.add(v.id); unique.push(v); } }
      return unique;
    }

    async function loadMoreVideos(channel) {
      const t = tabs[activeTabId];
      const s = t.channelStates[channel.id];
      if (!s.continuationToken || !s.apiKey || !s.proxy) return false;
      try {
        const url = `https://www.youtube.com/youtubei/v1/browse?key=${s.apiKey}`;
        const body = { context: { client: { clientName: "WEB", clientVersion: s.clientVersion || "2.20250301.01.00", hl: "en", gl: "US" } }, continuation: s.continuationToken };
        const res = await fetch(s.proxy + encodeURIComponent(url), { method: "POST", headers: { "Content-Type": "application/json", "Accept-Language": "en-US,en;q=0.9", "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" }, body: JSON.stringify(body) });
        if (!res.ok) return false;
        const data = await res.json();
        const newVideos = parseContinuationVideos(data);
        if (newVideos.length === 0) { s.continuationToken = null; return false; }
        const seen = new Set(t.allChannelVideos[channel.id].map(v => v.id));
        t.allChannelVideos[channel.id].push(...newVideos.filter(v => !seen.has(v.id)));
        s.continuationToken = data?.continuationContents?.gridContinuation?.continuations?.[0]?.nextContinuationData?.continuation || data?.onResponseReceivedActions?.[0]?.appendContinuationItemsAction?.continuationItems?.find(i => i.continuationItemRenderer)?.continuationItemRenderer?.continuationEndpoint?.continuationCommand?.token || null;

      } catch (e) { console.warn("Continuation error:", e); return false; }
    }

    function renderChannelVideos(channel) {
      const t = tabs[activeTabId];
      const grid = document.getElementById(`grid-${activeTabId}-${channel.id}`);
      if (!grid) return;
      grid.innerHTML = "";

      const raw = t.allChannelVideos[channel.id] || [];
      const seen = new Set();
      const videos = [];
      for (const v of raw) {
        if (!seen.has(v.id)) {
          seen.add(v.id);
          videos.push(v);
        }
      }
      t.allChannelVideos[channel.id] = videos;

      if (videos.length === 0) {
        grid.innerHTML = `<div class="loading-wrap" style="grid-column:1/-1;"><div style="color:#888;">No videos found</div></div>`;
        return;
      }

      let channelAvatar = channel.avatar || null;
      let channelName = channel.title || null;
      if (!channelAvatar || !channelName) {
        const known = defaultChannels.find(c => c.id === channel.id || c.url === channel.url);
        if (known) {
          if (!channelAvatar && known.avatar) channelAvatar = known.avatar;
          if (!channelName && known.title) channelName = known.title;
        }
      }

      videos.forEach(v => {
        if (!v.channelName && channelName) v.channelName = channelName;
        if (!v.avatar && channelAvatar) v.avatar = channelAvatar;
        grid.appendChild(createVideoCard(v, channelAvatar));
      });
    }

    function createVideoCard(video, channelAvatar=null) {
      const card = document.createElement("div");
      card.className = "video-card";

      const avatar = video.avatar || channelAvatar || null;
      const channelName = video.channelName || "Unknown Channel";

      const durationHtml = video.duration
        ? `<span class="video-duration">${escapeHtml(video.duration)}</span>`
        : "";

      let statsHtml = "";
      if (video.viewCount || video.publishedTime) {
        const parts = [];
        if (video.viewCount) parts.push(`<span>${escapeHtml(video.viewCount)}</span>`);
        if (video.publishedTime) parts.push(`<span>${escapeHtml(video.publishedTime)}</span>`);
        if (parts.length > 0) {
          statsHtml = `<div class="meta-stats">${parts.join('<span class="dot">•</span>')}</div>`;
        }
      } else if (video.viewsAndDate) {
        statsHtml = `<div class="meta-stats"><span>${escapeHtml(video.viewsAndDate)}</span></div>`;
      }

      const avatarHtml = avatar
        ? `<img class="meta-avatar" src="${escapeHtml(avatar)}" alt="" loading="lazy" onerror="this.style.display='none'">`
        : `<div class="meta-avatar" style="background:#ff0000;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;">${escapeHtml((channelName[0]||"?").toUpperCase())}</div>`;

      card.onclick = () => {
        playVideo(video.id, true, video.title, avatar);
      };

      card.innerHTML = `
        <div class="video-thumb">
          <img src="${video.thumbnail}" alt="${escapeHtml(video.title)}" loading="lazy"
               onerror="this.src='https://i.ytimg.com/vi/${video.id}/mqdefault.jpg'; this.onerror=null;">
          ${durationHtml}
        </div>
        <div class="video-info">${escapeHtml(video.title)}</div>
        <div class="video-meta">
          ${avatarHtml}
          <div class="meta-text">
            <div class="meta-channel">${escapeHtml(channelName)}</div>
            ${statsHtml}
          </div>
        </div>
      `;
      return card;
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;

    function toast(msg) {

    const ctxMenu = document.getElementById("context-menu");
    let ctxTarget = null;
    let ctxTargetType = null;

    function hideCtxMenu() {
      ctxMenu.style.display = "none";
      ctxTarget = null;
      ctxTargetType = null;
    }

    function showCtxMenu(x, y, type, target) {
      ctxTarget = target;
      ctxTargetType = type;
      ctxMenu.querySelectorAll(".ctx-item").forEach(item => item.classList.add("hidden"));

      if (type === "bookmark") {
        ctxMenu.querySelector('[data-action="delete"]').classList.remove("hidden");
        ctxMenu.querySelector('[data-action="rename"]').classList.remove("hidden");
      } else if (type === "video") {
        ctxMenu.querySelector('[data-action="bookmark"]').classList.remove("hidden");
      } else if (type === "tab") {
        ctxMenu.querySelector('[data-action="bookmark"]').classList.remove("hidden");
        const tabId = parseInt(target.id.replace("tab-", ""));
        const t = tabs[tabId];
        if (t && t.muted) {
          ctxMenu.querySelector('[data-action="unmute"]').classList.remove("hidden");
        } else {
          ctxMenu.querySelector('[data-action="mute"]').classList.remove("hidden");
        }
      }

      const rect = ctxMenu.getBoundingClientRect();
      let px = x, py = y;
      if (px + rect.width > window.innerWidth) px = window.innerWidth - rect.width - 8;
      if (py + rect.height > window.innerHeight) py = window.innerHeight - rect.height - 8;
      ctxMenu.style.left = px + "px";
      ctxMenu.style.top = py + "px";
      ctxMenu.style.display = "block";
    }

    document.addEventListener("contextmenu", e => {
      const bmItem = e.target.closest(".bm-bar-item");
      if (bmItem) {
        e.preventDefault();
        showCtxMenu(e.clientX, e.clientY, "bookmark", bmItem);
        return;
      }

      const videoCard = e.target.closest(".video-card");
      if (videoCard) {
        e.preventDefault();
        showCtxMenu(e.clientX, e.clientY, "video", videoCard);
        return;
      }

      const tabEl = e.target.closest(".chrome-tab");
      if (tabEl) {
        e.preventDefault();
        showCtxMenu(e.clientX, e.clientY, "tab", tabEl);
        return;
      }

      e.preventDefault();
      hideCtxMenu();
    });

    document.addEventListener("click", () => hideCtxMenu());
    document.addEventListener("scroll", () => hideCtxMenu(), true);

    ctxMenu.addEventListener("click", e => {
      const item = e.target.closest(".ctx-item");
      if (!item) return;
      e.stopPropagation();
      const action = item.dataset.action;

      if (action === "delete" && ctxTargetType === "bookmark") {
        const delBtn = ctxTarget.querySelector(".bm-del");
        if (delBtn) delBtn.click();
      }
      else if (action === "rename" && ctxTargetType === "bookmark") {
        const bms = getBookmarks();
        const idx = [...document.querySelectorAll(".bm-bar-item")].indexOf(ctxTarget);
        if (idx >= 0 && idx < bms.length && bms[idx].deletable !== false) {
          const newName = prompt("Rename bookmark:", bms[idx].name);
          if (newName && newName.trim()) {
            bms[idx].name = newName.trim();
            saveBookmarks(bms);
            toast("Renamed to: " + newName.trim());
          }
        } else {
          toast("Cannot rename this bookmark");
        }
      }
      else if (action === "bookmark" && ctxTargetType === "video") {
        const titleEl = ctxTarget.querySelector(".video-info");
        const imgEl = ctxTarget.querySelector("img");
        let videoId = "";
        if (imgEl && imgEl.src) {
          const m = imgEl.src.match(/\/vi\/([a-zA-Z0-9_-]{11})\//);
          if (m) videoId = m[1];
        }
        if (videoId) {
          addBookmark(titleEl?.textContent?.trim() || "Video " + videoId, "video", { videoId });
        }
      }
      else if (action === "bookmark" && ctxTargetType === "tab") {
        const tabId = parseInt(ctxTarget.id.replace("tab-", ""));
        const t = tabs[tabId];
        if (t && t.currentVideoId) {
          addBookmark(t.currentVideoTitle || "Video " + t.currentVideoId, "video", { videoId: t.currentVideoId });
        } else if (t && t.currentChannels.length > 0) {
          bookmarkCurrentChannels(t.currentBrowseTitle || "Channel", t.currentChannels);
        } else {
          toast("Nothing to bookmark");
        }
      }
      else if ((action === "mute" || action === "unmute") && ctxTargetType === "tab") {
        const tabId = parseInt(ctxTarget.id.replace("tab-", ""));
        const t = tabs[tabId];
        if (!t) { hideCtxMenu(); return; }
        if (t) {
          t.muted = !t.muted;
          const muted = t.muted;
          const span = ctxTarget.querySelector("span:not(.tab-favicon)");
          if (span) {
            const baseText = span.textContent.replace(" 🔇", "").replace(" ▶", "");
            if (muted && baseText !== "New Tab") {
              span.textContent = baseText + " 🔇";
            } else {
              span.textContent = baseText;
            }
          }
          toast(muted ? "Tab muted" : "Tab unmuted");
        }
      }

      hideCtxMenu();
    });

    document.addEventListener("keydown", e => {
      if (e.ctrlKey && e.key === "t") { e.preventDefault(); newTab(); }
      if (e.ctrlKey && e.key === "w") { e.preventDefault(); closeTab(activeTabId); }
      if (e.ctrlKey && e.key === "l") {
        e.preventDefault();
        document.getElementById("omnibox-input").focus();
        document.getElementById("omnibox-input").select();
      }
      if (e.ctrlKey && e.key === "d") { e.preventDefault(); starCurrent(); }
      if (e.altKey && e.key === "ArrowLeft") { e.preventDefault(); goBack(); }
      if (e.altKey && e.key === "ArrowRight") { e.preventDefault(); goForward(); }
      if (e.key === "Escape") { goHome(); }
      if (e.key === "F11") { e.preventDefault(); toggleFullscreen(); }
    });

    document.addEventListener("keypress", e => {
      if (e.key === "Enter") {
        const target = e.target;
        if (target && target.classList && target.classList.contains("home-input")) {
          e.preventDefault();
          const input = target.value.trim();
          if (input) handleInput(input);
        }
      }
    });

    ensureDefaultBookmark();
    renderBookmarksBar();
    pushNav("home");

    const bms = getBookmarks();
    const firstCollection = bms.find(b => b.type === "collection");
    if (firstCollection) {
      preloadChannels(firstCollection.channels);
    }

    document.getElementById("chrome-titlebar").addEventListener("mouseleave", () => {
      clearTimeout(tabResizeTimer);
      unfreezeTabWidths();
    });
  </script>
  
</body>
</html>
