<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spotify — Music</title>
  <link rel="icon" href="https://open.spotifycdn.com/cdn/images/favicon32.b64ecc03.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #000;
      --bg-elevated: #121212;
      --bg-highlight: #1a1a1a;
      --bg-tinted: #2a2a2a;
      --text: #fff;
      --text-sub: #b3b3b3;
      --text-muted: #6a6a6a;
      --green: #1ed760;
      --green-hover: #1fdf64;
      --border: #282828;
      --player-h: 90px;
      --sidebar-w: 280px;
      --radius-pill: 500px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    input { font-family: inherit; }

    #app {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      grid-template-rows: 1fr var(--player-h);
      height: 100vh;
      gap: 8px;
      padding: 8px;
      background: #000;
      position: relative;
      z-index: 1;
    }

    /* SIDEBAR */
    #sidebar {
      grid-row: 1;
      background: var(--bg-elevated);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }
    .sidebar-top { padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 4px; }
    .nav-item {
      display: flex; align-items: center; gap: 16px;
      padding: 10px 12px; border-radius: 6px;
      color: var(--text-sub); font-weight: 700; font-size: 0.95rem;
      transition: color 0.15s;
    }
    .nav-item:hover, .nav-item.active { color: var(--text); }
    .nav-item svg { width: 24px; height: 24px; flex-shrink: 0; }

    .sidebar-library {
      flex: 1; min-height: 0; display: flex; flex-direction: column;
      margin-top: 8px; overflow: hidden;
    }
    .lib-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; color: var(--text-sub); font-weight: 700; font-size: 0.95rem;
    }
    .lib-header:hover { color: var(--text); }
    .lib-header button {
      width: 32px; height: 32px; border-radius: 50%;
      display: grid; place-items: center; color: var(--text-sub);
    }
    .lib-header button:hover { color: var(--text); background: var(--bg-tinted); }
    .lib-header svg { width: 18px; height: 18px; }
    .lib-filters { display: flex; gap: 8px; padding: 0 16px 12px; flex-wrap: wrap; }
    .chip {
      padding: 6px 12px; border-radius: var(--radius-pill);
      background: var(--bg-tinted); color: var(--text); font-size: 0.8rem; font-weight: 500;
    }
    .chip.active { background: var(--text); color: #000; }
    .lib-list { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
    .lib-item {
      display: flex; align-items: center; gap: 12px;
      padding: 8px; border-radius: 6px; cursor: pointer; transition: background 0.12s;
    }
    .lib-item:hover { background: var(--bg-highlight); }
    .lib-item.active { background: var(--bg-tinted); }
    .lib-item img, .lib-item .lib-cover {
      width: 48px; height: 48px; border-radius: 4px;
      object-fit: cover; background: var(--bg-tinted); flex-shrink: 0;
    }
    .lib-item .lib-cover { display: grid; place-items: center; color: var(--text-sub); }
    .lib-item .lib-cover.liked {
      background: linear-gradient(135deg, #450af5, #c4efd9); color: #fff;
    }
    .lib-item .lib-cover svg { width: 22px; height: 22px; }
    .lib-item .lib-meta { min-width: 0; flex: 1; }
    .lib-item .lib-title {
      font-size: 0.9rem; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .lib-item .lib-sub {
      font-size: 0.8rem; color: var(--text-sub);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px;
    }

    /* MAIN */
    #main {
      grid-row: 1; background: var(--bg-elevated); border-radius: 12px;
      display: flex; flex-direction: column; overflow: hidden; min-height: 0;
    }
    .main-topbar {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 24px; z-index: 10;
    }
    .nav-arrows { display: flex; gap: 8px; }
    .nav-arrow {
      width: 32px; height: 32px; border-radius: 50%;
      background: rgba(0,0,0,0.7); display: grid; place-items: center; color: var(--text-sub);
    }
    .nav-arrow:hover:not(:disabled) { color: var(--text); }
    .nav-arrow:disabled { opacity: 0.4; cursor: default; }
    .nav-arrow svg { width: 16px; height: 16px; }
    .search-box {
      flex: 1; max-width: 364px; display: flex; align-items: center; gap: 10px;
      background: #fff; border-radius: var(--radius-pill); padding: 0 14px; height: 48px; color: #000;
    }
    .search-box svg { width: 20px; height: 20px; color: #121212; flex-shrink: 0; }
    .search-box input {
      flex: 1; border: none; outline: none; background: transparent;
      font-size: 0.9rem; color: #000; font-weight: 500;
    }
    .search-box input::placeholder { color: #6a6a6a; }
    .user-pill {
      margin-left: auto; display: flex; align-items: center; gap: 8px;
      background: rgba(0,0,0,0.7); padding: 4px 12px 4px 4px;
      border-radius: var(--radius-pill); font-size: 0.85rem; font-weight: 700;
    }
    .user-pill .avatar {
      width: 28px; height: 28px; border-radius: 50%; background: #535353;
      display: grid; place-items: center; font-size: 0.75rem;
    }
    .main-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 0 24px 24px; }

    .page-header {
      margin: 0 -24px 24px; padding: 24px 24px 20px;
      background: linear-gradient(180deg, #404040 0%, var(--bg-elevated) 100%);
      display: flex; align-items: flex-end; gap: 24px; min-height: 200px;
    }
    .page-header.home-header {
      flex-direction: column; align-items: flex-start; justify-content: flex-end;
      min-height: 140px;
      background: linear-gradient(180deg, #1e3a2f 0%, var(--bg-elevated) 100%);
    }
    .page-header .cover-xl {
      width: 192px; height: 192px; border-radius: 4px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5); object-fit: cover;
      background: var(--bg-tinted); flex-shrink: 0;
    }
    .page-header .cover-xl.liked {
      background: linear-gradient(135deg, #450af5, #c4efd9);
      display: grid; place-items: center;
    }
    .page-header .cover-xl.liked svg { width: 64px; height: 64px; color: #fff; }
    .page-header .ph-type {
      font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.05em; margin-bottom: 8px;
    }
    .page-header .ph-title {
      font-size: clamp(2rem, 5vw, 4.5rem); font-weight: 900; line-height: 1.1;
      letter-spacing: -0.04em; margin-bottom: 12px;
    }
    .page-header .ph-sub {
      font-size: 0.9rem; color: var(--text-sub);
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    }
    .page-header .ph-sub strong { color: var(--text); }

    .section-title {
      font-size: 1.4rem; font-weight: 700; margin: 28px 0 16px;
    }
    .card-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 24px;
    }
    .card {
      background: var(--bg-highlight); border-radius: 8px; padding: 12px;
      cursor: pointer; transition: background 0.2s; position: relative;
    }
    .card:hover { background: #282828; }
    .card:hover .card-play { opacity: 1; transform: translateY(0); }
    .card-img-wrap {
      position: relative; width: 100%; aspect-ratio: 1; margin-bottom: 12px;
      border-radius: 6px; overflow: hidden; background: var(--bg-tinted);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .card-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-play {
      position: absolute; bottom: 8px; right: 8px;
      width: 48px; height: 48px; border-radius: 50%;
      background: var(--green); color: #000;
      display: grid; place-items: center;
      box-shadow: 0 8px 16px rgba(0,0,0,0.4);
      opacity: 0; transform: translateY(8px);
      transition: opacity 0.2s, transform 0.2s, background 0.15s;
    }
    .card-play:hover { background: var(--green-hover); transform: scale(1.06) translateY(0); }
    .card-play svg { width: 22px; height: 22px; margin-left: 2px; }
    .card-title {
      font-size: 0.95rem; font-weight: 700;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px;
    }
    .card-sub {
      font-size: 0.82rem; color: var(--text-sub);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden; line-height: 1.35;
    }

    .track-list-header {
      display: grid; grid-template-columns: 40px 1fr 1fr 80px 48px; gap: 12px;
      padding: 0 12px 8px; border-bottom: 1px solid var(--border); margin-bottom: 8px;
      font-size: 0.75rem; font-weight: 500; color: var(--text-sub);
      text-transform: uppercase; letter-spacing: 0.06em;
    }
    .track-row {
      display: grid; grid-template-columns: 40px 1fr 1fr 80px 48px; gap: 12px;
      align-items: center; padding: 8px 12px; border-radius: 4px;
      color: var(--text-sub); font-size: 0.9rem;
      border-left: 3px solid transparent;
      transition: background 0.12s, border-color 0.12s;
    }
    .track-row:hover { background: rgba(255,255,255,0.08); }
    .track-row.playing {
      background: rgba(30, 215, 96, 0.12);
      border-left-color: var(--green);
    }
    .track-row.playing:hover {
      background: rgba(30, 215, 96, 0.18);
    }
    .track-row.playing .track-title { color: var(--green); }
    .track-row.playing .idx { color: var(--green); }
    .track-row .idx { text-align: center; font-variant-numeric: tabular-nums; }
    .track-row:hover .idx span { display: none; }
    .track-row.playing .idx span { display: none; }
    .track-row .idx .play-mini { display: none; width: 100%; justify-content: center; }
    .track-row:hover .idx .play-mini,
    .track-row.playing .idx .play-mini { display: flex; }
    .track-row .play-mini svg { width: 14px; height: 14px; color: var(--text); }
    .track-row.playing .play-mini svg { color: var(--green); }
    .card.playing {
      background: rgba(30, 215, 96, 0.12);
      outline: 1px solid rgba(30, 215, 96, 0.35);
    }
    .card.playing .card-title { color: var(--green); }
    .track-info { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .track-info img {
      width: 40px; height: 40px; border-radius: 4px; object-fit: cover;
      flex-shrink: 0; background: var(--bg-tinted);
    }
    .track-title {
      color: var(--text); font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .track-artist {
      font-size: 0.82rem; color: var(--text-sub);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .track-album { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-dur { text-align: right; font-variant-numeric: tabular-nums; }
    .track-actions { display: flex; justify-content: flex-end; gap: 4px; opacity: 0; }
    .track-row:hover .track-actions, .track-row.playing .track-actions { opacity: 1; }
    .track-actions button {
      width: 32px; height: 32px; border-radius: 50%;
      display: grid; place-items: center; color: var(--text-sub);
    }
    .track-actions button:hover { color: var(--text); }
    .track-actions button.liked { color: var(--green); }
    .track-actions svg { width: 16px; height: 16px; }

    .action-bar { display: flex; align-items: center; gap: 16px; margin: 20px 0 16px; }
    .btn-play-lg {
      width: 56px; height: 56px; border-radius: 50%;
      background: var(--green); color: #000;
      display: grid; place-items: center;
      transition: transform 0.15s, background 0.15s;
    }
    .btn-play-lg:hover { background: var(--green-hover); transform: scale(1.06); }
    .btn-play-lg:disabled { opacity: 0.4; cursor: default; transform: none; }
    .btn-play-lg svg { width: 26px; height: 26px; margin-left: 2px; }
    .btn-icon {
      width: 36px; height: 36px; border-radius: 50%;
      display: grid; place-items: center; color: var(--text-sub);
    }
    .btn-icon:hover { color: var(--text); }
    .btn-icon svg { width: 24px; height: 24px; }

    /* PLAYER */
    #player {
      grid-column: 1 / -1; background: #181818;
      display: grid; grid-template-columns: 1fr 1.2fr 1fr;
      align-items: center; padding: 0 16px; gap: 16px; height: var(--player-h);
      border-top: 1px solid #282828;
    }
    .player-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .player-cover {
      width: 56px; height: 56px; border-radius: 4px; object-fit: cover;
      background: var(--bg-tinted); flex-shrink: 0; box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    .player-meta { min-width: 0; }
    .player-title {
      font-size: 0.88rem; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .player-artist {
      font-size: 0.75rem; color: var(--text-sub);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px;
    }
    .player-like {
      width: 32px; height: 32px; border-radius: 50%;
      display: grid; place-items: center; color: var(--text-sub); flex-shrink: 0;
    }
    .player-like:hover { color: var(--text); }
    .player-like.liked { color: var(--green); }
    .player-like svg { width: 16px; height: 16px; }

    .player-center { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .player-controls { display: flex; align-items: center; gap: 12px; }
    .ctrl-btn {
      width: 32px; height: 32px; border-radius: 50%;
      display: grid; place-items: center; color: var(--text-sub);
    }
    .ctrl-btn:hover { color: var(--text); }
    .ctrl-btn.active { color: var(--green); }
    .ctrl-btn svg { width: 16px; height: 16px; }
    .ctrl-play {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--text); color: #000;
      display: grid; place-items: center; transition: transform 0.1s;
    }
    .ctrl-play:hover { transform: scale(1.06); }
    .ctrl-play svg { width: 16px; height: 16px; }
    .player-progress {
      display: flex; align-items: center; gap: 8px;
      width: 100%; max-width: 560px;
      font-size: 0.7rem; color: var(--text-sub); font-variant-numeric: tabular-nums;
    }
    .progress-bar {
      flex: 1; height: 4px; background: #4d4d4d; border-radius: 2px; cursor: pointer;
    }
    .progress-bar:hover { height: 6px; }
    .progress-fill { height: 100%; background: var(--text); border-radius: 2px; width: 0%; }
    .progress-bar:hover .progress-fill { background: var(--green); }

    .player-right { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
    .vol-wrap { display: flex; align-items: center; gap: 6px; width: 140px; }
    .vol-wrap svg { width: 16px; height: 16px; color: var(--text-sub); flex-shrink: 0; }
    .vol-bar { flex: 1; height: 4px; background: #4d4d4d; border-radius: 2px; cursor: pointer; }
    .vol-bar:hover { height: 6px; }
    .vol-fill { height: 100%; background: var(--text); border-radius: 2px; width: 80%; }
    .vol-bar:hover .vol-fill { background: var(--green); }

    /* YT player under the app chrome — user never sees video frames */
    #yt-host {
      position: fixed;
      width: 480px;
      height: 270px;
      right: 0;
      bottom: 90px;
      opacity: 0.01;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
      border: none;
    }
    #yt-host iframe {
      width: 480px !important;
      height: 270px !important;
      border: none !important;
      pointer-events: none !important;
    }

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      z-index: 1000; display: none; align-items: center; justify-content: center;
    }
    .modal-backdrop.show { display: flex; }
    .modal {
      background: #282828; border-radius: 8px; padding: 24px;
      width: 90%; max-width: 420px; box-shadow: 0 16px 48px rgba(0,0,0,0.6);
    }
    .modal h2 { font-size: 1.25rem; margin-bottom: 16px; }
    .modal input {
      width: 100%; padding: 12px 14px; border-radius: 4px; border: none;
      background: #3e3e3e; color: var(--text); font-size: 0.95rem; outline: none; margin-bottom: 16px;
    }
    .modal input:focus { outline: 2px solid var(--text); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 12px; }
    .modal-actions .btn-cancel { padding: 10px 20px; font-weight: 700; color: var(--text-sub); }
    .modal-actions .btn-cancel:hover { color: var(--text); }
    .modal-actions .btn-ok {
      padding: 10px 24px; border-radius: var(--radius-pill);
      background: var(--text); color: #000; font-weight: 700;
    }

    #ctx {
      position: fixed; z-index: 2000; background: #282828; border-radius: 4px;
      padding: 4px; min-width: 200px; box-shadow: 0 16px 24px rgba(0,0,0,0.5); display: none;
    }
    #ctx.show { display: block; }
    .ctx-item {
      padding: 10px 12px; border-radius: 2px; font-size: 0.88rem; color: var(--text);
      cursor: pointer; display: flex; align-items: center; gap: 10px;
    }
    .ctx-item:hover { background: #3e3e3e; }
    .ctx-item.danger { color: #f15e6c; }
    .ctx-sep { height: 1px; background: #3e3e3e; margin: 4px 0; }

    #toast {
      position: fixed; bottom: calc(var(--player-h) + 16px); left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--green); color: #000; padding: 10px 20px; border-radius: 8px;
      font-weight: 600; font-size: 0.9rem; opacity: 0; pointer-events: none;
      transition: opacity 0.25s, transform 0.25s; z-index: 3000;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .empty-state { text-align: center; padding: 64px 24px; color: var(--text-sub); }
    .empty-state h3 { color: var(--text); font-size: 1.4rem; margin-bottom: 8px; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,255,255,0.15); border-top-color: var(--green);
      border-radius: 50%; animation: spin 0.8s linear infinite; margin: 40px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-inline {
      display: flex; align-items: center; justify-content: center;
      gap: 12px; padding: 40px; color: var(--text-sub);
    }

    ::-webkit-scrollbar { width: 12px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: #ffffff4d; border: 3px solid transparent; background-clip: padding-box;
    }

    @media (max-width: 900px) {
      :root { --sidebar-w: 72px; }
      .nav-item span, .lib-header span, .lib-item .lib-meta, .lib-filters { display: none; }
      .nav-item { justify-content: center; padding: 12px; }
      .lib-item { justify-content: center; }
      #player { grid-template-columns: 1fr auto; }
      .player-center, .player-right { display: none; }
    }
  </style>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-top">
        <button class="nav-item active" data-view="home" onclick="navigate('home')">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.5 1.515a3 3 0 0 0-3 0L3 5.845a2 2 0 0 0-1 1.732V21a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-6h4v6a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V7.577a2 2 0 0 0-1-1.732l-7.5-4.33z"/></svg>
          <span>Home</span>
        </button>
        <button class="nav-item" data-view="search" onclick="navigate('search')">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10.533 1.279c-5.18 0-9.407 4.14-9.407 9.279s4.226 9.279 9.407 9.279c2.234 0 4.29-.77 5.907-2.058l4.353 4.353a1 1 0 1 0 1.414-1.414l-4.344-4.344a9.157 9.157 0 0 0 2.077-5.816c0-5.14-4.226-9.28-9.407-9.28zm-7.407 9.279c0-4.006 3.302-7.28 7.407-7.28s7.407 3.274 7.407 7.28-3.302 7.279-7.407 7.279-7.407-3.273-7.407-7.28z"/></svg>
          <span>Search</span>
        </button>
      </div>
      <div class="sidebar-library">
        <div class="lib-header">
          <span style="display:flex;align-items:center;gap:12px;">
            <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M3 22a1 1 0 0 1-1-1V3a1 1 0 0 1 2 0v18a1 1 0 0 1-1 1zM15.5 2.134A1 1 0 0 0 14 3v18a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V6.464a1 1 0 0 0-.5-.866l-6-3.464zM9 2a1 1 0 0 0-1 1v18a1 1 0 1 0 2 0V3a1 1 0 0 0-1-1z"/></svg>
            Your Library
          </span>
          <div class="lib-actions">
            <button title="Create playlist" onclick="openCreatePlaylist()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>
        </div>
        <div class="lib-filters">

  <div id="ctx"></div>
  <div id="toast"></div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    const proxies = [
      "https://cors-proxy.yangxiaoke.workers.dev/?url=",
      "https://api.allorigins.win/raw?url=",
      "https://api.codetabs.com/v1/proxy?quest="
    ];
    const LS_LIKED = "sp_liked", LS_PLAYLISTS = "sp_playlists", LS_RECENT = "sp_recent", LS_VOLUME = "sp_volume";

    let ytPlayer = null, ytReady = false, currentTrack = null;
    let queue = [], queueIndex = -1, isPlaying = false, shuffle = false, repeat = 1; 
    let volume = parseFloat(localStorage.getItem(LS_VOLUME) || "0.8");
    let progressTimer = null, navHistory = [], navIndex = -1, currentView = "home", libFilter = "all";
    let searchResults = [], ctxTrack = null, pendingAddTrack = null;

    const trackById = Object.create(null);
    let listByKey = Object.create(null);
    let listKeySeq = 0;
    let skipTimer = null;
    let consecutiveErrors = 0;
    let loadGen = 0; 

    function rememberTrack(t) {
      if (t && t.id) trackById[t.id] = Object.assign({}, trackById[t.id] || {}, t);
      return t && t.id;
    }
    function rememberList(list) {
      if (!list || !list.length) return null;
      list.forEach(rememberTrack);
      const key = "L" + (++listKeySeq);
      listByKey[key] = list.slice();
      return key;
    }
    function getTrack(id) { return trackById[id] || null; }

    function getLiked() { try { return JSON.parse(localStorage.getItem(LS_LIKED)) || []; } catch { return []; } }
    function saveLiked(arr) { localStorage.setItem(LS_LIKED, JSON.stringify(arr)); }
    function isLiked(id) { return getLiked().some(t => t.id === id); }
    function getPlaylists() { try { return JSON.parse(localStorage.getItem(LS_PLAYLISTS)) || []; } catch { return []; } }
    function savePlaylists(arr) { localStorage.setItem(LS_PLAYLISTS, JSON.stringify(arr)); }
    function getRecent() { try { return JSON.parse(localStorage.getItem(LS_RECENT)) || []; } catch { return []; } }
    function pushRecent(track) {
      let r = getRecent().filter(t => t.id !== track.id);
      r.unshift({ id: track.id, title: track.title, channelName: track.channelName, thumbnail: track.thumbnail, duration: track.duration });
      if (r.length > 30) r = r.slice(0, 30);
      localStorage.setItem(LS_RECENT, JSON.stringify(r));
    }

    let pendingPlay = null;
    let currentVideoId = null;
    let intentionalPause = false;
    let playbackEnded = false;
    let progressSec = 0;
    let progressDur = 0;
    let progressTickStart = 0;
    let embedHostIndex = 0;
    const EMBED_HOSTS = [
      "https://www.youtube.com",
      "https://www.youtube-nocookie.com"
    ];

    function getFrame() {
      var f = document.getElementById("yt-frame");
      if (!f) {
        var host = document.getElementById("yt-host");
        if (host) {
          host.innerHTML = '<iframe id="yt-frame" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" title="player"></iframe>';
          f = document.getElementById("yt-frame");
        }
      }
      return f;
    }

    function embedUrl(videoId, autoplay, startSec) {
      var host = EMBED_HOSTS[embedHostIndex % EMBED_HOSTS.length];
      var q = [
        "autoplay=" + (autoplay ? "1" : "0"),
        "controls=0",
        "disablekb=1",
        "fs=0",
        "modestbranding=1",
        "rel=0",
        "playsinline=1",
        "iv_load_policy=3",
        "cc_load_policy=0",
        "enablejsapi=1"
      ];
      if (startSec && startSec > 0) q.push("start=" + Math.floor(startSec));

      if (location.protocol === "http:" || location.protocol === "https:") {
        try { q.push("origin=" + encodeURIComponent(location.origin)); } catch (e) {}
      }
      return host + "/embed/" + videoId + "?" + q.join("&");
    }

    function ytCommand(func, args) {
      try {
        var f = getFrame();
        if (!f || !f.contentWindow) return;
        f.contentWindow.postMessage(JSON.stringify({
          event: "command",
          func: func,
          args: args || []
        }), "*");
      } catch (e) {}
    }

    window.addEventListener("message", function(ev) {
      if (!ev.data) return;
      var data = ev.data;
      try { if (typeof data === "string") data = JSON.parse(data); } catch (e) { return; }
      if (!data || data.event !== "infoDelivery" && data.event !== "onStateChange") {

      }
      if (data && data.event === "infoDelivery" && data.info) {
        var info = data.info;
        if (typeof info.duration === "number" && info.duration > 0) {
          progressDur = info.duration;
        }
        if (typeof info.currentTime === "number") {
          progressSec = info.currentTime;
          window._progressBase = info.currentTime;
          progressTickStart = Date.now();
          updateProgressUI();
        }
        if (typeof info.playerState === "number") {
          handlePlayerState(info.playerState);
        }
      }
      if (data && data.event === "onStateChange" && typeof data.info === "number") {
        handlePlayerState(data.info);
      }
    });

    function handlePlayerState(state) {

      if (state === 1) {
        isPlaying = true;
        intentionalPause = false;
        playbackEnded = false;
        consecutiveErrors = 0;
        window._progressBase = progressSec || 0;
        progressTickStart = Date.now();
        updatePlayIcon();
        startRealProgress();
        highlightNowPlaying();
      } else if (state === 2) {
        isPlaying = false;
        updatePlayIcon();
        stopRealProgress();

        progressTickStart = 0;
      } else if (state === 0) {
        isPlaying = false;
        playbackEnded = true;
        updatePlayIcon();
        stopRealProgress();
        progressSec = progressDur || progressSec;
        updateProgressUI();
        if (!intentionalPause) onTrackEnded();
      }
    }

    function updateProgressUI() {
      document.getElementById("time-cur").textContent = fmtTime(progressSec);
      document.getElementById("time-total").textContent = fmtTime(progressDur);
      document.getElementById("progress-fill").style.width =
        (progressDur > 0 ? Math.min(100, (progressSec / progressDur) * 100) : 0) + "%";
    }

    function startRealProgress() {
      stopRealProgress();
      if (typeof window._progressBase !== "number") window._progressBase = progressSec || 0;
      progressTickStart = Date.now();

      progressTimer = setInterval(function() {
        if (!isPlaying || !progressTickStart) return;
        var base = (typeof window._progressBase === "number") ? window._progressBase : 0;
        var start = progressTickStart;
        progressSec = base + (Date.now() - start) / 1000;
        if (progressDur > 0 && progressSec >= progressDur - 0.25) {
          progressSec = progressDur;
          updateProgressUI();
          if (!playbackEnded) {
            playbackEnded = true;
            isPlaying = false;
            updatePlayIcon();
            stopRealProgress();
            onTrackEnded();
          }
          return;
        }
        updateProgressUI();

        ytCommand("getCurrentTime");
        ytCommand("getDuration");
        try {
          var f = getFrame();
          if (f && f.contentWindow) {
            f.contentWindow.postMessage(JSON.stringify({ event: "listening", id: currentVideoId || "1" }), "*");
          }
        } catch (e) {}
      }, 1000);
    }
    function stopRealProgress() {
      if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
      window._progressBase = progressSec || 0;
      progressTickStart = 0;
    }
    function startProgress() { startRealProgress(); }
    function stopProgress() { stopRealProgress(); }

    window.onYouTubeIframeAPIReady = function() {  };

    function parseDurationToSec(d) {
      if (!d || typeof d !== "string") return 0;
      var p = d.trim().split(":").map(Number);
      if (p.some(isNaN)) return 0;
      if (p.length === 3) return p[0] * 3600 + p[1] * 60 + p[2];
      if (p.length === 2) return p[0] * 60 + p[1];
      return p[0] || 0;
    }

    function loadTrack(track, autoplay) {
      if (autoplay === undefined) autoplay = true;
      if (!track || !track.id) return;
      rememberTrack(track);
      currentTrack = track;
      currentVideoId = track.id;
      pushRecent(track);
      updateNowPlayingUI();
      renderLibrary();
      if (skipTimer) { clearTimeout(skipTimer); skipTimer = null; }
      loadGen++;
      intentionalPause = false;
      consecutiveErrors = 0;
      embedHostIndex = 0;

      progressSec = 0;
      window._progressBase = 0;
      progressTickStart = 0;
      progressDur = parseDurationToSec(track.duration) || 0;
      playbackEnded = false;
      intentionalPause = false;
      isPlaying = false;
      stopRealProgress();
      updateProgressUI();
      updatePlayIcon();
      highlightNowPlaying();

      var frame = getFrame();
      if (!frame) {
        toast("Player missing");
        return;
      }

      var gen = loadGen;
      var url = embedUrl(track.id, autoplay, 0);

      try { frame.src = "about:blank"; } catch (e) {}
      setTimeout(function() {
        if (gen !== loadGen) return;
        frame.src = url;

        if (autoplay) {
          setTimeout(function() {
            if (gen !== loadGen) return;
            playbackEnded = false;
            progressSec = 0;
            window._progressBase = 0;
            progressTickStart = 0;
            updateProgressUI();
            updatePlayIcon();
            ytCommand("playVideo");
            ytCommand("unMute");
            try { ytCommand("setVolume", [Math.round(volume * 100)]); } catch (e) {}
            highlightNowPlaying();
          }, 400);
        } else {
          isPlaying = false;
          updatePlayIcon();
          highlightNowPlaying();
        }
      }, 40);
    }

    function playTrack(track, list, index) {
      if (!track) return;
      consecutiveErrors = 0;
      if (skipTimer) { clearTimeout(skipTimer); skipTimer = null; }
      rememberTrack(track);
      if (list && list.length) {
        list.forEach(rememberTrack);
        queue = list.slice();
        queueIndex = (typeof index === "number" && index >= 0) ? index : list.findIndex(function(t) { return t.id === track.id; });
        if (queueIndex < 0) queueIndex = 0;
      } else {
        queue = [track];
        queueIndex = 0;
      }
      loadTrack(queue[queueIndex], true);
    }

    function togglePlay() {
      if (!currentTrack) return;
      if (isPlaying) {
        intentionalPause = true;
        isPlaying = false;
        updatePlayIcon();
        stopRealProgress();
        ytCommand("pauseVideo");
        return;
      }

      intentionalPause = false;
      if (playbackEnded || !currentVideoId || currentVideoId !== currentTrack.id) {

        loadTrack(currentTrack, true);
        return;
      }
      ytCommand("playVideo");
      isPlaying = true;
      playbackEnded = false;
      window._progressBase = progressSec || 0;
      progressTickStart = Date.now();
      updatePlayIcon();
      startRealProgress();
    }
    function playNext() {
      if (!queue.length) return;
      consecutiveErrors = 0;
      intentionalPause = false;
      playbackEnded = false;
      if (skipTimer) { clearTimeout(skipTimer); skipTimer = null; }

      if (repeat === 2) {
        loadTrack(queue[queueIndex], true);
        return;
      }
      if (shuffle) {
        if (queue.length === 1) {
          loadTrack(queue[0], true);
          return;
        }
        var next = queueIndex;
        var guard = 0;
        while (next === queueIndex && guard++ < 20) {
          next = Math.floor(Math.random() * queue.length);
        }
        queueIndex = next;
      } else {

        queueIndex = (queueIndex + 1) % queue.length;
      }
      loadTrack(queue[queueIndex], true);
    }
    function playPrev() {
      if (!queue.length) return;
      consecutiveErrors = 0;
      intentionalPause = false;
      playbackEnded = false;
      if (skipTimer) { clearTimeout(skipTimer); skipTimer = null; }

      if (progressSec > 3) {
        progressSec = 0;
        window._progressBase = 0;
        progressTickStart = Date.now();
        loadTrack(queue[queueIndex], true);
        return;
      }
      if (shuffle) {
        if (queue.length === 1) {
          loadTrack(queue[0], true);
          return;
        }
        var prev = queueIndex;
        var guard = 0;
        while (prev === queueIndex && guard++ < 20) {
          prev = Math.floor(Math.random() * queue.length);
        }
        queueIndex = prev;
      } else {

        queueIndex = (queueIndex - 1 + queue.length) % queue.length;
      }
      loadTrack(queue[queueIndex], true);
    }
    function onTrackEnded() {
      if (intentionalPause) return;

      if (repeat === 2) {
        loadTrack(queue[queueIndex], true);
      } else {
        playNext();
      }
    }
    function toggleShuffle() {
      shuffle = !shuffle;
      document.getElementById("btn-shuffle").classList.toggle("active", shuffle);
    }
    function toggleRepeat() {
      repeat = (repeat + 1) % 3;
      const btn = document.getElementById("btn-repeat");
      btn.classList.toggle("active", repeat > 0);
      btn.title = repeat === 0 ? "Repeat" : repeat === 1 ? "Repeat all" : "Repeat one";
    }
    function seekBar(e) {
      if (!currentTrack) return;
      const bar = document.getElementById("progress-bar");
      const rect = bar.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      var dur = progressDur || parseDurationToSec(currentTrack.duration);
      if (!dur) return;
      var t = dur * pct;
      progressSec = t;
      window._progressBase = t;
      progressTickStart = Date.now();
      playbackEnded = false;
      updateProgressUI();
      ytCommand("seekTo", [t, true]);
    }
    function setVolume(e) {
      const bar = document.getElementById("vol-bar");
      const rect = bar.getBoundingClientRect();
      volume = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      localStorage.setItem(LS_VOLUME, String(volume));
      ytCommand("setVolume", [Math.round(volume * 100)]);
      if (volume > 0) ytCommand("unMute");
      updateVolUI();
    }
    function updateVolUI() { document.getElementById("vol-fill").style.width = (volume * 100) + "%"; }
        function fmtTime(s) {
      s = Math.floor(s || 0);
      return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
    }
    function updatePlayIcon() {
      document.getElementById("icon-play").style.display = isPlaying ? "none" : "block";
      document.getElementById("icon-pause").style.display = isPlaying ? "block" : "none";
    }
    function highlightNowPlaying() {
      var id = currentTrack && currentTrack.id;
      document.querySelectorAll(".track-row").forEach(function(row) {
        var rowId = row.getAttribute("data-track-id");
        var on = !!(id && rowId === id);
        row.classList.toggle("playing", on);
      });
      document.querySelectorAll(".card").forEach(function(card) {
        var cardId = card.getAttribute("data-track-id");
        var on = !!(id && cardId === id);
        card.classList.toggle("playing", on);
      });
    }

    function updateNowPlayingUI() {
      const cover = document.getElementById("np-cover");
      const meta = document.getElementById("np-meta");
      const like = document.getElementById("np-like");
      if (!currentTrack) {
        cover.style.display = "none"; meta.style.display = "none"; like.style.display = "none";
        return;
      }
      cover.src = currentTrack.thumbnail || ("https://i.ytimg.com/vi/" + currentTrack.id + "/hqdefault.jpg");
      cover.style.display = "block";
      document.getElementById("np-title").textContent = currentTrack.title || "Unknown";
      document.getElementById("np-artist").textContent = currentTrack.channelName || "Unknown artist";
      meta.style.display = "block";
      like.style.display = "grid";
      const liked = isLiked(currentTrack.id);
      like.classList.toggle("liked", liked);
      like.setAttribute("data-like-id", currentTrack.id);
      like.innerHTML = liked
        ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7-4.5-7-10a4.5 4.5 0 0 1 8.5-2A4.5 4.5 0 0 1 19 11c0 5.5-7 10-7 10z"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-4.5-7-10a4.5 4.5 0 0 1 8.5-2A4.5 4.5 0 0 1 19 11c0 5.5-7 10-7 10z"/></svg>';
          highlightNowPlaying();
    }

    function toggleLikeCurrent() { if (currentTrack) toggleLike(currentTrack); }
    function toggleLike(track) {
      if (!track || !track.id) return;
      rememberTrack(track);
      var full = getTrack(track.id) || track;
      var liked = getLiked();
      var exists = liked.some(function(t) { return t.id === full.id; });
      if (exists) {
        liked = liked.filter(function(t) { return t.id !== full.id; });
        toast("Removed from Liked Songs");
      } else {
        liked.unshift({
          id: full.id,
          title: full.title || "Unknown",
          channelName: full.channelName || "",
          thumbnail: full.thumbnail || ("https://i.ytimg.com/vi/" + full.id + "/hqdefault.jpg"),
          duration: full.duration || null
        });
        toast("Added to Liked Songs");
      }
      saveLiked(liked);

      updateNowPlayingUI();
      renderLibrary();

      try {
        document.querySelectorAll('[data-like-id="' + full.id + '"]').forEach(function(btn) {
          var on = isLiked(full.id);
          btn.classList.toggle("liked", on);

                let title = (lockupMeta && lockupMeta.title && lockupMeta.title.content) || (lockup.metadata && lockup.metadata.title && lockup.metadata.title.content) || "Untitled";
                const sources = (lockup.contentImage && lockup.contentImage.thumbnailViewModel && lockup.contentImage.thumbnailViewModel.image && lockup.contentImage.thumbnailViewModel.image.sources) || [];
                const thumb = (sources.length && sources[sources.length - 1].url) || ("https://i.ytimg.com/vi/" + id + "/hqdefault.jpg");
                let duration = null;
                const overlays = (lockup.contentImage && lockup.contentImage.thumbnailViewModel && lockup.contentImage.thumbnailViewModel.overlays) || [];
                for (let oi = 0; oi < overlays.length; oi++) {
                  const badges = (overlays[oi].thumbnailBottomOverlayViewModel && overlays[oi].thumbnailBottomOverlayViewModel.badges) || [];
                  for (let bi = 0; bi < badges.length; bi++) {
                    const txt = badges[bi].thumbnailBadgeViewModel && badges[bi].thumbnailBadgeViewModel.text;
                    if (txt && /^\d+:\d+/.test(txt)) { duration = txt; break; }
                  }
                  if (duration) break;
                }
                let channelName = null;
                const metaRows = (lockupMeta && lockupMeta.metadata && lockupMeta.metadata.contentMetadataViewModel && lockupMeta.metadata.contentMetadataViewModel.metadataRows) || [];
                for (let ri = 0; ri < metaRows.length; ri++) {
                  const parts = metaRows[ri].metadataParts || [];
                  for (let pi = 0; pi < parts.length; pi++) {
                    const txt = parts[pi].text && parts[pi].text.content;
                    if (txt && !/view|ago|K$|M$/i.test(txt) && !/^\d/.test(txt)) { channelName = txt; break; }
                  }
                  if (channelName) break;
                }
                const meta = { id: id, title: String(title).trim(), thumbnail: thumb, channelName: channelName, duration: duration, isMusic: false };
                meta.isMusic = isMusicVideo(meta, lockup);
                videos.push(meta);
              }
            }
            Object.values(obj).forEach(recurse);
          }
          recurse(data);
        }
      } catch (e) { console.error(e); }
      if (!videos.length) {
        const seen = {};
        const matches = html.matchAll(/"videoId":"([a-zA-Z0-9_-]{11})"/g);
        for (const m of matches) {
          if (!seen[m[1]]) {
            seen[m[1]] = true;
            videos.push({ id: m[1], title: "Track", thumbnail: "https://i.ytimg.com/vi/" + m[1] + "/hqdefault.jpg", channelName: null, duration: null, isMusic: false });
          }
        }
      }
      const unique = [], seenIds = {};
      for (let i = 0; i < videos.length; i++) {
        if (!seenIds[videos[i].id]) { seenIds[videos[i].id] = true; unique.push(videos[i]); }
      }
      return unique;
    }

    function showTrackCtx(e, track) {
      ctxTrack = track;
      const liked = isLiked(track.id);
      const ctx = document.getElementById("ctx");
      ctx.innerHTML =
        '<div class="ctx-item" onclick="playTrack(ctxTrack); hideCtx()">Play now</div>' +
        '<div class="ctx-item" onclick="toggleLike(ctxTrack); hideCtx()">' + (liked ? "Remove from Liked Songs" : "Add to Liked Songs") + '</div>' +
        '<div class="ctx-item" onclick="openAddToPlaylist(ctxTrack); hideCtx()">Add to playlist</div>' +
        '<div class="ctx-sep"></div>' +
        '<div class="ctx-item" onclick="navigator.clipboard.writeText(\'https://www.youtube.com/watch?v=\'+ctxTrack.id); toast(\'Link copied\'); hideCtx()">Copy link</div>';
      positionCtx(e);
    }
    function showPlaylistCtx(e, plId) {
      const ctx = document.getElementById("ctx");
      ctx.innerHTML = '<div class="ctx-item danger" onclick="if(confirm(\'Delete playlist?\')){deletePlaylist(\'' + plId + '\');hideCtx()}">Delete playlist</div>';
      positionCtx(e);
    }
    function positionCtx(e) {
      const ctx = document.getElementById("ctx");
      ctx.classList.add("show");
      let x = e.clientX, y = e.clientY;
      const r = ctx.getBoundingClientRect();
      if (x + r.width > innerWidth) x = innerWidth - r.width - 8;
      if (y + r.height > innerHeight) y = innerHeight - r.height - 8;
      ctx.style.left = x + "px";
      ctx.style.top = y + "px";
    }
    function hideCtx() { document.getElementById("ctx").classList.remove("show"); }
    document.addEventListener("click", hideCtx);

    function escapeHtml(t) {
      const d = document.createElement("div");
      d.textContent = t == null ? "" : String(t);
      return d.innerHTML;
    }
    function toast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(function() { t.classList.remove("show"); }, 2200);
    }

    document.getElementById("search-input").addEventListener("keydown", function(e) {
      if (e.key === "Enter") doSearch(e.target.value);
    });
    document.getElementById("playlist-name-input").addEventListener("keydown", function(e) {
      if (e.key === "Enter") confirmCreatePlaylist();
    });
    document.addEventListener("keydown", function(e) {
      if (e.target.tagName === "INPUT") return;
      if (e.code === "Space") { e.preventDefault(); togglePlay(); }
    });

    updateVolUI();

    (function() {
      var btn = document.getElementById("btn-repeat");
      if (btn) { btn.classList.add("active"); btn.title = "Repeat all"; }
    })();
    getLiked().forEach(rememberTrack);
    getPlaylists().forEach(pl => (pl.tracks || []).forEach(rememberTrack));
    getRecent().forEach(rememberTrack);
    renderLibrary();
    navigate("home");
  </script>
</body>
</html>
