<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPhone Share</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        #status {
            padding: 15px;
            background: #1a1a1a;
            border-bottom: 1px solid #333;
            text-align: center;
            font-size: 14px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #status.connected { background: #1a472a; color: #4ade80; }
        #status.connecting { background: #1a3a4a; color: #60a5fa; }
        #status.error { background: #4a1a1a; color: #f87171; }
        
        #localVideo {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #111;
        }
        
        .controls {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }
        
        .btn {
            padding: 18px 24px;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        
        .btn-primary {
            background: #007AFF;
            color: white;
        }
        
        .btn-primary:active { background: #0051D5; transform: scale(0.98); }
        .btn-primary:disabled { background: #333; color: #666; }
        
        .btn-danger {
            background: #FF3B30;
            color: white;
        }

        .btn-secondary {
            background: #333;
            color: #fff;
            font-size: 15px;
            padding: 12px 18px;
        }
        
        .info-box {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            word-break: break-all;
        }
        
        .info-box label {
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .room-display {
            font-size: 32px;
            font-weight: bold;
            margin-top: 5px;
            color: #007AFF;
            text-align: center;
            letter-spacing: 4px;
        }
        
        .hidden { display: none !important; }
        
        .log {
            font-size: 11px;
            color: #666;
            font-family: monospace;
            max-height: 100px;
            overflow-y: auto;
            background: #0a0a0a;
            padding: 10px;
            border-radius: 8px;
        }

        .camera-switch {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }
        .camera-switch button {
            flex: 1;
        }
    </style>
</head>
<body>
    <div id="status">Ready to share</div>
    
    <video id="localVideo" autoplay muted playsinline></video>
    
    <div class="controls">
        <button id="startBtn" class="btn btn-primary">Start Screen Share</button>
        <button id="stopBtn" class="btn btn-danger hidden">Stop Sharing</button>
        
        <div class="info-box" id="roomBox" style="display: none;">
            <label>Your Room ID</label>
            <div class="room-display" id="roomId">---</div>
            <div style="margin-top: 10px; font-size: 12px; color: #888; text-align: center;">
                Enter this ID on your Chromebook
            </div>
        </div>
        
        <div class="info-box" id="instructions">
            <strong>Instructions:</strong><br>
            1. Tap "Start Screen Share"<br>
            2. Select "Screen" when prompted<br>
            3. Start Broadcast<br>
            4. Enter the Room ID on your Chromebook
        </div>
        
        <div class="log" id="log"></div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script>
        const statusEl = document.getElementById('status');
        const localVideo = document.getElementById('localVideo');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const roomIdEl = document.getElementById('roomId');
        const roomBox = document.getElementById('roomBox');
        const logEl = document.getElementById('log');
        const instructionsEl = document.getElementById('instructions');
        
        let peer = null;
        let stream = null;
        let activeCalls = new Map();
        let activeConnections = new Map();
        let currentFacingMode = 'environment'; // back camera by default on mobile
        let isScreenSupported = !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia);

        // Detect iOS / mobile for better UX messaging
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || 
                      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

        function log(msg) {
            console.log(msg);
            const div = document.createElement('div');
            div.textContent = `${new Date().toLocaleTimeString()}: ${msg}`;
            logEl.insertBefore(div, logEl.firstChild);
            if (logEl.children.length > 20) logEl.lastChild.remove();
        }
        
        function updateStatus(text, type = '') {
            statusEl.textContent = text;
            statusEl.className = type;
            log(`Status: ${text}`);
        }
        
        function generateId() {
            return Math.random().toString(36).substring(2, 8).toUpperCase();
        }
        
        function getOrientation() {
            if (screen.orientation) {
                return screen.orientation.type.includes('landscape') ? 'landscape' : 'portrait';
            }
            if (window.orientation !== undefined) {
                return Math.abs(window.orientation) === 90 ? 'landscape' : 'portrait';
            }
            return window.innerWidth > window.innerHeight ? 'landscape' : 'portrait';
        }
        
        function broadcastOrientation() {
            const orientation = getOrientation();
            activeConnections.forEach((conn) => {
                if (conn.open) {
                    conn.send({ type: 'orientation', orientation });
                }
            });
        }
        
        function setupOrientationTracking() {
            if (screen.orientation) {
                screen.orientation.addEventListener('change', broadcastOrientation);
            }
            window.addEventListener('orientationchange', () => {
                setTimeout(broadcastOrientation, 100);
            });
            window.addEventListener('resize', broadcastOrientation);
            broadcastOrientation();
        }

        // Update UI based on whether screen share is available
        function updateUIForCapability() {
            if (!isScreenSupported) {
                startBtn.textContent = 'Start Camera Share';
                instructionsEl.innerHTML = `
                    <strong>iPhone note:</strong><br>
                    Screen sharing is <em>not supported</em> in Safari on iPhone/iPad.<br><br>
                    This page will share your <strong>camera</strong> instead (works great over PeerJS).<br><br>
                    1. Tap "Start Camera Share"<br>
                    2. Allow camera access<br>
                    3. Enter the Room ID on your Chromebook
                `;
            } else {
                startBtn.textContent = 'Start Screen Share';
                instructionsEl.innerHTML = `
                    <strong>Instructions:</strong><br>
                    1. Tap "Start Screen Share"<br>
                    2. Select "Screen" when prompted<br>
                    3. Start Broadcast<br>
                    4. Enter the Room ID on your Chromebook
                `;
            }
        }
        
        function initPeer() {
            const id = generateId();
            roomIdEl.textContent = id;
            
            log('Initializing peer with ID: ' + id);
            
            peer = new Peer(id, {
                host: '0.peerjs.com',
                port: 443,
                secure: true,
                debug: 2,
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' }
                    ]
                }
            });
            
            peer.on('open', (id) => {
                updateStatus(`Ready - Room: ${id}`, 'connecting');
                roomBox.style.display = 'block';
                log('Peer opened with ID: ' + id);
                setupOrientationTracking();
            });
            
            peer.on('connection', (conn) => {
                log('Data connection from: ' + conn.peer);
                activeConnections.set(conn.peer, conn);
                
                conn.on('data', (data) => {
                    log('Received: ' + JSON.stringify(data));
                    if (data.type === 'request-stream' && stream) {
                        startStreamingTo(conn.peer);
                    }
                    if (data.type === 'request-orientation') {
                        conn.send({
                            type: 'orientation',
                            orientation: getOrientation()
                        });
                    }
                });
                
                conn.on('close', () => activeConnections.delete(conn.peer));
                conn.on('error', () => activeConnections.delete(conn.peer));
                
                conn.on('open', () => {
                    conn.send({
                        type: 'orientation',
                        orientation: getOrientation()
                    });
                });
            });
            
            peer.on('call', (call) => {
                log('Incoming call from: ' + call.peer);
                if (stream) {
                    call.answer(stream);
                    activeCalls.set(call.peer, call);
                    updateStatus('Viewer connected!', 'connected');
                    
                    call.on('close', () => {
                        log('Call closed: ' + call.peer);
                        activeCalls.delete(call.peer);
                        if (activeCalls.size === 0) {
                            updateStatus('Viewer disconnected', 'connecting');
                        }
                    });
                    
                    call.on('error', (err) => {
                        log('Call error: ' + (err.message || err));
                    });
                } else {
                    log('No stream available, rejecting call');
                    call.close();
                }
            });
            
            peer.on('error', (err) => {
                log('Peer error: ' + err.message);
                updateStatus('Error: ' + err.message, 'error');
            });
            
            peer.on('disconnected', () => {
                log('Peer disconnected, reconnecting...');
                peer.reconnect();
            });
        }
        
        async function startShare() {
            try {
                updateStatus(isScreenSupported ? 'Requesting screen capture...' : 'Requesting camera...', 'connecting');
                
                if (isScreenSupported) {
                    // Desktop / supported browsers
                    stream = await navigator.mediaDevices.getDisplayMedia({
                        video: {
                            width: { ideal: 1920 },
                            height: { ideal: 1080 },
                            frameRate: { ideal: 30 }
                        },
                        audio: false
                    });
                } else {
                    // iPhone / unsupported → camera fallback
                    stream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: { ideal: currentFacingMode },
                            width: { ideal: 1280 },
                            height: { ideal: 720 },
                            frameRate: { ideal: 30 }
                        },
                        audio: false
                    });
                }
                
                localVideo.srcObject = stream;
                // Critical for iOS
                localVideo.setAttribute('playsinline', true);
                localVideo.muted = true;
                await localVideo.play().catch(() => {}); // silence autoplay promise rejection
                
                log('Stream obtained successfully');
                
                // When user stops the share from the browser UI
                const videoTrack = stream.getVideoTracks()[0];
                if (videoTrack) {
                    videoTrack.onended = () => {
                        log('Share stopped by user');
                        stopShare();
                    };
                }
                
                startBtn.classList.add('hidden');
                stopBtn.classList.remove('hidden');
                updateStatus(
                    isScreenSupported ? 'Screen captured! Waiting for viewer...' : 'Camera live! Waiting for viewer...',
                    'connected'
                );

                // Optional: add front/back switcher when using camera
                if (!isScreenSupported) {
                    addCameraSwitcher();
                }
                
            } catch (err) {
                console.error(err);
                log('Error getting media: ' + err.name + ' – ' + err.message);
                
                let friendly = err.message;
                if (err.name === 'NotAllowedError') {
                    friendly = 'Permission denied. Please allow camera/screen access.';
                } else if (err.name === 'NotFoundError') {
                    friendly = 'No camera found.';
                } else if (err.name === 'NotSupportedError' || !navigator.mediaDevices) {
                    friendly = 'Media capture not supported in this browser.';
                }
                
                updateStatus('Failed: ' + friendly, 'error');
            }
        }

        function addCameraSwitcher() {
            // Avoid duplicates
            if (document.getElementById('camSwitch')) return;
            
            const box = document.createElement('div');
            box.id = 'camSwitch';
            box.className = 'camera-switch';
            box.innerHTML = `
                <button class="btn btn-secondary" id="frontCam">Front Camera</button>
                <button class="btn btn-secondary" id="backCam">Back Camera</button>
            `;
            stopBtn.after(box);
            
            document.getElementById('frontCam').onclick = () => switchCamera('user');
            document.getElementById('backCam').onclick = () => switchCamera('environment');
        }

        async function switchCamera(facingMode) {
            if (!stream) return;
            currentFacingMode = facingMode;
            
            // Stop old tracks
            stream.getTracks().forEach(t => t.stop());
            
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { ideal: facingMode },
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });
                localVideo.srcObject = stream;
                await localVideo.play().catch(() => {});
                
                // Re-send the new stream to all current viewers
                activeCalls.forEach((call, peerId) => {
                    call.close();
                    startStreamingTo(peerId);
                });
                
                log('Switched to ' + (facingMode === 'user' ? 'front' : 'back') + ' camera');
            } catch (err) {
                log('Camera switch failed: ' + err.message);
                updateStatus('Camera switch failed', 'error');
            }
        }
        
        function startStreamingTo(peerId) {
            if (!stream || !peer) return;
            log('Starting stream to: ' + peerId);
            const call = peer.call(peerId, stream);
            activeCalls.set(peerId, call);
            
            call.on('close', () => activeCalls.delete(peerId));
            call.on('error', (err) => log('Stream call error: ' + (err.message || err)));
        }
        
        function stopShare() {
            activeCalls.forEach(call => call.close());
            activeCalls.clear();
            
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            
            localVideo.srcObject = null;
            startBtn.classList.remove('hidden');
            stopBtn.classList.add('hidden');
            
            const camSwitch = document.getElementById('camSwitch');
            if (camSwitch) camSwitch.remove();
            
            updateStatus('Sharing stopped', '');
        }
        
        startBtn.addEventListener('click', startShare);
        stopBtn.addEventListener('click', stopShare);
        
        // Init
        updateUIForCapability();
        if (!window.isSecureContext) {
            updateStatus('Warning: Must be served over HTTPS', 'error');
            log('Not a secure context – getUserMedia / getDisplayMedia will fail');
        }
        initPeer();
    </script>
</body>
</html>
