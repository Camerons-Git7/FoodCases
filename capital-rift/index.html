
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capital Rift</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="alternate icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<!-- Self-hosted (2026-07-15). Was fonts.googleapis.com, which handed Google every
     visitor's IP + UA on load, before consent, on the page that also takes payment.
     Same woff2 bytes Google served; regenerate per docs/deploy.md. -->
<link rel="stylesheet" href="/theme/fonts.css">
<style>
  :root {
    --cr-bg: #161618;
    --cr-radius: 4px; /* ONE corner radius for every box on the page (Nik 2026-07-09) */
    --cr-panel-bg: rgba(34,34,38,0.62);
    --cr-surface: rgba(38,38,42,0.8);
    --cr-surface-2: rgba(50,50,55,0.92);
    --cr-rim: #38383d;
    --cr-rim-lit: #4c4c52;
    /* Box outlines are OFF (Nik 2026-08-09: "remove the light outlines around all
       the boxes, it looks tacky"). The 1px is kept so nothing reflows; flip these
       back to --cr-rim / --cr-rim-lit to restore the outlined look. Dividers keep
       --cr-rim, and metal controls keep their own #b4b4b4 edge. */
    --cr-edge: transparent;
    --cr-edge-lit: transparent;
    /* Separator lines are off too (Nik 2026-08-09, right after the outlines):
       the 1px stays so nothing shifts, one flip brings every divider back. */
    --cr-rule: transparent;
    --cr-text: #d7d7d7;
    --cr-bright: #ececec;
    --cr-ink: #cfcfcf;
    --cr-muted: #9b9b9b;
    --cr-label: #949494;
    --cr-faint: #808080;
    --cr-green: #34d399;
    --cr-green-bg: rgba(52,211,153,0.12);
    --cr-red: #f87171;
    --cr-red-bg: rgba(248,113,113,0.12);
    --cr-gold: #fbbf24;
    --cr-gold-bg: rgba(251,191,36,0.12);
    --cr-metal: linear-gradient(180deg, #f4f4f4, #d4d4d4);
    --cr-metal-hover: linear-gradient(180deg, #ffffff, #e2e2e2);
    --cr-display: 'Lilita One', cursive;
    --cr-mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  html, body { margin: 0; background: var(--cr-bg); }
  #root { min-height: 100vh; }
  ::placeholder { color: #808080; font-family: 'Nunito', sans-serif; font-weight: 600; }

  .cr-word {
    font-family: var(--cr-display); letter-spacing: 2px; line-height: 1.05; white-space: nowrap;
    background: linear-gradient(95deg, #54d6a0 5%, #6fe0b4 30%, #a974f5 75%);
    background-size: 220% 100%; -webkit-background-clip: text; background-clip: text;
    color: transparent; animation: cr-wordflow 9s ease-in-out infinite;
    filter: drop-shadow(0 12px 32px rgba(0, 0, 0, 0.55));
  }
  /* Border methodology (Nik 2026-07-09): boxes are FILLS, not outlines. Only the
     outer glass panel keeps a 1px rim (it is the window frame) and metal-material
     controls keep their lit metal edge. Inputs are borderless wells (focus ring
     only); the DELETE-confirm input keeps a red outline as a danger signal. */
  .cr-input {
    width: 100%; box-sizing: border-box; font-family: 'Nunito', sans-serif; font-weight: 600;
    font-size: 14.5px; color: var(--cr-text); padding: 11px 13px; border: 1px solid transparent;
    border-radius: var(--cr-radius); background: #121214; outline: none; transition: border-color 0.15s, box-shadow 0.15s;
  }
  .cr-input:focus { box-shadow: 0 0 0 3px rgba(255,255,255,0.08); }
  .cr-input:disabled { cursor: not-allowed; opacity: 0.55; }
  .cr-input.mono { font-family: var(--cr-mono); font-size: 14px; }
  .cr-input.reddanger { border-color: rgba(248,113,113,0.4); font-family: var(--cr-mono); font-size: 13px; }
  .cr-input.reddanger:focus { border-color: var(--cr-red); box-shadow: 0 0 0 3px rgba(248,113,113,0.12); }
  .cr-btn-metal {
    font-family: var(--cr-display); letter-spacing: 1px; color: #0c0c0c; border-radius: var(--cr-radius);
    border: 1px solid #b4b4b4; background: var(--cr-metal);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.85), 0 2px 8px rgba(0,0,0,0.4);
    cursor: pointer; transition: background 0.14s, transform 0.08s;
  }
  .cr-btn-metal:hover:not(:disabled) { background: var(--cr-metal-hover); }
  .cr-btn-metal:active:not(:disabled) { transform: translateY(1px) scale(0.99); }
  .cr-btn-metal:disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(1); }
  .cr-btn-metal.goldfull { background: var(--cr-gold-bg); border: 1px solid transparent; color: var(--cr-gold); box-shadow: none; opacity: 1; filter: none; cursor: not-allowed; }
  .cr-btn-ghost {
    font-family: 'Nunito', sans-serif; font-weight: 800; border: 1px solid transparent;
    border-radius: var(--cr-radius); background: var(--cr-surface-2); color: var(--cr-ink); cursor: pointer;
    transition: background 0.14s, color 0.14s;

  .cr-btn-ghost:hover { background: rgba(255,255,255,0.08); color: var(--cr-bright); }
  .cr-btn-ghost.dangersoft:hover { background: var(--cr-red-bg); color: var(--cr-red); }
  .cr-btn-ghost.dangerarm { color: var(--cr-red); }
  .cr-btn-ghost.dangerarm:hover { background: var(--cr-red); color: #ffffff; }
  .cr-btn-confirm-dead { background: var(--cr-surface-2); border: 1px solid transparent; color: var(--cr-faint); cursor: not-allowed; opacity: 0.6; }
  .cr-btn-confirm-live { background: var(--cr-red); border: 1px solid transparent; color: #ffffff; cursor: pointer; }
  .cr-link { cursor: pointer; }
  .cr-link:hover { color: var(--cr-bright) !important; }

  .cr-legal { color: inherit; text-decoration: none; }

    text-align: left; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 13.5px;
    padding: 10px 12px; border-radius: var(--cr-radius); cursor: pointer; background: transparent;

    border: none; background: rgba(255,255,255,0.03); color: var(--cr-ink);

  .cr-tgl {
    position: relative; width: 42px; height: 24px; border-radius: 999px; cursor: pointer; flex-shrink: 0;
    transition: background 0.2s; background: var(--cr-surface-2); border: 1px solid transparent;
  }

  .cr-tgl.on .knob { left: 20px; background: #1a1a1a; }
  .cr-acct-grid { display: grid; grid-template-columns: 208px 1fr; min-height: 520px; }
  .cr-acct-rail {
    border-right: 1px solid var(--cr-rule); padding: 16px 12px; display: flex; flex-direction: column;
    gap: 4px; background: rgba(22, 22, 25, 0.35);

  @media (max-width: 760px) {
    .cr-acct-grid { grid-template-columns: 1fr; }
    .cr-acct-rail { flex-direction: row; flex-wrap: wrap; border-right: none; border-bottom: 1px solid var(--cr-rule); align-items: center; }
  }

  @keyframes cr-wordflow { 0%, 100% { background-position: 0% 0; } 50% { background-position: 100% 0; } }
  @keyframes crBob { 0%, 100% { transform: rotate(2deg); } 50% { transform: rotate(6deg); } }

    50% { transform: translate(-5vw, 4vh) scale(0.9) rotate(-10deg); border-radius: 42% 58% 56% 44% / 60% 40% 56% 44%; }
    100% { transform: translate(4vw, -3vh) scale(1.22) rotate(6deg); border-radius: 58% 42% 48% 52% / 44% 56% 42% 58%; }
  }

    0% { transform: translate(0, 0) scale(0.95) rotate(0deg); border-radius: 50% 50% 45% 55% / 52% 48% 55% 45%; }
    50% { transform: translate(3vw, 5vh) scale(1.15) rotate(12deg); border-radius: 62% 38% 52% 48% / 40% 62% 46% 54%; }
    100% { transform: translate(-4vw, -4vh) scale(1) rotate(-8deg); border-radius: 45% 55% 58% 42% / 58% 42% 50% 50%; }
  }
  /* Global rule: all decorative motion stops under reduced-motion. */
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>

/*

  A faithful port of the "Capital Rift Access" Claude Design mockup: the auth gate

  player account portal, the checkout modal, the toast, and the bottom ticker.

  What differs from the mockup, because it is real here:
    - Auth is Google only (oauth2-proxy at play.capitalrift.com, cookie scoped to
      .capitalrift.com). The email/password form was REMOVED 2026-07-09 (Nik call:
      Google-only during the closed beta as a security stance, said so on-page);
      other sign-in options return with the full release (Access.v2 cutover must
      restore the form UI, see docs/access-v2.md + git history of this file).
    - The bottom ticker renders REAL live-world stats (status.world from
      /api/access/status: players/carts/leases/net worth/24h GDP + the exchange's
      fixed commodity quotes). Zero-valued stats are skipped, never shown as 0.
    - UI methodology (Nik 2026-07-09, applies to future Capital Rift UI too):
      ONE small corner radius everywhere (--cr-radius), icons are never boxed or
      bordered, short helper text is icon + text (no box), and inner cards are
      borderless fills; only the outer glass panel and metal controls keep edges.
    - The card form in the checkout modal is replaced by Stripe HOSTED Checkout:
      the modal is an order summary whose PAY button redirects to Stripe. No card
      data ever touches this page. The PayPal tab is dropped (not available on our
      Stripe account region).
    - Gate state (coming_soon | countdown | open, price, servers full, players
      online) is SERVER driven: GET /api/access/status, flipped live via the
      server CLI (pnpm gate ...), no page edits needed.
    - The account portal is real: profile rename, notification prefs, purchase
      receipt, type-DELETE account deletion. Security is honest about Google-only
      auth (no fake password/2FA controls); sessions list is this device only.

  Wiring: /api/* on THIS origin (nginx proxies with the oauth2-proxy identity
  header; capitalrift.com carries the same session cookie as play.). Google flow
  starts on play. (which owns oauth2-proxy) and returns here via rd.
*/

var e = React.createElement;

/* ------------------------------------------------------------------ topology */

var IS_APEX = (window.location.hostname === 'capitalrift.com' || window.location.hostname === 'www.capitalrift.com');

var GATE_ORIGIN = IS_APEX ? 'https://capitalrift.com' : window.location.origin;
var PLAY_URL = 'https://play.capitalrift.com/';

function destAllowed(rd) {
  try {
    var u = new URL(rd, window.location.origin);
    if (u.protocol !== 'https:') return false;
    if (rd.indexOf(window.location.origin) === 0) return true;
    return u.hostname === 'capitalrift.com' || u.hostname === 'www.capitalrift.com' || u.hostname.endsWith('.capitalrift.com');
  } catch (err) { return false; }
}
function requestedRd() {
  try {
    var rd = new URLSearchParams(window.location.search).get('rd');
    if (rd && destAllowed(rd)) return rd;
  } catch (err) {}
  return null;
}
/* Where ENTER THE RIFT goes: the rd the visitor arrived with (a bounced play URL), else play. */
function riftDest() { return requestedRd() || PLAY_URL; }

/* After Google, always come back HERE first (the gate routes by access state),
   carrying the original rd forward so a bounced play visit still ends in the game. */
function googleStart() {
  var back = GATE_ORIGIN + '/';
  var rd = requestedRd();
  if (rd) back += '?rd=' + encodeURIComponent(rd);
  window.location.href = OAUTH_BASE + '/oauth2/start?rd=' + encodeURIComponent(back);
}
function signOut() {
  var done = function () {
    window.location.href = OAUTH_BASE + '/oauth2/sign_out?rd=' + encodeURIComponent(GATE_ORIGIN + '/');
  };
  // Clear the Access.v2 email-account cookie first (harmless if there is none), then
  // run the oauth2-proxy sign-out (clears a Google session, or just bounces to the gate).
  try { api('/auth/logout', { method: 'POST' }).then(done, done); } catch (e) { done(); }
}

/* ------------------------------------------------------------------ api ----- */

function api(path, opts) {
  opts = opts || {};
  var init = { method: opts.method || 'GET', credentials: 'same-origin', headers: {} };
  if (opts.body !== undefined) {
    init.headers['content-type'] = 'application/json';
    init.body = JSON.stringify(opts.body);
  }
  return fetch('/api' + path, init).then(function (res) {
    return res.json().catch(function () { return null; }).then(function (body) {
      return { status: res.status, ok: res.ok, body: body };
    });
  }, function () { return { status: 0, ok: false, body: null }; });
}

/* ------------------------------------------------------------------ helpers - */

var REDUCED_MOTION = false;
try { REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (err) {}

var styleMemo = new Map();
function s(css) {
  var hit = styleMemo.get(css);
  if (hit) return hit;
  var o = {};
  css.split(';').forEach(function (d) {
    var i = d.indexOf(':');
    if (i < 0) return;
    var k = d.slice(0, i).trim();
    var v = d.slice(i + 1).trim();
    if (!k) return;
    var ck = k.indexOf('--') === 0 ? k : k.replace(/-([a-z])/g, function (m, c) { return c.toUpperCase(); });
    o[ck] = v;
  });

  return o;
}

function pad2(n) { return (n < 10 ? '0' : '') + n; }
function fmtMoney(cents) { return '$' + (cents / 100).toFixed(2); }
function fmtMoneyShort(cents) { return cents % 100 === 0 ? '$' + (cents / 100) : fmtMoney(cents); }
/* Compact in-game money for the ticker ($87.8K / $4.1M style; n is DOLLARS). */
function fmtStat(n) {
  var t = function (x) { var f = x.toFixed(1); return f.slice(-2) === '.0' ? f.slice(0, -2) : f; };
  if (n >= 1e9) return '$' + t(n / 1e9) + 'B';
  if (n >= 1e6) return '$' + t(n / 1e6) + 'M';
  if (n >= 1e3) return '$' + t(n / 1e3) + 'K';

}
function fmtDateLong(iso) {
  try {
    return new Date(iso).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  } catch (err) { return iso; }
}

  try {
    return new Date(iso).toLocaleDateString('en-US', { year: 'numeric', month: 'long' });
  } catch (err) { return iso; }
}
/* The real current device, parsed from the user agent. We cannot enumerate a

   session store), so the sessions list is honestly the current browser only. */
function deviceLabel() {
  var ua = (navigator && navigator.userAgent) || '';
  var browser = /Edg\//.test(ua) ? 'Edge'
    : /OPR\/|Opera/.test(ua) ? 'Opera'
    : /Firefox\//.test(ua) ? 'Firefox'
    : /Chrome\//.test(ua) ? 'Chrome'
    : /Safari\//.test(ua) ? 'Safari'
    : 'Browser';
  var os = /Windows/.test(ua) ? 'Windows'
    : /Android/.test(ua) ? 'Android'
    : /(iPhone|iPad|iPod)/.test(ua) ? 'iOS'
    : /Mac OS X|Macintosh/.test(ua) ? 'macOS'
    : /Linux/.test(ua) ? 'Linux'

}

/* Shared style strings. The PANEL keeps its 1px rim (window frame); chips are
   borderless tinted fills at the shared radius. */
var PANEL = 'position:relative;background:var(--cr-panel-bg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--cr-edge);border-radius:var(--cr-radius);box-shadow:inset 0 1px 0 rgba(255,255,255,0.05), 0 18px 48px rgba(0,0,0,0.45)';
var ROWLBL = 'font-size:13.5px;font-weight:700;color:var(--cr-muted)';
var ROWVAL = 'font-family:var(--cr-mono);font-weight:600;font-size:13px;color:var(--cr-ink)';
var CHIP_GREEN = 'font-family:var(--cr-mono);font-size:10px;font-weight:700;letter-spacing:1.2px;padding:4px 9px;border-radius:var(--cr-radius);background:var(--cr-green-bg);color:var(--cr-green)';
var CHIP_GOLD = 'font-family:var(--cr-mono);font-size:10px;font-weight:700;letter-spacing:1.2px;padding:4px 9px;border-radius:var(--cr-radius);background:var(--cr-gold-bg);color:var(--cr-gold)';
var CHIP_GREY = 'font-family:var(--cr-mono);font-size:10px;font-weight:700;letter-spacing:1.2px;padding:4px 9px;border-radius:var(--cr-radius);background:var(--cr-surface-2);color:var(--cr-muted)';
var MONOLBL = 'font-family:var(--cr-mono);font-size:10px;letter-spacing:1.4px;color:var(--cr-label)';
var GLOGO = 'font-family:var(--cr-display);font-size:16px;background:linear-gradient(95deg,#54d6a0,#a974f5);-webkit-background-clip:text;background-clip:text;color:transparent';

/* player avatar presets (id -> gradient); shared by the account portal + purchase screen */
var AVATARS = {
  white: 'linear-gradient(135deg, #ffffff, #dfe4ea)',
  crown: 'linear-gradient(135deg, #fef3c7, #fbbf24 45%, #d97706)',
};
var AVATAR_IDS = ['white'];
function avatarGrad(id) { return AVATARS[id] || AVATARS.white; }
/* Two initials, intelligently chosen: first letter of the first + last word, else

function initials(name) {
  var parts = String(name || '').trim().split(/\s+/).filter(Boolean);
  var pick = function (w) { var m = w.match(/[A-Za-z0-9]/); return m ? m[0] : (w.charAt(0) || ''); };

  if (parts.length === 1) {
    var m = parts[0].match(/[A-Za-z0-9]/g);
    if (m && m.length >= 2) return (m[0] + m[1]).toUpperCase();
    if (m && m.length === 1) return m[0].toUpperCase();

/* The ring is reserved for a net-worth tint (set in-game), so it stays neutral here
   and is NOT user-selectable. The chosen skin colors the two-letter monogram text;
   'crown' is the VIP-only gold skin (with a crown). */
var SKIN_STOPS = {
  white: [['0', '#ffffff'], ['1', '#dfe4ea']],

/* Monogram is SVG <text> with a gradient fill (NOT background-clip:text, which

  var gid = 'avsk-' + skinId + '-' + size;
  var cid = 'avcr-' + size;
  return e('div', { style: {
    position: 'relative', width: size + 'px', height: size + 'px', borderRadius: '999px', flexShrink: 0,
    boxSizing: 'border-box', background: 'var(--cr-surface-2)',
    border: r + 'px solid var(--cr-edge-lit)', display: 'grid', placeItems: 'center',
  } },
    e('svg', { width: inner, height: inner, viewBox: '0 0 100 100', 'aria-hidden': 'true', style: { display: 'block' } },
      e('defs', null,
        e('linearGradient', { id: gid, x1: '0', y1: '0', x2: '1', y2: '1' },
          stops.map(function (st, i) { return e('stop', { key: i, offset: st[0], stopColor: st[1] }); }))),
      e('text', { x: '50', y: '50', textAnchor: 'middle', dominantBaseline: 'central', fill: 'url(#' + gid + ')',
        style: { fontFamily: "'Lilita One', cursive", fontSize: '48px', letterSpacing: '1px' } }, initials(name))),
    crown && size >= 52
      ? e('svg', { width: Math.round(size * 0.34), height: Math.round(size * 0.34), viewBox: '0 0 24 24', 'aria-hidden': 'true',
          style: { position: 'absolute', top: '-' + Math.round(size * 0.15) + 'px', left: '50%', transform: 'translateX(-50%)', filter: 'drop-shadow(0 1px 2px rgba(0,0,0,0.55))' } },
          e('defs', null, e('linearGradient', { id: cid, x1: '0', y1: '0', x2: '1', y2: '1' },
            e('stop', { offset: '0', stopColor: '#fde68a' }), e('stop', { offset: '1', stopColor: '#d97706' }))),

}

function secHeader(title, sub) {
  return e('div', { style: s('display:flex;flex-direction:column;gap:2px') },
    e('div', { style: s('font-family:var(--cr-display);font-size:21px;color:var(--cr-bright)') }, title),
    e('div', { style: s('font-size:13px;font-weight:600;color:var(--cr-muted)') }, sub));
